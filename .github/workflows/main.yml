name: Layer7 Store Cloud PC (VNC)

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: 'Mã đơn hàng'
        required: true
        type: string
      hours:
        description: 'Số giờ thuê (1-5)'
        required: true
        default: '3'
        type: string

permissions:
  actions: write
  contents: read

jobs:
  deploy-instance:
    runs-on: windows-2025
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Initialize workspace
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $work = 'C:\Layer7'
          $temp = Join-Path $work 'temp'
          New-Item -ItemType Directory -Path $work,$temp -Force | Out-Null
          "WORK_DIR=$work" >> $env:GITHUB_ENV
          "TEMP_DIR=$temp" >> $env:GITHUB_ENV

      - name: Generate Passwords
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $upper = 'ABCDEFGHJKLMNPQRSTUVWXYZ'
          $lower = 'abcdefghijkmnopqrstuvwxyz'
          $digits = '23456789'
          
          $pass = @(
            $upper[(Get-Random -Maximum $upper.Length)]
            $lower[(Get-Random -Maximum $lower.Length)]
            $digits[(Get-Random -Maximum $digits.Length)]
          )
          $allChars = $upper + $lower + $digits
          for ($i = 0; $i -lt 10; $i++) {
              $pass += $allChars[(Get-Random -Maximum $allChars.Length)]
          }
          $password = -join ($pass | Sort-Object { Get-Random })
          
          "GENERATED_PASSWORD=$password" >> $env:GITHUB_ENV
          "RDP_USERNAME=Layer7Store" >> $env:GITHUB_ENV
          # VNC chỉ hỗ trợ tối đa 8 ký tự
          "VNC_PASSWORD=$($password.Substring(0,8))" >> $env:GITHUB_ENV

      - name: Setup Windows account
        shell: powershell
        run: |
          try {
              $seceditFile = "$env:TEMP\secpol.inf"
              $seceditContent = @("[Unicode]", "Unicode=yes", "[System Access]", "PasswordComplexity = 0", "MinimumPasswordLength = 0")
              Set-Content -Path $seceditFile -Value $seceditContent -Encoding Unicode
              $null = secedit /configure /db "$env:TEMP\secpol.sdb" /cfg $seceditFile /areas SECURITYPOLICY 2>&1
              Remove-Item $seceditFile -Force -ErrorAction SilentlyContinue
              
              $secure = ConvertTo-SecureString "$env:GENERATED_PASSWORD" -AsPlainText -Force
              $user = Get-LocalUser -Name $env:RDP_USERNAME -ErrorAction SilentlyContinue
              if ($null -eq $user) {
                New-LocalUser -Name $env:RDP_USERNAME -Password $secure -PasswordNeverExpires -AccountNeverExpires -FullName 'Layer7 Store' -ErrorAction SilentlyContinue
              } else {
                Set-LocalUser -Name $env:RDP_USERNAME -Password $secure -ErrorAction SilentlyContinue
              }
              Add-LocalGroupMember -Group 'Administrators' -Member $env:RDP_USERNAME -ErrorAction SilentlyContinue
          } catch { Write-Host "Warning: $_" }
          exit 0

      - name: Download TightVNC
        shell: powershell
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Downloading TightVNC..."
          Invoke-WebRequest -Uri "https://www.tightvnc.com/download/2.8.84/tightvnc-2.8.84-gpl-setup-64bit.msi" -OutFile "$env:TEMP_DIR\tightvnc.msi" -UseBasicParsing

      - name: Install TightVNC silently
        shell: powershell
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Installing TightVNC..."
          $p = Start-Process -FilePath "msiexec.exe" -ArgumentList "/i `"$env:TEMP_DIR\tightvnc.msi`" /qn /norestart" -Wait -PassThru
          if ($p.ExitCode -notin @(0, 1641, 3010)) { throw "TightVNC install failed: $($p.ExitCode)" }
          Write-Host "Install finished."

      - name: Configure and Start TightVNC
        shell: powershell
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Continue'
          $vncExe = "C:\Program Files\TightVNC\tvnserver.exe"
          if (-not (Test-Path $vncExe)) { throw "tvnserver.exe not found." }

          Write-Host "Setting VNC password..."
          # Sử dụng timeout 10s để tránh bị treo vô hạn
          $proc = Start-Process -FilePath $vncExe -ArgumentList "-controlservice -passwd `"$env:VNC_PASSWORD`"" -PassThru -NoNewWindow
          if (-not $proc.WaitForExit(10000)) {
              Write-Host "VNC password process timed out, killing it..."
              $proc.Kill()
          }

          Write-Host "Starting VNC Service..."
          Start-Service -Name "tvnserver" -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5

          Write-Host "Opening Firewall Port 5900..."
          New-NetFirewallRule -DisplayName 'VNC TCP' -Direction Inbound -Action Allow -Protocol TCP -LocalPort 5900 -ErrorAction SilentlyContinue | Out-Null

      - name: Setup Bore Tunnel for VNC
        shell: powershell
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri "https://github.com/ekzhang/bore/releases/download/v0.5.3/bore-v0.5.3-x86_64-pc-windows-msvc.zip" -OutFile "$env:TEMP_DIR\bore.zip" -UseBasicParsing
          Expand-Archive -Path "$env:TEMP_DIR\bore.zip" -DestinationPath "$env:TEMP_DIR\bore" -Force
          
          $boreExe = "$env:TEMP_DIR\bore\bore.exe"
          $boreLog = "$env:TEMP_DIR\bore.log"
          
          Write-Host "Starting Bore tunnel for VNC (port 5900)..."
          Start-Process -FilePath $boreExe -ArgumentList "local 5900 --to bore.pub" -WindowStyle Hidden -RedirectStandardOutput $boreLog
          
          Start-Sleep -Seconds 15
          $publicAddress = $null
          if (Test-Path $boreLog) {
              $logContent = Get-Content $boreLog -Raw
              if ($logContent -match 'listening at (bore\.pub:\d+)') { $publicAddress = $matches[1] }
          }
          if (-not $publicAddress) { throw 'Failed to get Bore public address.' }
          
          Write-Host "VNC Address: $publicAddress"
          "BORE_ADDRESS=$publicAddress" >> $env:GITHUB_ENV

      - name: Publish Connection Information
        shell: powershell
        env:
          PHONE_SERVER_URL: ${{ secrets.PHONE_SERVER_URL }}
        run: |
          $ErrorActionPreference = 'Continue'
          $nodeId = [string]'${{ github.event.inputs.instance_number }}'
          
          $summary = @(
            '## Layer7 Store Cloud PC (VNC)',
            "- Order: $nodeId",
            "- VNC Address: $env:BORE_ADDRESS",
            "- VNC Password: $env:VNC_PASSWORD",
            "*(Lưu ý: Không cần nhập Username)*"
          )
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8

          if (-not [string]::IsNullOrWhiteSpace($env:PHONE_SERVER_URL)) {
            $url = "$($env:PHONE_SERVER_URL.TrimEnd('/'))/api/provision/$nodeId"
            $body = @{ remote_id = $env:BORE_ADDRESS; password = $env:VNC_PASSWORD; type = "vnc" } | ConvertTo-Json
            try {
              Invoke-RestMethod -Uri $url -Method Post -Body $body -ContentType 'application/json' -TimeoutSec 30 | Out-Null
              Write-Host 'Successfully sent VNC info to Server.'
            } catch { Write-Host "Failed to send Server: $($_.Exception.Message)" }
          }

      - name: Keep session alive
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $hours = 3
          try { $hours = [int]'${{ github.event.inputs.hours }}' } catch {}
          if ($hours -lt 1) { $hours = 1 }
          if ($hours -gt 5) { $hours = 5 }
          
          $end = (Get-Date).AddHours($hours)
          Write-Host "Session ends at: $end"
          
          while ((Get-Date) -lt $end) {
            $boreProc = Get-Process -Name "bore" -ErrorAction SilentlyContinue
            if (-not $boreProc) {
                Start-Process -FilePath "$env:TEMP_DIR\bore\bore.exe" -ArgumentList "local 5900 --to bore.pub" -WindowStyle Hidden -RedirectStandardOutput "$env:TEMP_DIR\bore.log"
            }
            $vncSvc = Get-Service -Name "tvnserver" -ErrorAction SilentlyContinue
            if ($vncSvc -and $vncSvc.Status -ne 'Running') { Start-Service -Name "tvnserver" -ErrorAction SilentlyContinue }
            
            $remain = $end - (Get-Date)
            Write-Host "Remaining: $($remain.ToString('hh\:mm\:ss'))"
            Start-Sleep -Seconds 60
          }

      - name: Cleanup
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          Remove-Item -Path "$env:TEMP_DIR\*" -Recurse -Force -ErrorAction SilentlyContinue
