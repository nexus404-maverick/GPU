name: ThyoCloud Workspace (Serveo Random Port RDP)

on:
  workflow_dispatch:
    inputs:
      customUsername:
        description: 'RDP Username (Default: Admin)'
        required: false
        default: 'Admin'
      customPassword:
        description: 'RDP Password (Leave empty to auto-generate)'
        required: false
        default: ''

jobs:
  deploy-workspace:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup User & Enable RDP
        shell: powershell
        env:
          RUSER: ${{ github.event.inputs.customUsername || 'Admin' }}
          RPASS_INPUT: ${{ github.event.inputs.customPassword }}
        run: |
          Write-Host "Setting up RDP account..."
          if ([string]::IsNullOrEmpty($env:RPASS_INPUT)) {
              $chars = "abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#$"
              $RPASS = -join (1..12 | ForEach-Object { $chars[(Get-Random -Maximum $chars.Length)] })
          } else { $RPASS = $env:RPASS_INPUT }
          
          $SecurePass = ConvertTo-SecureString $RPASS -AsPlainText -Force
          if (-not (Get-LocalUser -Name $env:RUSER -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name $env:RUSER -Password $SecurePass -FullName "ThyoCloud User" -PasswordNeverExpires
          } else { Set-LocalUser -Name $env:RUSER -Password $SecurePass }
          Add-LocalGroupMember -Group "Administrators" -Member $env:RUSER -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $env:RUSER -ErrorAction SilentlyContinue

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue

          "RDP_USER=$env:RUSER" >> $env:GITHUB_ENV
          "RDP_PASS=$RPASS" >> $env:GITHUB_ENV
          Write-Host "RDP configuration completed."

      - name: Set Wallpaper
        shell: powershell
        run: |
          Write-Host "Setting up wallpaper..."
          $LocalWallpaper = Join-Path $env:GITHUB_WORKSPACE "Wallpaper\wallpaper.png"
          if (-not (Test-Path $LocalWallpaper)) { 
              Write-Host "[WARNING] Wallpaper not found. Skipping."
              exit 0 
          }
          
          $DestWallpaper = "C:\Windows\Web\Wallpaper\thyo_bg.png"
          Copy-Item -Path $LocalWallpaper -Destination $DestWallpaper -Force
          
          $RegPath = "HKCU:\Control Panel\Desktop"
          Set-ItemProperty -Path $RegPath -Name Wallpaper -Value $DestWallpaper
          Set-ItemProperty -Path $RegPath -Name WallpaperStyle -Value "10"
          Set-ItemProperty -Path $RegPath -Name TileWallpaper -Value "0"
          
          try {
              reg load "HKU\DefaultUser" "C:\Users\Default\NTUSER.DAT" | Out-Null
              $DefaultRegPath = "Registry::HKEY_USERS\DefaultUser\Control Panel\Desktop"
              Set-ItemProperty -Path $DefaultRegPath -Name Wallpaper -Value $DestWallpaper
              Set-ItemProperty -Path $DefaultRegPath -Name WallpaperStyle -Value "10"
              Set-ItemProperty -Path $DefaultRegPath -Name TileWallpaper -Value "0"
              reg unload "HKU\DefaultUser" | Out-Null
              Write-Host "Default user wallpaper updated."
          } catch {
              Write-Host "[WARNING] Could not update default user wallpaper: $_"
          }
          
          Add-Type -TypeDefinition @"
          using System;
          using System.Runtime.InteropServices;
          public class Wallpaper {
              [DllImport("user32.dll", CharSet = CharSet.Auto)]
              public static extern int SystemParametersInfo(int uAction, int uParam, string lpvParam, int fuWinIni);
          }
          "@
          [Wallpaper]::SystemParametersInfo(20, 0, $DestWallpaper, 0x01 -bor 0x02)
          Write-Host "[SUCCESS] Wallpaper changed!"

      - name: Start TCP Probe Background Job
        shell: powershell
        run: |
          Write-Host "Starting TCP probe (1 byte/sec) to keep tunnel active..."
          $probeJob = Start-Job -ScriptBlock {
              while ($true) {
                  try {
                      $client = New-Object System.Net.Sockets.TcpClient
                      $client.Connect("127.0.0.1", 3389)
                      $stream = $client.GetStream()
                      $byte = [byte[]]@(0)
                      $stream.Write($byte, 0, 1)
                      $stream.Flush()
                      $client.Close()
                  } catch {}
                  Start-Sleep -Seconds 1
              }
          }
          Write-Host "TCP Probe Job started (ID: $($probeJob.Id))."
          "PROBE_JOB_ID=$($probeJob.Id)" >> $env:GITHUB_ENV

      - name: Start Serveo Tunnel for RDP (Random Port)
        shell: powershell
        run: |
          Write-Host "Starting Serveo tunnel for RDP (requesting random port)..."
          
          if (-not (Get-Command ssh -ErrorAction SilentlyContinue)) {
              Write-Host "Installing OpenSSH Client..."
              Add-WindowsCapability -Online -Name OpenSSH.Client~~~~0.0.1.0 | Out-Null
          }

          $logFile = "$env:RUNNER_TEMP\serveo.log"
          $maxRetries = 3
          $serveoAddress = $null
          
          for ($retry = 1; $retry -le $maxRetries -and -not $serveoAddress; $retry++) {
              Write-Host "Attempt $retry of $maxRetries..."
              Remove-Item $logFile -ErrorAction SilentlyContinue
              
              # SỬ DỤNG CỔNG 0 ĐỂ SERVEO CẤP CỔNG NGẪU NHIÊN
              $sshArgs = @(
                  "-o", "StrictHostKeyChecking=no",
                  "-o", "UserKnownHostsFile=NUL",
                  "-o", "ServerAliveInterval=1",
                  "-o", "ServerAliveCountMax=3",
                  "-o", "ExitOnForwardFailure=yes",
                  "-R", "0:localhost:3389",
                  "serveo.net"
              )
              
              Start-Process -FilePath "ssh" -ArgumentList $sshArgs -RedirectStandardOutput $logFile -RedirectStandardError "$env:RUNNER_TEMP\serveo.err" -WindowStyle Hidden
              
              Start-Sleep -Seconds 10
              
              $attempts = 0
              while (-not $serveoAddress -and $attempts -lt 15) {
                  Start-Sleep -Seconds 2
                  if (Test-Path $logFile) {
                      $content = Get-Content $logFile -Raw -ErrorAction SilentlyContinue
                      # Serveo trả về định dạng: Forwarding TCP connections from serveo.net:PORT
                      if ($content -match 'serveo\.net:(\d+)') {
                          $serveoPort = $matches[1]
                          $serveoAddress = "serveo.net:$serveoPort"
                      }
                  }
                  $attempts++
              }
              
              if (-not $serveoAddress) {
                  Write-Host "[WARNING] Attempt $retry failed. Retrying..."
                  if (Test-Path "$env:RUNNER_TEMP\serveo.err") { 
                      Get-Content "$env:RUNNER_TEMP\serveo.err" -Tail 5 | Write-Host 
                  }
                  Start-Sleep -Seconds 5
              }
          }
          
          if ($serveoAddress) {
              Write-Host "======================================================="
              Write-Host "SERVEO PUBLIC ADDRESS: $serveoAddress"
              Write-Host "======================================================="
              "SERVEO_ADDR=$serveoAddress" >> $env:GITHUB_ENV
          } else {
              Write-Host "[ERROR] Could not establish Serveo tunnel after $maxRetries attempts."
              throw "Failed to establish Serveo tunnel."
          }

      - name: Publish Connection Details
        shell: powershell
        run: |
          $summary = @()
          $summary += "## ThyoCloud Workspace (Serveo Random Port RDP)"
          $summary += ""
          $summary += "### 🔗 Public Address:"
          $summary += "- **``$env:SERVEO_ADDR``**"
          $summary += ""
          $summary += "### 🔑 Credentials:"
          $summary += "- **Username:** ``$env:RDP_USER``"
          $summary += "- **Password:** ``$env:RDP_PASS``"
          $summary += ""
          $summary += "### 📖 How to connect:"
          $summary += "1. Open **Remote Desktop Connection** (mstsc)."
          $summary += "2. Enter the Public Address above in the 'Computer' field."
          $summary += "3. Enter the Username and Password when prompted."
          $summary += ""
          $summary += "> **Note:** Serveo assigns a random port instead of 3389. Wallpaper & Keep-Alive are active."
          
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Keep session alive
        shell: powershell
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] Session Active - Serveo Tunnel & TCP Probe running..."
              Start-Sleep -Seconds 300
          }
