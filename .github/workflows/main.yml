name: Cloud PC (RustDesk Only - Hidden CMD)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Setup RDP & Firewall
        shell: powershell
        run: |
          $RPASS = "P@ssw0rd!"
          net user Admin $RPASS /add
          net localgroup "Administrators" Admin /add 2>$null
          net localgroup "Remote Desktop Users" Admin /add 2>$null
          
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled False
          
          "RDP_USER=Admin" >> $env:GITHUB_ENV
          "RDP_PASS=$RPASS" >> $env:GITHUB_ENV

      - name: Hide GitHub Agent Window
        shell: powershell
        run: |
          Write-Host "Hiding the GitHub Agent window..."
          # Tạo một script VBScript để chuyển cửa sổ cmd sang Desktop ảo khác
          $vbsCode = @"
          Set objShell = CreateObject("WScript.Shell")
          objShell.Run "cmd.exe /c timeout /t 2 && powershell -windowstyle hidden -command ""Add-Type -AssemblyName System.Windows.Forms; [System.Windows.Forms.SendKeys]::SendWait('^+#{Right}')"""
          "@
          # Chạy script này ẩn dưới nền để chuyển Desktop
          $vbsPath = "$env:TEMP\hide_cmd.vbs"
          $vbsCode | Out-File -FilePath $vbsPath -Encoding ascii
          Start-Process -FilePath "wscript.exe" -ArgumentList $vbsPath -WindowStyle Hidden

      - name: Install RustDesk & Get ID
        shell: powershell
        run: |
          Write-Host "Downloading RustDesk..."
          $msiPath = "$env:RUNNER_TEMP\rustdesk.msi"
          curl.exe -L --fail -o $msiPath "https://github.com/rustdesk/rustdesk/releases/download/1.2.6/rustdesk-1.2.6-x86_64.msi"
          
          Write-Host "Installing RustDesk..."
          Start-Process -FilePath "msiexec.exe" -ArgumentList "/i `"$msiPath`" /qn /norestart" -Wait
          Start-Sleep -Seconds 15
          
          $rustdeskExe = "C:\Program Files\RustDesk\rustdesk.exe"
          Write-Host "Applying password..."
          & $rustdeskExe --password $env:RDP_PASS
          
          Write-Host "Retrieving ID..."
          $rustdeskId = $null
          $attempts = 0
          while (-not $rustdeskId -and $attempts -lt 10) {
              $idOutput = & $rustdeskExe --get-id 2>&1 | Out-String
              if ($idOutput -match '(\d{9,10})') {
                  $rustdeskId = $matches[1]
                  break
              }
              Write-Host "Retrying ID..."
              Start-Sleep -Seconds 5
              $attempts++
          }
          
          if ($rustdeskId) {
              "RUSTDESK_ID=$rustdeskId" >> $env:GITHUB_ENV
              Write-Host "RustDesk ID: $rustdeskId"
          } else {
              Write-Host "[WARNING] Could not get RustDesk ID. IP may be blocked."
          }

      - name: Publish Connection Details
        shell: powershell
        run: |
          $summaryFile = $env:GITHUB_STEP_SUMMARY
          Add-Content -Path $summaryFile -Value "## Cloud PC Connection Info" -Encoding utf8
          Add-Content -Path $summaryFile -Value "" -Encoding utf8
          
          if ($env:RUSTDESK_ID) {
              Add-Content -Path $summaryFile -Value "### RustDesk (Recommended)" -Encoding utf8
              Add-Content -Path $summaryFile -Value "- **ID:** ``$env:RUSTDESK_ID``" -Encoding utf8
              Add-Content -Path $summaryFile -Value "- **Password:** ``$env:RDP_PASS``" -Encoding utf8
          } else {
              Add-Content -Path $summaryFile -Value "### RustDesk" -Encoding utf8
              Add-Content -Path $summaryFile -Value "- **Failed to get ID (IP blocked)**" -Encoding utf8
          }
         
      - name: Keep Session Alive
        shell: powershell
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] Session Active..."
              Start-Sleep -Seconds 300
          }
