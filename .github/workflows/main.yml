name: ThyoCloud Workspace (RustDesk Full GUI)

on:
  workflow_dispatch:
    inputs:
      customPassword:
        description: 'RustDesk Permanent Password (Leave empty to auto-generate)'
        required: false
        default: ''

jobs:
  deploy-workspace:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================================
      # STEP 1: CREATE PASSWORD, SET WALLPAPER & KEEP SCREEN AWAKE
      # ============================================================
      - name: Setup RustDesk Password & Wallpaper
        shell: powershell
        env:
          RPASS_INPUT: ${{ github.event.inputs.customPassword }}
        run: |
          Write-Host "Setting up RustDesk permanent password..."
          if ([string]::IsNullOrEmpty($env:RPASS_INPUT)) {
              $upper = "ABCDEFGHJKLMNPQRSTUVWXYZ"
              $lower = "abcdefghijkmnopqrstuvwxyz"
              $digits = "23456789"
              $special = "!@#$%^&*"
              $pass = -join (1..4 | ForEach-Object { $special[(Get-Random -Maximum $special.Length)] })
              $pass += -join (1..4 | ForEach-Object { $upper[(Get-Random -Maximum $upper.Length)] })
              $pass += -join (1..2 | ForEach-Object { $digits[(Get-Random -Maximum $digits.Length)] })
              $pass += -join (1..2 | ForEach-Object { $lower[(Get-Random -Maximum $lower.Length)] })
              $RPASS = -join ($pass.ToCharArray() | Get-Random -Count $pass.Length)
          } else { $RPASS = $env:RPASS_INPUT }
          
          "RUSTDESK_PASS=$RPASS" >> $env:GITHUB_ENV
          
          Write-Host "Keeping screen awake..."
          powercfg /change monitor-timeout-ac 0
          powercfg /change monitor-timeout-dc 0
          powercfg /change standby-timeout-ac 0
          powercfg /change standby-timeout-dc 0

          # Set Wallpaper
          Write-Host "Setting up wallpaper..."
          $LocalWallpaper = Join-Path $env:GITHUB_WORKSPACE "Wallpaper\wallpaper.png"
          if (Test-Path $LocalWallpaper) {
              $DestWallpaper = "C:\Windows\Web\Wallpaper\thyo_bg.png"
              Copy-Item -Path $LocalWallpaper -Destination $DestWallpaper -Force
              
              $tsPolicyPath = "HKCU:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"
              New-Item -Path $tsPolicyPath -Force | Out-Null
              Set-ItemProperty -Path $tsPolicyPath -Name "fNoRemoteDesktopWallpaper" -Value 0 -Type DWord -Force
              
              $RegPath = "HKCU:\Control Panel\Desktop"
              Set-ItemProperty -Path $RegPath -Name Wallpaper -Value $DestWallpaper
              Set-ItemProperty -Path $RegPath -Name WallpaperStyle -Value "10"
              Set-ItemProperty -Path $RegPath -Name TileWallpaper -Value "0"
              
              $csharpCode = 'using System; using System.Runtime.InteropServices; public class Wallpaper { [DllImport("user32.dll", CharSet = CharSet.Auto)] public static extern int SystemParametersInfo(int uAction, int uParam, string lpvParam, int fuWinIni); }'
              Add-Type -TypeDefinition $csharpCode
              [Wallpaper]::SystemParametersInfo(20, 0, $DestWallpaper, 0x01 -bor 0x02)
          }

      # ============================================================
      # STEP 2: DOWNLOAD AND INSTALL RUSTDESK
      # ============================================================
      - name: Install RustDesk (MSI)
        shell: powershell
        run: |
          Write-Host "Downloading RustDesk MSI..."
          $msiPath = "$env:RUNNER_TEMP\rustdesk.msi"
          $url = "https://github.com/rustdesk/rustdesk/releases/download/1.2.6/rustdesk-1.2.6-x86_64.msi"
          
          curl.exe -L --fail --retry 5 --retry-all-errors --retry-delay 2 -o $msiPath $url
          
          if (-not (Test-Path $msiPath)) { throw "Failed to download RustDesk MSI." }
          
          Write-Host "Installing RustDesk silently..."
          Start-Process -FilePath "msiexec.exe" -ArgumentList "/i `"$msiPath`" /qn /norestart" -Wait -NoNewWindow
          
          Write-Host "Waiting for RustDesk service to initialize..."
          Start-Sleep -Seconds 15

      # ============================================================
      # STEP 3: LAUNCH GUI AND GET ID
      # ============================================================
      - name: Configure RustDesk (GUI Mode)
        shell: powershell
        run: |
          $rustdeskExe = "C:\Program Files\RustDesk\rustdesk.exe"
          if (-not (Test-Path $rustdeskExe)) {
              $rustdeskExe = "C:\Program Files (x86)\RustDesk\rustdesk.exe"
          }
          if (-not (Test-Path $rustdeskExe)) { throw "RustDesk executable not found." }

          Write-Host "Starting RustDesk Service..."
          Start-Service -Name "RustDesk" -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          
          Write-Host "Launching RustDesk GUI to force ID generation..."
          # Bật GUI lên trước để nó kết nối tới server và tạo ID
          Start-Process -FilePath $rustdeskExe -ArgumentList "--no-autoupdate"
          Start-Sleep -Seconds 15
          
          Write-Host "Applying permanent password..."
          & $rustdeskExe --password $env:RUSTDESK_PASS
          Start-Sleep -Seconds 5
          
          Write-Host "Retrieving RustDesk ID (waiting for connection)..."
          $rustdeskId = $null
          $attempts = 0
          
          # Tăng lên 24 lần thử, mỗi lần 5 giây (tổng 2 phút)
          while (-not $rustdeskId -and $attempts -lt 24) {
              $idOutput = (& $rustdeskExe --get-id 2>&1) | Out-String
              
              Write-Host "Attempt $($attempts+1): $($idOutput.Trim())"
              
              if ($idOutput -match '(\d{9,10})') {
                  $rustdeskId = $matches[1]
                  break
              }
              
              Start-Sleep -Seconds 5
              $attempts++
          }
          
          if (-not $rustdeskId) { 
              throw "Could not retrieve RustDesk ID after multiple attempts. The GitHub runner might be blocked by RustDesk public servers." 
          }
          
          Write-Host "======================================================="
          Write-Host "RUSTDESK ID: $rustdeskId"
          Write-Host "======================================================="
          
          "RUSTDESK_ID=$rustdeskId" >> $env:GITHUB_ENV

      # ============================================================
      # STEP 4: PUBLISH CONNECTION DETAILS
      # ============================================================
      - name: Publish Connection Details
        shell: powershell
        run: |
          $summaryFile = $env:GITHUB_STEP_SUMMARY
          
          Add-Content -Path $summaryFile -Value "## ThyoCloud Workspace (RustDesk Full GUI)" -Encoding utf8
          Add-Content -Path $summaryFile -Value "" -Encoding utf8
          Add-Content -Path $summaryFile -Value "### Connection Details:" -Encoding utf8
          Add-Content -Path $summaryFile -Value "- **RustDesk ID:** ``$env:RUSTDESK_ID``" -Encoding utf8
          Add-Content -Path $summaryFile -Value "- **Password:** ``$env:RUSTDESK_PASS``" -Encoding utf8
          Add-Content -Path $summaryFile -Value "" -Encoding utf8
          Add-Content -Path $summaryFile -Value "> **Note:** Running in Full GUI mode. Screen is kept awake." -Encoding utf8

      # ============================================================
      # STEP 5: KEEP SESSION ALIVE
      # ============================================================
      - name: Keep session alive
        shell: powershell
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] Session Active - Waiting for connection..."
              Start-Sleep -Seconds 300
          }
