name: ThyoCloud Workspace (RustDesk for Friends)

on:
  workflow_dispatch:

jobs:
  deploy-workspace:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Setup RustDesk
        shell: powershell
        run: |
          # Tạo mật khẩu ngẫu nhiên
          $chars = "abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789"
          $RPASS = -join (1..8 | ForEach-Object { $chars[(Get-Random -Maximum $chars.Length)] })
          "RUSTDESK_PASS=$RPASS" >> $env:GITHUB_ENV

          # Tải và cài đặt RustDesk
          curl.exe -L --fail --retry 3 -o "$env:RUNNER_TEMP\rustdesk.exe" "https://github.com/rustdesk/rustdesk/releases/download/1.2.6/rustdesk-1.2.6-x86_64.exe"
          Start-Process -FilePath "$env:RUNNER_TEMP\rustdesk.exe" -ArgumentList "--silent-install" -Wait
          Start-Sleep -Seconds 15

          # Áp dụng mật khẩu và lấy ID
          $rustdeskExe = "C:\Program Files\RustDesk\rustdesk.exe"
          & $rustdeskExe --password $env:RUSTDESK_PASS
          
          $rustdeskId = $null
          $attempts = 0
          while (-not $rustdeskId -and $attempts -lt 15) {
              $idOutput = & $rustdeskExe --get-id 2>&1
              foreach ($line in $idOutput) {
                  if (([string]$line).Trim() -match '^\d{9,10}$') {
                      $rustdeskId = $matches[0]; break
                  }
              }
              if (-not $rustdeskId) { Start-Sleep -Seconds 3 }
              $attempts++
          }
          if (-not $rustdeskId) { throw "Failed to get ID." }
          
          "RUSTDESK_ID=$rustdeskId" >> $env:GITHUB_ENV
          
          # Tắt giao diện để nhẹ máy
          Stop-Process -Name "rustdesk" -Force -ErrorAction SilentlyContinue

      - name: Publish Connection Details
        shell: powershell
        run: |
          $file = $env:GITHUB_STEP_SUMMARY
          Add-Content -Path $file -Value "## Chia Sẻ Cho Bạn Bè (RustDesk)" -Encoding utf8
          Add-Content -Path $file -Value "- **ID:** ``$env:RUSTDESK_ID``" -Encoding utf8
          Add-Content -Path $file -Value "- **Password:** ``$env:RUSTDESK_PASS``" -Encoding utf8
          Add-Content -Path $file -Value "**Hướng dẫn cho bạn bè:** Tải app RustDesk -> Nhập ID và Pass ở trên -> Kết nối." -Encoding utf8

      - name: Keep session alive
        shell: powershell
        run: |
          while ($true) { Start-Sleep -Seconds 300 }
