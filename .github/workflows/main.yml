name: Layer7 Store Cloud PC (RustDesk)

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: 'Mã đơn hàng'
        required: true
        type: string
      hours:
        description: 'Số giờ thuê (1-5)'
        required: true
        default: '3'
        type: string

permissions:
  actions: write
  contents: read

jobs:
  deploy-instance:
    runs-on: windows-2025
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Initialize workspace
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $work = 'C:\Layer7'
          $temp = Join-Path $work 'temp'
          New-Item -ItemType Directory -Path $work,$temp -Force | Out-Null
          "WORK_DIR=$work" >> $env:GITHUB_ENV
          "TEMP_DIR=$temp" >> $env:GITHUB_ENV

      - name: Generate Passwords
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $chars = 'abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'
          $password = -join (1..12 | ForEach-Object { $chars[(Get-Random -Maximum $chars.Length)] })
          
          "GENERATED_PASSWORD=$password" >> $env:GITHUB_ENV
          "RDP_USERNAME=Layer7Store" >> $env:GITHUB_ENV

      - name: Setup Windows account
        shell: powershell
        run: |
          try {
              $seceditFile = "$env:TEMP\secpol.inf"
              $seceditContent = @("[Unicode]", "Unicode=yes", "[System Access]", "PasswordComplexity = 0", "MinimumPasswordLength = 0")
              Set-Content -Path $seceditFile -Value $seceditContent -Encoding Unicode
              $null = secedit /configure /db "$env:TEMP\secpol.sdb" /cfg $seceditFile /areas SECURITYPOLICY 2>&1
              Remove-Item $seceditFile -Force -ErrorAction SilentlyContinue
              
              $secure = ConvertTo-SecureString "$env:GENERATED_PASSWORD" -AsPlainText -Force
              $user = Get-LocalUser -Name $env:RDP_USERNAME -ErrorAction SilentlyContinue
              if ($null -eq $user) {
                New-LocalUser -Name $env:RDP_USERNAME -Password $secure -PasswordNeverExpires -AccountNeverExpires -FullName 'Layer7 Store' -ErrorAction SilentlyContinue
              } else {
                Set-LocalUser -Name $env:RDP_USERNAME -Password $secure -ErrorAction SilentlyContinue
              }
              Add-LocalGroupMember -Group 'Administrators' -Member $env:RDP_USERNAME -ErrorAction SilentlyContinue
          } catch { Write-Host "Warning: $_" }
          exit 0

      - name: Download RustDesk MSI
        shell: powershell
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Downloading RustDesk MSI..."
          # Tải bằng link trực tiếp, không qua API
          Invoke-WebRequest -Uri "https://github.com/rustdesk/rustdesk/releases/download/1.5.0/rustdesk-1.5.0-x86_64.msi" -OutFile "$env:TEMP_DIR\rustdesk.msi" -UseBasicParsing

      - name: Install RustDesk MSI
        shell: powershell
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host "Installing RustDesk via MSI..."
          
          # Sử dụng msiexec với timeout để tránh treo vô hạn
          $proc = Start-Process -FilePath "msiexec.exe" -ArgumentList "/i `"$env:TEMP_DIR\rustdesk.msi`" /qn /norestart" -PassThru -WindowStyle Hidden
          
          if (-not $proc.WaitForExit(180000)) {
              Write-Host "MSI installation timed out after 3 minutes, killing process..."
              $proc.Kill()
          } else {
              Write-Host "MSI installation finished with exit code: $($proc.ExitCode)"
          }
          
          # Tắt các process GUI bị treo (nếu có)
          Stop-Process -Name "rustdesk" -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3

      - name: Locate RustDesk Executable
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Finding rustdesk.exe..."
          
          # Tìm ở mọi ngóc ngách có thể
          $paths = @(
              "$env:ProgramFiles\RustDesk\rustdesk.exe",
              "${env:ProgramFiles(x86)}\RustDesk\rustdesk.exe",
              "$env:LOCALAPPDATA\Programs\RustDesk\rustdesk.exe",
              "$env:LOCALAPPDATA\RustDesk\rustdesk.exe"
          )
          
          $rustdeskExe = $null
          foreach ($p in $paths) {
              if (Test-Path $p) { $rustdeskExe = $p; break }
          }
          
          if (-not $rustdeskExe) {
              $rustdeskExe = Get-ChildItem "$env:ProgramFiles","${env:ProgramFiles(x86)}" -Filter rustdesk.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName -First 1
          }
          
          if (-not $rustdeskExe) { throw "rustdesk.exe not found." }
          
          Write-Host "Found at: $rustdeskExe"
          "RUSTDESK_EXE=$rustdeskExe" >> $env:GITHUB_ENV

      - name: Install RustDesk Service
        shell: powershell
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host "Installing RustDesk Service..."
          Start-Process -FilePath $env:RUSTDESK_EXE -ArgumentList '--install-service' -Wait -NoNewWindow
          
          Write-Host "Starting RustDesk Service..."
          Start-Service -Name RustDesk -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5
          
          Write-Host "Killing GUI processes to avoid hang..."
          Stop-Process -Name "rustdesk" -Force -ErrorAction SilentlyContinue

      - name: Configure RustDesk Password
        shell: powershell
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host "Setting RustDesk Password..."
          
          $proc = Start-Process -FilePath $env:RUSTDESK_EXE -ArgumentList "--password `"$env:GENERATED_PASSWORD`"" -PassThru -NoNewWindow
          
          if (-not $proc.WaitForExit(15000)) {
              Write-Host "Password configuration timed out, killing..."
              $proc.Kill()
          }
          Start-Sleep -Seconds 3

      - name: Get RustDesk ID
        shell: powershell
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host "Getting RustDesk ID..."
          
          $rustdeskId = $null
          for ($i = 1; $i -le 10 -and -not $rustdeskId; $i++) {
            $idOutput = @(& $env:RUSTDESK_EXE --get-id 2>&1)
            foreach ($line in $idOutput) {
              if (([string]$line).Trim() -match '^\d{6,20}$') { $rustdeskId = $matches[0]; break }
            }
            if (-not $rustdeskId) { Start-Sleep -Seconds 3 }
          }
          
          if (-not $rustdeskId) { 
              Write-Host "Failed to get RustDesk ID."
              exit 1 
          }
          
          Write-Host "RustDesk ID obtained: $rustdeskId"
          "RUSTDESK_ID=$rustdeskId" >> $env:GITHUB_ENV

      - name: Publish Connection Information
        shell: powershell
        env:
          PHONE_SERVER_URL: ${{ secrets.PHONE_SERVER_URL }}
        run: |
          $ErrorActionPreference = 'Continue'
          $nodeId = [string]'${{ github.event.inputs.instance_number }}'
          
          $summary = @(
            '## Layer7 Store Cloud PC (RustDesk)',
            "- Order: $nodeId",
            "- RustDesk ID: $env:RUSTDESK_ID",
            "- Password: $env:GENERATED_PASSWORD"
          )
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8

          if (-not [string]::IsNullOrWhiteSpace($env:PHONE_SERVER_URL)) {
            $url = "$($env:PHONE_SERVER_URL.TrimEnd('/'))/api/provision/$nodeId"
            $body = @{ remote_id = $env:RUSTDESK_ID; password = $env:GENERATED_PASSWORD; type = "rustdesk" } | ConvertTo-Json
            try {
              Invoke-RestMethod -Uri $url -Method Post -Body $body -ContentType 'application/json' -TimeoutSec 30 | Out-Null
              Write-Host 'Successfully sent RustDesk info to Server.'
            } catch { Write-Host "Failed to send Server: $($_.Exception.Message)" }
          }

      - name: Keep session alive
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $hours = 3
          try { $hours = [int]'${{ github.event.inputs.hours }}' } catch {}
          if ($hours -lt 1) { $hours = 1 }
          if ($hours -gt 5) { $hours = 5 }
          
          $end = (Get-Date).AddHours($hours)
          Write-Host "Session ends at: $end"
          
          while ((Get-Date) -lt $end) {
            $svc = Get-Service -Name RustDesk -ErrorAction SilentlyContinue
            if ($svc -and $svc.Status -ne 'Running') {
              Start-Service -Name RustDesk -ErrorAction SilentlyContinue
            }
            
            $remain = $end - (Get-Date)
            Write-Host "Remaining: $($remain.ToString('hh\:mm\:ss'))"
            Start-Sleep -Seconds 60
          }

      - name: Cleanup
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          Remove-Item -Path "$env:TEMP_DIR\*" -Recurse -Force -ErrorAction SilentlyContinue
