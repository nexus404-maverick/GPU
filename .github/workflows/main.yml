name: Layer7 Store Cloud PC

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: 'Mã đơn hàng'
        required: true
        type: string
      hours:
        description: 'Số giờ thuê (1-5)'
        required: true
        default: '3'
        type: string

permissions:
  actions: write
  contents: read

jobs:
  deploy-instance:
    runs-on: windows-2025
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Initialize workspace
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $work = 'C:\Layer7'
          $temp = Join-Path $work 'temp'
          New-Item -ItemType Directory -Path $work,$temp -Force | Out-Null
          "WORK_DIR=$work" >> $env:GITHUB_ENV
          "TEMP_DIR=$temp" >> $env:GITHUB_ENV

      - name: Generate Windows account password
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $upper = 'ABCDEFGHJKLMNPQRSTUVWXYZ'
          $lower = 'abcdefghijkmnopqrstuvwxyz'
          $digits = '23456789'
          $special = '!@#'
          
          $pass = @(
            $upper[(Get-Random -Maximum $upper.Length)]
            $lower[(Get-Random -Maximum $lower.Length)]
            $digits[(Get-Random -Maximum $digits.Length)]
            $special[(Get-Random -Maximum $special.Length)]
          )
          
          $allChars = $upper + $lower + $digits + $special
          for ($i = 0; $i -lt 12; $i++) {
              $pass += $allChars[(Get-Random -Maximum $allChars.Length)]
          }
          $password = -join ($pass | Sort-Object { Get-Random })
          
          "GENERATED_PASSWORD=$password" >> $env:GITHUB_ENV
          "RDP_USERNAME=Layer7Store" >> $env:GITHUB_ENV

      - name: Setup Windows account and RDP
        shell: powershell
        run: |
          try {
              Write-Host "Disabling password complexity policy..."
              $seceditFile = "$env:TEMP\secpol.inf"
              $seceditContent = @(
                  "[Unicode]", "Unicode=yes", "[System Access]",
                  "PasswordComplexity = 0", "MinimumPasswordLength = 0"
              )
              Set-Content -Path $seceditFile -Value $seceditContent -Encoding Unicode
              $null = secedit /configure /db "$env:TEMP\secpol.sdb" /cfg $seceditFile /areas SECURITYPOLICY 2>&1
              Remove-Item $seceditFile -Force -ErrorAction SilentlyContinue
              
              Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0 -ErrorAction SilentlyContinue
              Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name UserAuthentication -Value 1 -ErrorAction SilentlyContinue
              Enable-NetFirewallRule -DisplayGroup 'Remote Desktop' -ErrorAction SilentlyContinue

              $secure = ConvertTo-SecureString "$env:GENERATED_PASSWORD" -AsPlainText -Force
              $user = Get-LocalUser -Name $env:RDP_USERNAME -ErrorAction SilentlyContinue
              if ($null -eq $user) {
                New-LocalUser -Name $env:RDP_USERNAME -Password $secure -PasswordNeverExpires -AccountNeverExpires -FullName 'Layer7 Store' -ErrorAction SilentlyContinue
              } else {
                Set-LocalUser -Name $env:RDP_USERNAME -Password $secure -ErrorAction SilentlyContinue
              }
              
              Add-LocalGroupMember -Group 'Remote Desktop Users' -Member $env:RDP_USERNAME -ErrorAction SilentlyContinue
              Add-LocalGroupMember -Group 'Administrators' -Member $env:RDP_USERNAME -ErrorAction SilentlyContinue
              
              Set-Service -Name TermService -StartupType Automatic -ErrorAction SilentlyContinue
              Start-Service -Name TermService -ErrorAction SilentlyContinue
              
              Write-Host "Account and RDP setup finished."
          } catch {
              Write-Host "Warning during setup: $_"
          }
          exit 0

      - name: Install RustDesk (MSI)
        shell: powershell
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = "$env:TEMP_DIR\rustdesk.msi"
          
          Write-Host "Downloading RustDesk MSI..."
          Invoke-WebRequest -Uri "https://github.com/rustdesk/rustdesk/releases/download/1.5.0/rustdesk-1.5.0-x86_64.msi" -OutFile $installer -UseBasicParsing
          
          Write-Host "Installing RustDesk..."
          $p = Start-Process -FilePath "msiexec.exe" -ArgumentList "/i `"$installer`" /qn /norestart" -Wait -PassThru
          
          if ($p.ExitCode -notin @(0, 1641, 3010)) {
              throw "RustDesk installation failed with exit code $($p.ExitCode)."
          }

          $rustdeskExe = "$env:ProgramFiles\RustDesk\rustdesk.exe"
          if (-not (Test-Path $rustdeskExe)) {
              throw "rustdesk.exe not found at expected path."
          }

          Write-Host "Installing RustDesk Service..."
          Start-Process -FilePath $rustdeskExe -ArgumentList "--install-service" -Wait -NoNewWindow
          Start-Sleep -Seconds 5
          
          Write-Host "Starting RustDesk Service..."
          Start-Service -Name RustDesk -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 10

          Write-Host "Setting RustDesk Password..."
          Start-Process -FilePath $rustdeskExe -ArgumentList "--password `"$env:GENERATED_PASSWORD`"" -Wait -NoNewWindow
          Start-Sleep -Seconds 5

          Write-Host "Getting RustDesk ID..."
          $rustdeskId = $null
          for ($i = 1; $i -le 15 -and -not $rustdeskId; $i++) {
            $idOutput = @(& $rustdeskExe --get-id 2>&1)
            foreach ($line in $idOutput) {
              if (([string]$line).Trim() -match '^\d{6,20}$') { $rustdeskId = $matches[0]; break }
            }
            if (-not $rustdeskId) { Start-Sleep -Seconds 3 }
          }
          
          if (-not $rustdeskId) { throw "Failed to get RustDesk ID." }
          
          Write-Host "RustDesk ID obtained: $rustdeskId"
          "RUSTDESK_ID=$rustdeskId" >> $env:GITHUB_ENV

      - name: Install Mesa3D (Software OpenGL)
        shell: powershell
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          $mesaDir = Join-Path $env:WORK_DIR 'mesa3d'
          $archive = Join-Path $env:TEMP_DIR 'mesa.7z'
          New-Item -ItemType Directory -Path $mesaDir -Force | Out-Null

          Write-Host "Downloading Mesa3D..."
          Invoke-WebRequest -Uri 'https://github.com/pal1000/mesa-dist-win/releases/download/24.3.4/mesa3d-24.3.4-release-msvc.7z' -OutFile $archive -UseBasicParsing -TimeoutSec 300

          $sevenZip = "$env:TEMP_DIR\7zr.exe"
          if (-not (Test-Path $sevenZip)) {
            Write-Host "Downloading 7zr..."
            Invoke-WebRequest -Uri 'https://www.7-zip.org/a/7zr.exe' -OutFile $sevenZip -UseBasicParsing
          }

          Write-Host "Extracting Mesa3D..."
          $process = Start-Process -FilePath $sevenZip -ArgumentList "x `"$archive`" `"-o$mesaDir`" -y" -Wait -PassThru -NoNewWindow
          
          if ($process.ExitCode -ne 0) { throw "Failed to extract Mesa3D." }
          "MESA3D_DIR=$mesaDir" >> $env:GITHUB_ENV

      - name: Optimize storage and set Dark Mode
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          Remove-Item "$env:TEMP\*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item 'C:\Windows\Temp\*' -Recurse -Force -ErrorAction SilentlyContinue
          
          $personalize = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize'
          New-Item -Path $personalize -Force | Out-Null
          Set-ItemProperty -Path $personalize -Name AppsUseLightTheme -Value 0 -Type DWord
          Set-ItemProperty -Path $personalize -Name SystemUsesLightTheme -Value 0 -Type DWord

      - name: Publish Connection Information
        shell: powershell
        env:
          PHONE_SERVER_URL: ${{ secrets.PHONE_SERVER_URL }}
        run: |
          $ErrorActionPreference = 'Continue'
          $nodeId = [string]'${{ github.event.inputs.instance_number }}'
          
          $summary = @(
            '## Layer7 Store Cloud PC (RustDesk)',
            "- Order: $nodeId",
            "- RustDesk ID: $env:RUSTDESK_ID",
            "- Username: $env:RDP_USERNAME",
            "- Password: $env:GENERATED_PASSWORD"
          )
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8

          if ([string]::IsNullOrWhiteSpace($env:PHONE_SERVER_URL)) {
            Write-Host 'PHONE_SERVER_URL not configured, skipping notification.'
            exit 0
          }
          
          $url = "$($env:PHONE_SERVER_URL.TrimEnd('/'))/api/provision/$nodeId"
          
          $body = @{
            remote_id = $env:RUSTDESK_ID
            password = $env:GENERATED_PASSWORD
            username = $env:RDP_USERNAME
            type = "rustdesk"
          } | ConvertTo-Json
          
          try {
            Invoke-RestMethod -Uri $url -Method Post -Body $body -ContentType 'application/json' -TimeoutSec 30 | Out-Null
            Write-Host 'Successfully sent RustDesk info to Server.'
          } catch {
            Write-Host "Failed to send Server: $($_.Exception.Message)"
          }

      - name: Keep session alive
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $hours = 3
          try { $hours = [int]'${{ github.event.inputs.hours }}' } catch {}
          if ($hours -lt 1) { $hours = 1 }
          if ($hours -gt 5) { $hours = 5 }
          
          $end = (Get-Date).AddHours($hours)
          Write-Host "Session ends at: $end"
          
          while ((Get-Date) -lt $end) {
            $svc = Get-Service -Name RustDesk -ErrorAction SilentlyContinue
            if ($svc -and $svc.Status -ne 'Running') {
              Start-Service -Name RustDesk -ErrorAction SilentlyContinue
            }
            $remain = $end - (Get-Date)
            Write-Host "Remaining: $($remain.ToString('hh\:mm\:ss'))"
            Start-Sleep -Seconds 60
          }
          Write-Host 'Rental session time elapsed.'

      - name: Cleanup
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          Remove-Item -Path "$env:TEMP_DIR\*" -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host 'Cleaned up temporary files.'
