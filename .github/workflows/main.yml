name: Cloud PC via EasyTier LAN

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Setup RDP & Firewall
        shell: powershell
        run: |
          $RPASS = "P@ssw0rd!"
          net user Admin $RPASS /add
          net localgroup "Administrators" Admin /add 2>$null
          net localgroup "Remote Desktop Users" Admin /add 2>$null
          
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled False
          
          "RDP_USER=Admin" >> $env:GITHUB_ENV
          "RDP_PASS=$RPASS" >> $env:GITHUB_ENV

      - name: Download and Start EasyTier
        shell: powershell
        run: |
          Write-Host "Downloading EasyTier for Windows..."
          # SỬA LỖI 404: Dùng đúng tên file có kèm version
          $version = "2.6.4"
          $etUrl = "https://github.com/EasyTier/EasyTier/releases/download/v$version/easytier-windows-x86_64-v$version.zip"
          $zipPath = "$env:RUNNER_TEMP\easytier.zip"
          
          curl.exe -L --fail -o $zipPath $etUrl
          
          if (-not (Test-Path $zipPath)) { throw "Failed to download EasyTier." }
          
          Write-Host "Extracting EasyTier..."
          $extractPath = "$env:RUNNER_TEMP\easytier_extract"
          Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force
          
          # Tìm file thực thi (có thể nằm trong thư mục con)
          $etExe = (Get-ChildItem -Path $extractPath -Filter "easytier-core.exe" -Recurse | Select-Object -First 1).FullName
          $etCli = (Get-ChildItem -Path $extractPath -Filter "easytier-cli.exe" -Recurse | Select-Object -First 1).FullName
          
          if (-not $etExe -or -not $etCli) { throw "EasyTier executables not found." }
          
          Write-Host "Starting EasyTier with shared node..."
          # Sử dụng Shared Node công cộng của EasyTier
          $networkName = "hiep-rdp-network"
          $networkSecret = "MatKhauBiMat123"
          $sharedNode = "tcp://public.easytier.top:11010"
          
          # Chạy core ở chế độ nền
          Start-Process -FilePath $etExe -ArgumentList "-d --network-name $networkName --network-secret $networkSecret -p $sharedNode" -WindowStyle Hidden
          
          Write-Host "Waiting for EasyTier to initialize..."
          Start-Sleep -Seconds 15
          
          # Lấy IP ảo được cấp
          $status = & $etCli node
          Write-Host $status
          
          if ($status -match '(\d+\.\d+\.\d+\.\d+)') {
              $vpnIp = $matches[1]
              Write-Host "VPN IP: $vpnIp"
              "VPN_IP=$vpnIp" >> $env:GITHUB_ENV
          } else {
              Write-Host "[WARNING] Could not determine VPN IP automatically."
              "VPN_IP=Check logs" >> $env:GITHUB_ENV
          }

      - name: Publish Connection Details
        shell: powershell
        run: |
          $summaryFile = $env:GITHUB_STEP_SUMMARY
          Add-Content -Path $summaryFile -Value "## Kết nối RDP qua EasyTier LAN" -Encoding utf8
          Add-Content -Path $summaryFile -Value "" -Encoding utf8
          Add-Content -Path $summaryFile -Value "### Thông tin kết nối:" -Encoding utf8
          Add-Content -Path $summaryFile -Value "- **VPN IP:** ``$env:VPN_IP`` (Xem log bên trên nếu trống)" -Encoding utf8
          Add-Content -Path $summaryFile -Value "- **User:** ``Admin``" -Encoding utf8
          Add-Content -Path $summaryFile -Value "- **Pass:** ``P@ssw0rd!``" -Encoding utf8
          Add-Content -Path $summaryFile -Value "" -Encoding utf8
          Add-Content -Path $summaryFile -Value "### Hướng dẫn:" -Encoding utf8
          Add-Content -Path $summaryFile -Value "1. Tải EasyTier trên máy tính/điện thoại của bạn." -Encoding utf8
          Add-Content -Path $summaryFile -Value "2. Chạy lệnh: ``easytier-core -d --network-name hiep-rdp-network --network-secret MatKhauBiMat123 -p tcp://public.easytier.top:11010``" -Encoding utf8
          Add-Content -Path $summaryFile -Value "3. Dùng IP ``$env:VPN_IP`` để kết nối RDP." -Encoding utf8

      - name: Keep Session Alive
        shell: powershell
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] Session Active - EasyTier LAN is running..."
              Start-Sleep -Seconds 300
          }
