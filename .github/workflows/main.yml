name: ThyoCloud Workspace (NetBird RDP Proxy)

on:
  workflow_dispatch:
    inputs:
      customUsername:
        description: 'RDP Username (Default: Admin)'
        required: false
        default: 'Admin'
      customPassword:
        description: 'RDP Password (Leave empty to auto-generate)'
        required: false
        default: ''

jobs:
  deploy-workspace:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================================
      # STEP 1: CREATE USER AND ENABLE RDP
      # ============================================================
      - name: Setup User & Enable RDP
        shell: powershell
        env:
          RUSER: ${{ github.event.inputs.customUsername || 'Admin' }}
          RPASS_INPUT: ${{ github.event.inputs.customPassword }}
        run: |
          Write-Host "Setting up RDP account..."
          
          # Tạo mật khẩu phức tạp đảm bảo đủ 4 loại ký tự
          if ([string]::IsNullOrEmpty($env:RPASS_INPUT)) {
              $upper = "ABCDEFGHJKLMNPQRSTUVWXYZ"
              $lower = "abcdefghijkmnopqrstuvwxyz"
              $digits = "23456789"
              $special = "!@#$%^&*"
              
              $pass = -join (1..4 | ForEach-Object { $special[(Get-Random -Maximum $special.Length)] })
              $pass += -join (1..4 | ForEach-Object { $upper[(Get-Random -Maximum $upper.Length)] })
              $pass += -join (1..2 | ForEach-Object { $digits[(Get-Random -Maximum $digits.Length)] })
              $pass += -join (1..2 | ForEach-Object { $lower[(Get-Random -Maximum $lower.Length)] })
              
              $RPASS = -join ($pass.ToCharArray() | Get-Random -Count $pass.Length)
          } else {
              $RPASS = $env:RPASS_INPUT
          }
          
          # Sử dụng net user để tạo tài khoản, tránh lỗi complexity
          net user $env:RUSER $RPASS /add
          net localgroup "Administrators" $env:RUSER /add
          net localgroup "Remote Desktop Users" $env:RUSER /add
          Set-LocalUser -Name $env:RUSER -PasswordNeverExpires $true

          # Cấu hình RDP
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue

          "RDP_USER=$env:RUSER" >> $env:GITHUB_ENV
          "RDP_PASS=$RPASS" >> $env:GITHUB_ENV
          Write-Host "RDP configuration completed."

      # ============================================================
      # STEP 2: SET WALLPAPER
      # ============================================================
      - name: Set Wallpaper
        shell: powershell
        run: |
          Write-Host "Setting up wallpaper..."
          $LocalWallpaper = Join-Path $env:GITHUB_WORKSPACE "Wallpaper\wallpaper.png"
          if (-not (Test-Path $LocalWallpaper)) { 
              Write-Host "[WARNING] Wallpaper not found. Skipping."; exit 0 
          }
          
          $DestWallpaper = "C:\Windows\Web\Wallpaper\thyo_bg.png"
          Copy-Item -Path $LocalWallpaper -Destination $DestWallpaper -Force
          
          $RegPath = "HKCU:\Control Panel\Desktop"
          Set-ItemProperty -Path $RegPath -Name Wallpaper -Value $DestWallpaper
          Set-ItemProperty -Path $RegPath -Name WallpaperStyle -Value "10"
          Set-ItemProperty -Path $RegPath -Name TileWallpaper -Value "0"
          
          try {
              reg load "HKU\DefaultUser" "C:\Users\Default\NTUSER.DAT" | Out-Null
              $DefaultRegPath = "Registry::HKEY_USERS\DefaultUser\Control Panel\Desktop"
              Set-ItemProperty -Path $DefaultRegPath -Name Wallpaper -Value $DestWallpaper
              Set-ItemProperty -Path $DefaultRegPath -Name WallpaperStyle -Value "10"
              Set-ItemProperty -Path $DefaultRegPath -Name TileWallpaper -Value "0"
              reg unload "HKU\DefaultUser" | Out-Null
          } catch { Write-Host "[WARNING] Could not update default user wallpaper." }
          
          Add-Type -TypeDefinition @"
          using System;
          using System.Runtime.InteropServices;
          public class Wallpaper {
              [DllImport("user32.dll", CharSet = CharSet.Auto)]
              public static extern int SystemParametersInfo(int uAction, int uParam, string lpvParam, int fuWinIni);
          }
          "@
          [Wallpaper]::SystemParametersInfo(20, 0, $DestWallpaper, 0x01 -bor 0x02)
          Write-Host "[SUCCESS] Wallpaper changed!"

      # ============================================================
      # STEP 3: INSTALL AND CONNECT NETBIRD (CURL FIX)
      # ============================================================
      - name: Install and Connect NetBird
        shell: powershell
        env:
          NB_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
        run: |
          Write-Host "Downloading NetBird via curl (more stable)..."
          $installerPath = "$env:RUNNER_TEMP\netbird_installer.exe"
          
          # Sử dụng curl.exe với các tùy chọn tự động thử lại khi gặp sự cố mạng
          curl.exe -L --fail --retry 5 --retry-all-errors --retry-delay 2 -o $installerPath "https://github.com/netbirdio/netbird/releases/latest/download/netbird_installer.exe"
          
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $installerPath)) {
              throw "Failed to download NetBird installer after multiple retries."
          }
          
          Write-Host "Installing NetBird silently..."
          Start-Process -FilePath $installerPath -ArgumentList "/S" -Wait
          
          Write-Host "Waiting for NetBird service to start..."
          Start-Sleep -Seconds 15
          
          $nbExe = "C:\Program Files\NetBird\netbird.exe"
          if (-not (Test-Path $nbExe)) {
              throw "NetBird executable not found at $nbExe. Installation may have failed."
          }
          
          Write-Host "Connecting to NetBird network with setup key..."
          & $nbExe up --setup-key $env:NB_SETUP_KEY
          
          Start-Sleep -Seconds 10
          
          Write-Host "NetBird Status:"
          & $nbExe status
          
          $nbIP = (& $nbExe status) | Select-String -Pattern 'NetBird IP: (\d+\.\d+\.\d+\.\d+)' | ForEach-Object { $_.Matches.Groups[1].Value }
          "NB_IP=$nbIP" >> $env:GITHUB_ENV
          Write-Host "NetBird IP: $nbIP"

      # ============================================================
      # STEP 4: BACKGROUND TCP PROBE (Keep-Alive)
      # ============================================================
      - name: Start TCP Probe Background Job
        shell: powershell
        run: |
          Write-Host "Starting TCP probe (1 byte/sec) to keep RDP session alive..."
          $probeJob = Start-Job -ScriptBlock {
              while ($true) {
                  try {
                      $client = New-Object System.Net.Sockets.TcpClient
                      $client.Connect("127.0.0.1", 3389)
                      $stream = $client.GetStream()
                      $stream.Write([byte[]]@(0), 0, 1)
                      $stream.Flush()
                      $client.Close()
                  } catch {}
                  Start-Sleep -Seconds 1
              }
          }
          Write-Host "TCP Probe Job started (ID: $($probeJob.Id))."
          "PROBE_JOB_ID=$($probeJob.Id)" >> $env:GITHUB_ENV

      # ============================================================
      # STEP 5: PUBLISH CONNECTION DETAILS (ASCII-SAFE)
      # ============================================================
      - name: Publish Connection Details
        shell: powershell
        run: |
          $summaryFile = $env:GITHUB_STEP_SUMMARY
          
          Add-Content -Path $summaryFile -Value "## ThyoCloud Workspace (NetBird RDP)" -Encoding utf8
          Add-Content -Path $summaryFile -Value "" -Encoding utf8
          Add-Content -Path $summaryFile -Value "### Connection Details:" -Encoding utf8
          Add-Content -Path $summaryFile -Value "- **Public Domain (Port is required):** ``pc.layer7pc.bbroot.com:<YOUR_PORT>``" -Encoding utf8
          Add-Content -Path $summaryFile -Value "- **Username:** ``$env:RDP_USER``" -Encoding utf8
          Add-Content -Path $summaryFile -Value "- **Password:** ``$env:RDP_PASS``" -Encoding utf8
          Add-Content -Path $summaryFile -Value "" -Encoding utf8
          Add-Content -Path $summaryFile -Value "### Debug Info (Internal NetBird IP):" -Encoding utf8
          Add-Content -Path $summaryFile -Value "- **NetBird IP:** ``$env:NB_IP``" -Encoding utf8
          Add-Content -Path $summaryFile -Value "" -Encoding utf8
          Add-Content -Path $summaryFile -Value "### How to connect:" -Encoding utf8
          Add-Content -Path $summaryFile -Value "1. Go to NetBird Dashboard -> Reverse Proxy -> Services." -Encoding utf8
          Add-Content -Path $summaryFile -Value "2. Look for the service ending in ``pc.layer7pc.bbroot.com``. Note the **Listen Port** (e.g., 18623)." -Encoding utf8
          Add-Content -Path $summaryFile -Value "3. Open **Remote Desktop Connection** (mstsc)." -Encoding utf8
          Add-Content -Path $summaryFile -Value "4. Enter ``pc.layer7pc.bbroot.com:<PORT>`` in the 'Computer' field." -Encoding utf8
          Add-Content -Path $summaryFile -Value "5. Enter the Username and Password above when prompted." -Encoding utf8
          Add-Content -Path $summaryFile -Value "" -Encoding utf8
          Add-Content -Path $summaryFile -Value "> **WARNING:** Make sure you have configured **Access Control Rules** in NetBird to allow your public IP, otherwise the connection will be blocked." -Encoding utf8

      # ============================================================
      # STEP 6: KEEP SESSION ALIVE (Main Loop)
      # ============================================================
      - name: Keep session alive
        shell: powershell
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] Session Active - Waiting for connection via NetBird..."
              Start-Sleep -Seconds 300
          }
