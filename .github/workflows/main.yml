name: Cloud PC (RustDesk - Lock CMD)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Setup RDP & Firewall
        shell: powershell
        run: |
          $RPASS = "P@ssw0rd!"
          net user Admin $RPASS /add
          net localgroup "Administrators" Admin /add 2>$null
          net localgroup "Remote Desktop Users" Admin /add 2>$null
          
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled False
          
          "RDP_USER=Admin" >> $env:GITHUB_ENV
          "RDP_PASS=$RPASS" >> $env:GITHUB_ENV

      - name: Block CMD Termination via Group Policy
        shell: powershell
        run: |
          Write-Host "Applying policies to block CMD termination..."
          # Chặn Task Manager tắt tiến trình (Cần thiết lập qua GPO)
          # Đường dẫn Registry cho phép/chặn Task Manager
          $regPath = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Policies\System"
          if (-not (Test-Path $regPath)) { New-Item -Path $regPath -Force | Out-Null }
          Set-ItemProperty -Path $regPath -Name "DisableTaskMgr" -Value 1 -Type DWord -Force
          
          # Chặn các công cụ dòng lệnh như cmd, powershell trong khi phiên chạy
          $runPath = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Policies\Explorer"
          if (-not (Test-Path $runPath)) { New-Item -Path $runPath -Force | Out-Null }
          Set-ItemProperty -Path $runPath -Name "DisallowRun" -Value 1 -Type DWord -Force
          
          # Tạo danh sách các file bị cấm chạy (nhưng trừ cmd của GitHub ra)
          $disallowPath = "$runPath\DisallowRun"
          if (-not (Test-Path $disallowPath)) { New-Item -Path $disallowPath -Force | Out-Null }
          # Chặn người dùng mở cmd mới (nhưng không chặn tiến trình đang chạy)
          # (Lưu ý: Việc này có thể ảnh hưởng đến các script khác, chỉ nên dùng khi thực sự cần)
          # Set-ItemProperty -Path $disallowPath -Name "1" -Value "cmd.exe" -Force
          
          Write-Host "Policies applied. Task Manager disabled."

      - name: Start Ultra-Fast CMD Hider
        shell: powershell
        run: |
          Write-Host "Starting ultra-fast CMD hider..."
          # Sử dụng C# để tương tác với Windows API nhanh hơn
          $hiderScript = @'
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public class Win32 {
              [DllImport("user32.dll")]
              public static extern bool ShowWindow(IntPtr hWnd, int nCmdShow);
              [DllImport("user32.dll")]
              public static extern bool IsWindowVisible(IntPtr hWnd);
          }
          "@
          
          # Vòng lặp vô hạn với tốc độ cực cao (không sleep lâu)
          while ($true) {
              $procs = Get-Process cmd -ErrorAction SilentlyContinue
              foreach ($p in $procs) {
                  # Kiểm tra xem cửa sổ có đang hiện không (để tránh gọi API liên tục)
                  if ([Win32]::IsWindowVisible($p.MainWindowHandle)) {
                      # 6 = Minimize, 0 = Hide hoàn toàn (nếu muốn giấu kỹ hơn)
                      [Win32]::ShowWindow($p.MainWindowHandle, 6) 
                  }
              }
              # Nghỉ cực ngắn (10ms) để giảm tải CPU nhưng vẫn đủ nhanh
              Start-Sleep -Milliseconds 10
          }
          '@
          $hiderPath = "$env:RUNNER_TEMP\hider.ps1"
          $hiderScript | Out-File -FilePath $hiderPath -Encoding utf8
          
          # Chạy ẩn dưới nền
          Start-Process -FilePath "powershell.exe" -ArgumentList "-WindowStyle Hidden -ExecutionPolicy Bypass -File `"$hiderPath`"" -WindowStyle Hidden

      - name: Install RustDesk & Get ID
        shell: powershell
        run: |
          Write-Host "Downloading RustDesk..."
          $msiPath = "$env:RUNNER_TEMP\rustdesk.msi"
          curl.exe -L --fail -o $msiPath "https://github.com/rustdesk/rustdesk/releases/download/1.2.6/rustdesk-1.2.6-x86_64.msi"
          
          Write-Host "Installing RustDesk..."
          Start-Process -FilePath "msiexec.exe" -ArgumentList "/i `"$msiPath`" /qn /norestart" -Wait
          Start-Sleep -Seconds 15
          
          $rustdeskExe = "C:\Program Files\RustDesk\rustdesk.exe"
          Write-Host "Applying password..."
          & $rustdeskExe --password $env:RDP_PASS
          
          Write-Host "Retrieving ID..."
          $rustdeskId = $null
          $attempts = 0
          while (-not $rustdeskId -and $attempts -lt 10) {
              $idOutput = & $rustdeskExe --get-id 2>&1 | Out-String
              if ($idOutput -match '(\d{9,10})') {
                  $rustdeskId = $matches[1]
                  break
              }
              Write-Host "Retrying ID..."
              Start-Sleep -Seconds 5
              $attempts++
          }
          
          if ($rustdeskId) {
              "RUSTDESK_ID=$rustdeskId" >> $env:GITHUB_ENV
              Write-Host "RustDesk ID: $rustdeskId"
          } else {
              Write-Host "[WARNING] Could not get RustDesk ID. IP may be blocked."
          }

      - name: Publish Connection Details
        shell: powershell
        run: |
          $summaryFile = $env:GITHUB_STEP_SUMMARY
          Add-Content -Path $summaryFile -Value "## Cloud PC Connection Info" -Encoding utf8
          Add-Content -Path $summaryFile -Value "" -Encoding utf8
          
          if ($env:RUSTDESK_ID) {
              Add-Content -Path $summaryFile -Value "### RustDesk (Recommended)" -Encoding utf8
              Add-Content -Path $summaryFile -Value "- **ID:** ``$env:RUSTDESK_ID``" -Encoding utf8
              Add-Content -Path $summaryFile -Value "- **Password:** ``$env:RDP_PASS``" -Encoding utf8
          } else {
              Add-Content -Path $summaryFile -Value "### RustDesk" -Encoding utf8
              Add-Content -Path $summaryFile -Value "- **Failed to get ID (IP blocked)**" -Encoding utf8
          }
         
      - name: Keep Session Alive
        shell: powershell
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] Session Active..."
              Start-Sleep -Seconds 300
          }
