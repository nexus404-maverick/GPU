name: RDP via Serveo Tunnel (Debug)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Setup RDP & Firewall
        shell: powershell
        run: |
          $RPASS = "P@ssw0rd!"
          net user Admin $RPASS /add
          net localgroup "Administrators" Admin /add 2>$null
          net localgroup "Remote Desktop Users" Admin /add 2>$null
          
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled False
          
          "RDP_USER=Admin" >> $env:GITHUB_ENV
          "RDP_PASS=$RPASS" >> $env:GITHUB_ENV

      - name: Start Serveo Tunnel
        shell: powershell
        run: |
          Write-Host "Starting Serveo tunnel for RDP (port 3389)..."
          $logFile = "$env:RUNNER_TEMP\serveo.log"
          $errFile = "$env:RUNNER_TEMP\serveo.err"
          
          # Thêm -p 443 để tránh bị chặn cổng 22, dùng -T để tránh lỗi pseudo-terminal
          Start-Process -FilePath "ssh" -ArgumentList "-T -p 443 -o StrictHostKeyChecking=no -R 0:localhost:3389 serveo.net" -RedirectStandardOutput $logFile -RedirectStandardError $errFile -WindowStyle Hidden
          
          Write-Host "Waiting for Serveo to assign a public port..."
          Start-Sleep -Seconds 10
          
          # In toàn bộ log ra để xem Serveo báo gì
          Write-Host "=== SERVEO STDOUT ==="
          if (Test-Path $logFile) { Get-Content $logFile }
          Write-Host "=== SERVEO STDERR ==="
          if (Test-Path $errFile) { Get-Content $errFile }
          
          $serveoAddress = $null
          if (Test-Path $logFile) {
              $content = Get-Content $logFile -Raw -ErrorAction SilentlyContinue
              if ($content -match 'serveo\.net:(\d+)') {
                  $serveoAddress = "serveo.net:$($matches[1])"
              }
          }
          
          if (-not $serveoAddress) { 
              Write-Host "[ERROR] Could not extract Serveo address from logs above."
              throw "Serveo tunnel failed. Check the logs above to see why." 
          }
          
          Write-Host "Serveo Address: $serveoAddress"
          "SERVEO_ADDR=$serveoAddress" >> $env:GITHUB_ENV

      - name: Publish Connection Details
        shell: powershell
        run: |
          $summaryFile = $env:GITHUB_STEP_SUMMARY
          Add-Content -Path $summaryFile -Value "## Kết nối RDP qua Serveo" -Encoding utf8
          Add-Content -Path $summaryFile -Value ("- **Địa chỉ:** ``" + $env:SERVEO_ADDR + "``") -Encoding utf8
          Add-Content -Path $summaryFile -Value "- **User:** ``Admin``" -Encoding utf8
          Add-Content -Path $summaryFile -Value "- **Pass:** ``P@ssw0rd!``" -Encoding utf8

      - name: Keep Session Alive
        shell: powershell
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] Session Active - Serveo is running..."
              Start-Sleep -Seconds 300
          }
