name: GPU Cloud PC (RDP + Mesa3D)

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: 'Mã đơn hàng / Tên phiên'
        required: true
        default: 'GPU-Session-01'
        type: string
      hours:
        description: 'Số giờ thuê (1-5)'
        required: true
        default: '3'
        type: string

permissions:
  actions: write
  contents: read

jobs:
  deploy-instance:
    runs-on: windows-2025
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Generate Password
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $chars = 'abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'
          $password = -join (1..12 | ForEach-Object { $chars[(Get-Random -Maximum $chars.Length)] })
          "GENERATED_PASSWORD=$password" >> $env:GITHUB_ENV

      - name: Setup Windows RDP & User
        shell: powershell
        run: |
          try {
              Write-Host "Disabling password policy..."
              $seceditFile = "$env:TEMP\secpol.inf"
              $seceditContent = @(
                  "[Unicode]", "Unicode=yes", "[System Access]",
                  "PasswordComplexity = 0", "MinimumPasswordLength = 0"
              )
              Set-Content -Path $seceditFile -Value $seceditContent -Encoding Unicode
              $null = secedit /configure /db "$env:TEMP\secpol.sdb" /cfg $seceditFile /areas SECURITYPOLICY 2>&1
              Remove-Item $seceditFile -Force -ErrorAction SilentlyContinue
              
              Write-Host "Enabling RDP..."
              Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0 -ErrorAction SilentlyContinue
              Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name UserAuthentication -Value 1 -ErrorAction SilentlyContinue
              Enable-NetFirewallRule -DisplayGroup 'Remote Desktop' -ErrorAction SilentlyContinue

              Write-Host "Creating User..."
              $secure = ConvertTo-SecureString "$env:GENERATED_PASSWORD" -AsPlainText -Force
              $user = Get-LocalUser -Name "GPUUser" -ErrorAction SilentlyContinue
              if ($null -eq $user) {
                New-LocalUser -Name "GPUUser" -Password $secure -PasswordNeverExpires -AccountNeverExpires -FullName 'GPU User' -ErrorAction SilentlyContinue
              } else {
                Set-LocalUser -Name "GPUUser" -Password $secure -ErrorAction SilentlyContinue
              }
              Add-LocalGroupMember -Group 'Remote Desktop Users' -Member "GPUUser" -ErrorAction SilentlyContinue
              Add-LocalGroupMember -Group 'Administrators' -Member "GPUUser" -ErrorAction SilentlyContinue
              
              Set-Service -Name TermService -StartupType Automatic -ErrorAction SilentlyContinue
              Start-Service -Name TermService -ErrorAction SilentlyContinue
          } catch {
              Write-Host "Warning: $_"
          }
          exit 0

      - name: Install Mesa3D (Software GPU)
        shell: powershell
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Downloading Mesa3D..."
          
          $mesaDir = "C:\Mesa3D"
          $archive = "$env:TEMP\mesa.7z"
          New-Item -ItemType Directory -Path $mesaDir -Force | Out-Null
          
          Invoke-WebRequest -Uri 'https://github.com/pal1000/mesa-dist-win/releases/download/24.3.4/mesa3d-24.3.4-release-msvc.7z' -OutFile $archive -UseBasicParsing -TimeoutSec 300
          
          $sevenZip = "$env:TEMP\7zr.exe"
          if (-not (Test-Path $sevenZip)) {
              Invoke-WebRequest -Uri 'https://www.7-zip.org/a/7zr.exe' -OutFile $sevenZip -UseBasicParsing
          }
          
          Write-Host "Extracting Mesa3D..."
          $process = Start-Process -FilePath $sevenZip -ArgumentList "x `"$archive`" `"-o$mesaDir`" -y" -Wait -PassThru -NoNewWindow
          
          if ($process.ExitCode -ne 0) { throw "Failed to extract Mesa3D." }
          
          [System.Environment]::SetEnvironmentVariable("GALLIUM_DRIVER", "llvmpipe", "Machine")
          [System.Environment]::SetEnvironmentVariable("LIBGL_ALWAYS_SOFTWARE", "1", "Machine")
          [System.Environment]::SetEnvironmentVariable("MESA_GL_VERSION_OVERRIDE", "4.6", "Machine")
          [System.Environment]::SetEnvironmentVariable("MESA_GLSL_VERSION_OVERRIDE", "460", "Machine")
          
          Write-Host "Mesa3D đã được cài đặt tại $mesaDir"

      - name: Setup Cloudflare Tunnel
        shell: powershell
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Downloading Cloudflared..."
          $cfUrl = "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe"
          Invoke-WebRequest -Uri $cfUrl -OutFile "$env:TEMP\cloudflared.exe" -UseBasicParsing
          
          Write-Host "Starting Cloudflare Tunnel..."
          $cfLog = "$env:TEMP\cf.log"
          Start-Process -FilePath "$env:TEMP\cloudflared.exe" -ArgumentList "tunnel --url tcp://localhost:3389" -WindowStyle Hidden -RedirectStandardOutput $cfLog
          
          Write-Host "Waiting for Tunnel to initialize..."
          Start-Sleep -Seconds 15
          
          $publicAddress = $null
          if (Test-Path $cfLog) {
              $logContent = Get-Content $cfLog -Raw
              if ($logContent -match 'https://([a-zA-Z0-9\-]+\.trycloudflare\.com)') {
                  $publicAddress = $matches[0]
              }
          }
          
          if (-not $publicAddress) { throw "Failed to get Cloudflare public address. Check logs." }
          
          Write-Host "RDP Address obtained: $publicAddress"
          "CF_ADDRESS=$publicAddress" >> $env:GITHUB_ENV

      - name: Publish RDP Information
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $nodeId = [string]'${{ github.event.inputs.instance_number }}'
          
          $summary = @(
            '## GPU Cloud PC (RDP + Mesa3D)',
            "- Session: $nodeId",
            "- Address (Host): $env:CF_ADDRESS",
            "- Username: GPUUser",
            "- Password: $env:GENERATED_PASSWORD",
            "",
            "**Hướng dẫn kết nối:**",
            "1. Mở Remote Desktop Connection (mstsc) hoặc aRDP.",
            "2. Nhập Address: $env:CF_ADDRESS (cổng 443)",
            "3. Nhập User và Pass ở trên."
          )
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Keep session alive
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $hours = 3
          try { $hours = [int]'${{ github.event.inputs.hours }}' } catch {}
          if ($hours -lt 1) { $hours = 1 }
          if ($hours -gt 5) { $hours = 5 }
          
          $end = (Get-Date).AddHours($hours)
          Write-Host "Session ends at: $end"
          
          while ((Get-Date) -lt $end) {
            $svc = Get-Service -Name TermService -ErrorAction SilentlyContinue
            if ($svc -and $svc.Status -ne 'Running') {
              Start-Service -Name TermService -ErrorAction SilentlyContinue
            }
            $cfProc = Get-Process -Name "cloudflared" -ErrorAction SilentlyContinue
            if (-not $cfProc) {
                Start-Process -FilePath "$env:TEMP\cloudflared.exe" -ArgumentList "tunnel --url tcp://localhost:3389" -WindowStyle Hidden -RedirectStandardOutput "$env:TEMP\cf.log"
            }
            
            $remain = $end - (Get-Date)
            Write-Host "Remaining: $($remain.ToString('hh\:mm\:ss'))"
            Start-Sleep -Seconds 60
          }

      - name: Cleanup
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          Remove-Item -Path "$env:TEMP\*" -Recurse -Force -ErrorAction SilentlyContinue
