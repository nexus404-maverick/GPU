name: RDP via Custom FRP Tunnel

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Setup RDP & Firewall
        shell: powershell
        run: |
          $RPASS = "P@ssw0rd!"
          net user Admin $RPASS /add
          net localgroup "Administrators" Admin /add 2>$null
          net localgroup "Remote Desktop Users" Admin /add 2>$null
          
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled False
          
          "RDP_USER=Admin" >> $env:GITHUB_ENV
          "RDP_PASS=$RPASS" >> $env:GITHUB_ENV

      - name: Setup FRP Client & Connect
        shell: powershell
        run: |
          $frpUrl = "https://github.com/fatedier/frp/releases/download/v0.61.0/frp_0.61.0_windows_amd64.zip"
          curl.exe -L --fail -o "frp.zip" $frpUrl
          Expand-Archive -Path "frp.zip" -DestinationPath "C:\frp" -Force
          
          # ============================================================
          # SỬA DÒNG DƯỚI ĐÂY: Điền IP hoặc Domain của máy phụ vào
          $serverAddress = "TEN_MIEN_HOAC_IP_MAY_PHU" 
          # ============================================================
          
          $config = @"
serverAddr = "$serverAddress"
serverPort = 7000
auth.method = "token"
auth.token = "HiepDev_Secure_Token_2026"

[[proxies]]
name = "github-rdp"
type = "tcp"
localIP = "127.0.0.1"
localPort = 3389
remotePort = 13389
"@
          $config | Out-File -FilePath "C:\frp\frpc.toml" -Encoding utf8
          Start-Process -FilePath "C:\frp\frpc.exe" -ArgumentList "-c C:\frp\frpc.toml" -WindowStyle Hidden
          Start-Sleep -Seconds 5

      - name: Keep Session Alive
        shell: powershell
        run: |
          while ($true) { Start-Sleep -Seconds 300 }
