name: RdpFree — RDP Chỉ Cần Kết Nối

on:
  workflow_dispatch:
    inputs:
      durasi_menit:
        description: 'Thời gian phiên (phút, 10–360)'
        required: false
        default: '360'
        type: string
      hostname:
        description: 'Tên máy ảo'
        required: false
        default: 'rdpfree'
        type: string
      rdp_user:
        description: 'Tên người dùng RDP (3–20 ký tự)'
        required: false
        default: 'xyadmin'
        type: string
      storage_boost:
        description: 'Dọn dẹp bộ nhớ đệm để giải phóng dung lượng'
        required: false
        default: 'ya'
        type: choice
        options:
          - ya
          - tidak
      debloat:
        description: 'Dọn dẹp dịch vụ nền'
        required: false
        default: 'ringan'
        type: choice
        options:
          - ringan
          - full
          - tidak
      win10:
        description: 'Giao diện kiểu Windows 10'
        required: false
        default: 'ya'
        type: choice
        options:
          - ya
          - tidak
      xydesk:
        description: 'Tối ưu hóa hiển thị & âm thanh RDP'
        required: false
        default: 'ya'
        type: choice
        options:
          - ya
          - tidak
      ekstra:
        description: 'Cài ứng dụng cơ bản (7-Zip, Chrome, Lightshot)'
        required: false
        default: 'ya'
        type: choice
        options:
          - ya
          - tidak
      grafis:
        description: 'Tối ưu hóa đồ họa'
        required: false
        default: 'software'
        type: choice
        options:
          - software
          - tidak
      runner:
        description: 'Hệ điều hành máy chủ'
        required: false
        default: 'windows-2022'
        type: choice
        options:
          - windows-2022
          - windows-2025
          - windows-latest
          - ubuntu-24.04
          - ubuntu-22.04
          - ubuntu-latest
      linux_mode:
        description: 'Chế độ Linux'
        required: false
        default: 'desktop'
        type: choice
        options:
          - desktop
          - polos
      microphone:
        description: 'Kích hoạt chuyển hướng micro & máy ảnh qua RDP'
        required: false
        default: 'ya'
        type: choice
        options:
          - ya
          - tidak
      perpanjang_otomatis:
        description: 'Tự động tiếp tục phiên khi hết giờ'
        required: false
        default: 'ya'
        type: choice
        options:
          - ya
          - tidak
      discord:
        description: 'Cài Discord'
        required: false
        default: 'tidak'
        type: choice
        options:
          - ya
          - tidak

permissions:
  contents: write
  actions: write

concurrency:
  group: rdpfree-active-session
  cancel-in-progress: false

jobs:
  rdp:
    name: Phiên RDP (${{ inputs.runner || 'windows-2022' }})
    runs-on: ${{ inputs.runner || 'windows-2022' }}
    timeout-minutes: 360
    env:
      DUR: ${{ inputs.durasi_menit || '360' }}
      HOSTNAME: ${{ inputs.hostname || 'rdpfree' }}
      RDP_USER: ${{ inputs.rdp_user || 'xyadmin' }}
      RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
      STORAGE_BOOST: ${{ inputs.storage_boost || 'ya' }}
      DEBLOAT: ${{ inputs.debloat || 'ringan' }}
      WIN10: ${{ inputs.win10 || 'ya' }}
      XYDESK: ${{ inputs.xydesk || 'ya' }}
      EKSTRA: ${{ inputs.ekstra || 'ya' }}
      GRAFIS: ${{ inputs.grafis || 'software' }}
      LINUX_MODE: ${{ inputs.linux_mode || 'desktop' }}
      MICROPHONE: ${{ inputs.microphone || 'ya' }}
      PERPANJANG_OTOMATIS: ${{ inputs.perpanjang_otomatis || 'ya' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Tải mã nguồn
        uses: actions/checkout@v4

      # ==================================================
      # LINUX — XRDP trên cổng 3389
      # ==================================================
      - name: Cài đặt RDP cho Linux (XRDP cổng :3389)
        if: ${{ startsWith(inputs.runner || 'windows-2022', 'ubuntu') }}
        shell: bash
        run: |
          chmod +x ./scripts/setup-linux-rdp.sh
          ./scripts/setup-linux-rdp.sh --setup-only

      - name: Giữ phiên hoạt động [Linux]
        if: ${{ startsWith(inputs.runner || 'windows-2022', 'ubuntu') }}
        shell: bash
        run: ./scripts/setup-linux-rdp.sh --keepalive-only

      - name: Kết thúc phiên [Linux]
        if: ${{ always() && startsWith(inputs.runner || 'windows-2022', 'ubuntu') }}
        shell: bash
        continue-on-error: true
        run: ./scripts/setup-linux-rdp.sh --finalize-only

      # ==================================================
      # WINDOWS — RDP gốc trên cổng 3389
      # ==================================================
      - name: Dọn dẹp phiên cũ
        if: ${{ !startsWith(inputs.runner || 'windows-2022', 'ubuntu') }}
        shell: pwsh
        continue-on-error: true
        run: ./scripts/cleanup-actions.ps1

      - name: Bật Dịch vụ RDP trên cổng 3389 + Tạo tài khoản
        if: ${{ !startsWith(inputs.runner || 'windows-2022', 'ubuntu') }}
        shell: pwsh
        run: ./scripts/setup-rdp.ps1

      - name: Khôi phục trạng thái phiên trước
        if: ${{ !startsWith(inputs.runner || 'windows-2022', 'ubuntu') }}
        shell: pwsh
        continue-on-error: true
        run: ./scripts/restore-state.ps1

      - name: Tối ưu hóa dung lượng
        timeout-minutes: 15
        if: ${{ !startsWith(inputs.runner || 'windows-2022', 'ubuntu') && ((inputs.storage_boost || 'ya') != 'tidak' || (inputs.debloat || 'ringan') != 'tidak') }}
        shell: pwsh
        continue-on-error: true
        run: ./scripts/optimize-storage.ps1

      - name: Giao diện Windows 10
        if: ${{ !startsWith(inputs.runner || 'windows-2022', 'ubuntu') && (inputs.win10 || 'ya') != 'tidak' }}
        shell: pwsh
        continue-on-error: true
        run: ./scripts/setup-win10.ps1

      - name: Tùy chỉnh Desktop & File Explorer
        if: ${{ !startsWith(inputs.runner || 'windows-2022', 'ubuntu') }}
        shell: pwsh
        continue-on-error: true
        run: ./scripts/setup-explorer.ps1

      - name: Kích hoạt chuyển hướng âm thanh & thiết bị qua RDP
        if: ${{ !startsWith(inputs.runner || 'windows-2022', 'ubuntu') && (inputs.microphone || 'ya') != 'tidak' }}
        shell: pwsh
        continue-on-error: true
        run: ./scripts/setup-media.ps1

      - name: Tối ưu hóa đồ họa cho RDP
        if: ${{ !startsWith(inputs.runner || 'windows-2022', 'ubuntu') && (inputs.grafis || 'software') != 'tidak' }}
        shell: pwsh
        continue-on-error: true
        run: ./scripts/setup-grafis.ps1

      - name: Cài ứng dụng cơ bản
        if: ${{ !startsWith(inputs.runner || 'windows-2022', 'ubuntu') && (inputs.ekstra || 'ya') != 'tidak' }}
        shell: pwsh
        continue-on-error: true
        run: ./scripts/setup-extras.ps1

      - name: Tối ưu hóa hiển thị RDP
        if: ${{ !startsWith(inputs.runner || 'windows-2022', 'ubuntu') && (inputs.xydesk || 'ya') != 'tidak' }}
        shell: pwsh
        continue-on-error: true
        run: ./scripts/setup-xydesk.ps1

      - name: Cài Discord
        if: ${{ !startsWith(inputs.runner || 'windows-2022', 'ubuntu') && (inputs.discord || 'tidak') == 'ya' }}
        shell: pwsh
        continue-on-error: true
        run: ./scripts/setup-discord.ps1

      - name: Thông báo trạng thái — Sẵn sàng kết nối RDP
        if: ${{ !startsWith(inputs.runner || 'windows-2022', 'ubuntu') }}
        shell: pwsh
        continue-on-error: true
        run: ./scripts/publish-status.ps1

      - name: Giữ phiên hoạt động
        if: ${{ !startsWith(inputs.runner || 'windows-2022', 'ubuntu') }}
        shell: pwsh
        run: ./scripts/keepalive.ps1

      - name: Lưu trạng thái phiên
        if: ${{ always() && !startsWith(inputs.runner || 'windows-2022', 'ubuntu') }}
        shell: pwsh
        continue-on-error: true
        run: ./scripts/persist-state.ps1

      - name: Tải trạng thái phiên lên
        if: ${{ always() && !startsWith(inputs.runner || 'windows-2022', 'ubuntu') }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: xyrdp-state
          path: C:\XyRDP\persist\xyrdp-state.zip
          retention-days: 30
          if-no-files-found: ignore

      - name: Kết thúc phiên
        if: ${{ always() && !startsWith(inputs.runner || 'windows-2022', 'ubuntu') }}
        shell: pwsh
        continue-on-error: true
        run: ./scripts/finalize-rdp.ps1

      - name: Tự động tạo phiên tiếp theo
        if: ${{ success() && (inputs.perpanjang_otomatis || 'ya') != 'tidak' }}
        shell: pwsh
        continue-on-error: true
        run: |
          $hdr = @{
            Authorization          = "Bearer $($env:GITHUB_TOKEN)"
            Accept                 = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $body = @{
            ref    = 'main'
            inputs = @{
              durasi_menit        = "$($env:DUR)"
              hostname            = "$($env:HOSTNAME)"
              rdp_user            = "$($env:RDP_USER)"
              storage_boost       = "$($env:STORAGE_BOOST)"
              debloat             = "$($env:DEBLOAT)"
              win10               = "$($env:WIN10)"
              xydesk              = "$($env:XYDESK)"
              ekstra              = "$($env:EKSTRA)"
              grafis              = "$($env:GRAFIS)"
              runner              = "${{ inputs.runner || 'windows-2022' }}"
              linux_mode          = "$($env:LINUX_MODE)"
              microphone          = "$($env:MICROPHONE)"
              discord             = "$($env:DISCORD)"
              perpanjang_otomatis = "$($env:PERPANJANG_OTOMATIS)"
            }
          } | ConvertTo-Json -Depth 5
          try {
            $ownerName = ($env:GITHUB_REPOSITORY -split '/')[0]
            $allowAutoRenew = $true
            try {
              $usrObj = Invoke-RestMethod -Uri "https://api.github.com/users/$ownerName" -Headers $hdr -TimeoutSec 15
              if ($usrObj -and $usrObj.created_at) {
                $ageDays = ([DateTime]::UtcNow - [DateTime]::Parse($usrObj.created_at).ToUniversalTime()).TotalDays
                if ($ageDays -lt 7) {
                  Write-Host "Thông báo: Tài khoản mới dưới 7 ngày — tự động tiếp tục đã tắt. Vui lòng khởi động thủ công."
                  $allowAutoRenew = $false
                }
              }
            } catch {}
            if ($allowAutoRenew) {
              Start-Sleep -Seconds (Get-Random -Minimum 15 -Maximum 26)
              Invoke-RestMethod -Uri "https://api.github.com/repos/$($env:GITHUB_REPOSITORY)/actions/workflows/rdp-6h.yml/dispatches" `
                -Headers $hdr -Method Post -ContentType 'application/json' -Body $body -TimeoutSec 20 | Out-Null
              Write-Host 'Phiên tiếp theo đã được lên lịch tự động.'
            }
          } catch {
            Write-Host "Bỏ qua tự động tiếp tục: $($_.Exception.Message)"
          }
          
