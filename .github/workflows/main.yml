name: GPU Cloud PC (RustDesk + Mesa3D)

on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Số giờ thuê (1-5)'
        required: true
        default: '3'
        type: string

permissions:
  actions: write
  contents: read

jobs:
  deploy-instance:
    runs-on: windows-2025
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Generate Password
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Chỉ dùng chữ và số để tránh lỗi cú pháp CLI
          $chars = 'abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'
          $password = -join (1..12 | ForEach-Object { $chars[(Get-Random -Maximum $chars.Length)] })
          "GENERATED_PASSWORD=$password" >> $env:GITHUB_ENV

      - name: Setup Windows Account
        shell: powershell
        run: |
          try {
              $seceditFile = "$env:TEMP\secpol.inf"
              $seceditContent = @(
                  "[Unicode]", "Unicode=yes", "[System Access]",
                  "PasswordComplexity = 0", "MinimumPasswordLength = 0"
              )
              Set-Content -Path $seceditFile -Value $seceditContent -Encoding Unicode
              $null = secedit /configure /db "$env:TEMP\secpol.sdb" /cfg $seceditFile /areas SECURITYPOLICY 2>&1
              Remove-Item $seceditFile -Force -ErrorAction SilentlyContinue
              
              $secure = ConvertTo-SecureString "$env:GENERATED_PASSWORD" -AsPlainText -Force
              $user = Get-LocalUser -Name "GPUUser" -ErrorAction SilentlyContinue
              if ($null -eq $user) {
                New-LocalUser -Name "GPUUser" -Password $secure -PasswordNeverExpires -AccountNeverExpires -FullName 'GPU User' -ErrorAction SilentlyContinue
              } else {
                Set-LocalUser -Name "GPUUser" -Password $secure -ErrorAction SilentlyContinue
              }
              Add-LocalGroupMember -Group 'Administrators' -Member "GPUUser" -ErrorAction SilentlyContinue
          } catch { Write-Host "Warning: $_" }
          exit 0

      - name: Install Mesa3D (Software GPU)
        shell: powershell
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Downloading Mesa3D..."
          $mesaDir = "C:\Mesa3D"
          $archive = "$env:TEMP\mesa.7z"
          New-Item -ItemType Directory -Path $mesaDir -Force | Out-Null
          
          Invoke-WebRequest -Uri 'https://github.com/pal1000/mesa-dist-win/releases/download/24.3.4/mesa3d-24.3.4-release-msvc.7z' -OutFile $archive -UseBasicParsing -TimeoutSec 300
          
          $sevenZip = "$env:TEMP\7zr.exe"
          if (-not (Test-Path $sevenZip)) {
              Invoke-WebRequest -Uri 'https://www.7-zip.org/a/7zr.exe' -OutFile $sevenZip -UseBasicParsing
          }
          
          Write-Host "Extracting Mesa3D..."
          $process = Start-Process -FilePath $sevenZip -ArgumentList "x `"$archive`" `"-o$mesaDir`" -y" -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) { throw "Failed to extract Mesa3D." }
          
          [System.Environment]::SetEnvironmentVariable("GALLIUM_DRIVER", "llvmpipe", "Machine")
          [System.Environment]::SetEnvironmentVariable("LIBGL_ALWAYS_SOFTWARE", "1", "Machine")
          [System.Environment]::SetEnvironmentVariable("MESA_GL_VERSION_OVERRIDE", "4.6", "Machine")
          [System.Environment]::SetEnvironmentVariable("MESA_GLSL_VERSION_OVERRIDE", "460", "Machine")
          Write-Host "✅ Mesa3D installed."

      - name: Download RustDesk
        shell: powershell
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Downloading RustDesk 1.5.0..."
          Invoke-WebRequest -Uri "https://github.com/rustdesk/rustdesk/releases/download/1.5.0/rustdesk-1.5.0-x86_64.exe" -OutFile "$env:TEMP\rustdesk.exe" -UseBasicParsing

      - name: Install RustDesk Silently
        shell: powershell
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Installing RustDesk..."
          # Cài đặt ngầm, ép timeout 3 phút để tránh treo
          $p = Start-Process -FilePath "$env:TEMP\rustdesk.exe" -ArgumentList '--silent-install' -Wait -PassThru -WindowStyle Hidden
          
          # Diệt GUI nếu có để tránh treo Headless
          Stop-Process -Name "rustdesk" -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3

      - name: Install RustDesk Service
        shell: powershell
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Stop'
          $rustdeskExe = "$env:ProgramFiles\RustDesk\rustdesk.exe"
          if (-not (Test-Path $rustdeskExe)) {
              $rustdeskExe = Get-ChildItem "$env:ProgramFiles","${env:ProgramFiles(x86)}" -Filter rustdesk.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName -First 1
          }
          if (-not $rustdeskExe) { throw "rustdesk.exe not found." }
          "RUSTDESK_EXE=$rustdeskExe" >> $env:GITHUB_ENV

          Write-Host "Installing RustDesk Service..."
          Start-Process -FilePath $rustdeskExe -ArgumentList '--install-service' -Wait -NoNewWindow
          
          Write-Host "Starting RustDesk Service..."
          Start-Service -Name RustDesk -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5
          
          Stop-Process -Name "rustdesk" -Force -ErrorAction SilentlyContinue

      - name: Configure RustDesk Password
        shell: powershell
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Setting RustDesk Password..."
          # Bọc pass trong ngoặc kép
          Start-Process -FilePath $env:RUSTDESK_EXE -ArgumentList "--password `"$env:GENERATED_PASSWORD`"" -Wait -NoNewWindow
          Start-Sleep -Seconds 3

      - name: Get RustDesk ID
        shell: powershell
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host "Getting RustDesk ID..."
          
          $rustdeskId = $null
          for ($i = 1; $i -le 10 -and -not $rustdeskId; $i++) {
            $idOutput = @(& $env:RUSTDESK_EXE --get-id 2>&1)
            foreach ($line in $idOutput) {
              if (([string]$line).Trim() -match '^\d{6,20}$') { $rustdeskId = $matches[0]; break }
            }
            if (-not $rustdeskId) { Start-Sleep -Seconds 3 }
          }
          
          if (-not $rustdeskId) { 
              throw "Failed to get RustDesk ID."
          }
          
          Write-Host "RustDesk ID obtained: $rustdeskId"
          "RUSTDESK_ID=$rustdeskId" >> $env:GITHUB_ENV

      - name: Publish Connection Information
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $summary = @(
            '## GPU Cloud PC (RustDesk)',
            "- RustDesk ID: $env:RUSTDESK_ID",
            "- Password: $env:GENERATED_PASSWORD",
            "",
            "**Hướng dẫn kết nối:**",
            "1. Mở app RustDesk trên thiết bị của bạn.",
            "2. Nhập ID: $env:RUSTDESK_ID",
            "3. Nhập Password ở trên để kết nối."
          )
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Keep session alive
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $hours = 3
          try { $hours = [int]'${{ github.event.inputs.hours }}' } catch {}
          if ($hours -lt 1) { $hours = 1 }
          if ($hours -gt 5) { $hours = 5 }
          
          $end = (Get-Date).AddHours($hours)
          Write-Host "Session ends at: $end"
          
          while ((Get-Date) -lt $end) {
            $svc = Get-Service -Name RustDesk -ErrorAction SilentlyContinue
            if ($svc -and $svc.Status -ne 'Running') {
              Start-Service -Name RustDesk -ErrorAction SilentlyContinue
            }
            
            $remain = $end - (Get-Date)
            Write-Host "Remaining: $($remain.ToString('hh\:mm\:ss'))"
            Start-Sleep -Seconds 60
          }

      - name: Cleanup
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          Remove-Item -Path "$env:TEMP\*" -Recurse -Force -ErrorAction SilentlyContinue
