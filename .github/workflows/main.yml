name: RDP via Pinggy Tunnel

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure Core RDP Settings
        shell: powershell
        run: |
          # Bật RDP
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          # Tắt NLA để tương thích với nhiều app RDP trên điện thoại
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          
          # Mở cổng Firewall
          netsh advfirewall firewall delete rule name="RDP-Allow" | Out-Null
          netsh advfirewall firewall add rule name="RDP-Allow" dir=in action=allow protocol=TCP localport=3389
          
          Restart-Service -Name TermService -Force
          Write-Host "✅ RDP Enabled."

      - name: Create RDP User
        shell: powershell
        run: |
          # Tắt chính sách mật khẩu phức tạp
          $seceditFile = "$env:TEMP\secpol.inf"
          $seceditContent = @("[Unicode]", "Unicode=yes", "[System Access]", "PasswordComplexity = 0", "MinimumPasswordLength = 0")
          Set-Content -Path $seceditFile -Value $seceditContent -Encoding Unicode
          $null = secedit /configure /db "$env:TEMP\secpol.sdb" /cfg $seceditFile /areas SECURITYPOLICY 2>&1
          Remove-Item $seceditFile -Force -ErrorAction SilentlyContinue

          # Tạo mật khẩu ngẫu nhiên
          $password = -join ((48..57) + (65..90) + (97..122) | Get-Random -Count 12 | % {[char]$_})
          
          # Tạo user
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "GPUUser" -Password $securePass -AccountNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "GPUUser" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "GPUUser" -ErrorAction SilentlyContinue
          
          "RDP_PASSWORD=$password" >> $env:GITHUB_ENV
          Write-Host "✅ User GPUUser Created."

      - name: Start Pinggy Tunnel
        shell: powershell
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Continue'
          $sshLog = "$env:TEMP\pinggy.log"
          
          Write-Host "Starting Pinggy Tunnel..."
          # Sử dụng SSH có sẵn trên Windows để tạo tunnel, chuyển tiếp cổng 3389
          # -o StrictHostKeyChecking=no để không bị hỏi Yes/No
          $cmd = "ssh -p 443 -R0:localhost:3389 -o StrictHostKeyChecking=no a.pinggy.io"
          
          # Chạy ngầm và ghi log
          Start-Process -FilePath "powershell.exe" -ArgumentList "-Command", $cmd -WindowStyle Hidden -RedirectStandardOutput $sshLog

          Write-Host "Waiting for Pinggy to initialize (15s)..."
          Start-Sleep -Seconds 15
          
          # Đọc log để lấy địa chỉ tcp://xxx:port
          $publicHost = $null
          $publicPort = $null
          
          if (Test-Path $sshLog) {
              $logContent = Get-Content $sshLog -Raw
              # Regex tìm dạng tcp://rnxyz.a.pinggy.link:12345
              if ($logContent -match 'tcp://([a-zA-Z0-9\-\.]+):(\d+)') {
                  $publicHost = $matches[1]
                  $publicPort = $matches[2]
              }
          }
          
          if ($publicHost -and $publicPort) {
              "RDP_HOST=$publicHost" >> $env:GITHUB_ENV
              "RDP_PORT=$publicPort" >> $env:GITHUB_ENV
              Write-Host "✅ Tunnel Established: $publicHost on port $publicPort"
          } else {
              Write-Host "❌ Failed to get Pinggy address. Log output:"
              Get-Content $sshLog
              throw "Tunnel failed."
          }

      - name: Publish Connection Details
        shell: powershell
        run: |
          $summary = @(
            '## 🖥️ RDP Connection Details (Pinggy Tunnel)',
            "",
            "**Host (IP):** `$env:RDP_HOST`",
            "**Port:** `$env:RDP_PORT`",
            "**Username:** `GPUUser`",
            "**Password:** `$env:RDP_PASSWORD`",
            "",
            "**Hướng dẫn kết nối:**",
            "1. Mở app RDP (mstsc trên PC, aRDP trên Android).",
            "2. Ở ô Host/PC Name, nhập: `$env:RDP_HOST`",
            "3. Ở ô Port (nếu có), nhập: `$env:RDP_PORT`",
            "4. Điền Username và Password ở trên để kết nối.",
            "",
            "> ⚠️ **Lưu ý:** Pinggy bản miễn phí sẽ ngắt kết nối sau 60 phút. Nếu bạn cần dùng 6 tiếng, hãy dùng phương án Tailscale."
          )
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Keep session alive
        shell: powershell
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Session Active via Pinggy..."
              Start-Sleep -Seconds 300
          }
