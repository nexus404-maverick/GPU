name: RDP via Cloudflare Tunnel (Windows App)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Setup RDP & Firewall
        shell: powershell
        run: |
          Write-Host "Setting up RDP..."
          $RPASS = "P@ssw0rd!"
          net user Admin $RPASS /add
          net localgroup "Administrators" Admin /add 2>$null
          net localgroup "Remote Desktop Users" Admin /add 2>$null
          
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled False
          
          "RDP_USER=Admin" >> $env:GITHUB_ENV
          "RDP_PASS=$RPASS" >> $env:GITHUB_ENV

      - name: Start Cloudflare Tunnel
        shell: powershell
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          Write-Host "Downloading cloudflared..."
          $cfExe = "$env:RUNNER_TEMP\cloudflared.exe"
          curl.exe -L --fail -o $cfExe "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe"
          
          Write-Host "Starting Cloudflare Tunnel..."
          Start-Process -FilePath $cfExe -ArgumentList "tunnel --no-autoupdate run --token $env:CF_TOKEN" -WindowStyle Hidden
          
          Start-Sleep -Seconds 5
          Write-Host "[SUCCESS] Cloudflare Tunnel is running!"

      - name: Publish Connection Details
        shell: powershell
        run: |
          $summaryFile = $env:GITHUB_STEP_SUMMARY
          Add-Content -Path $summaryFile -Value "## Kết nối RDP qua Cloudflare" -Encoding utf8
          Add-Content -Path $summaryFile -Value "" -Encoding utf8
          Add-Content -Path $summaryFile -Value "### Thông tin kết nối:" -Encoding utf8
          Add-Content -Path $summaryFile -Value "- **Tên miền:** ``rdp.tenmiencuaban.com`` (Thay bằng tên miền bạn đã cấu hình trên Cloudflare)" -Encoding utf8
          Add-Content -Path $summaryFile -Value "- **User:** ``Admin``" -Encoding utf8
          Add-Content -Path $summaryFile -Value "- **Pass:** ``P@ssw0rd!``" -Encoding utf8
          Add-Content -Path $summaryFile -Value "" -Encoding utf8
          Add-Content -Path $summaryFile -Value "### Hướng dẫn kết nối:" -Encoding utf8
          Add-Content -Path $summaryFile -Value "1. Cài đặt **cloudflared** trên điện thoại/máy tính." -Encoding utf8
          Add-Content -Path $summaryFile -Value "2. Chạy lệnh: ``cloudflared access tcp --hostname rdp.tenmiencuaban.com --url localhost:13389``" -Encoding utf8
          Add-Content -Path $summaryFile -Value "3. Mở **Windows App**, nhập địa chỉ: ``localhost:13389``" -Encoding utf8
          Add-Content -Path $summaryFile -Value "4. Nhập User và Pass ở trên." -Encoding utf8

      - name: Keep Session Alive
        shell: powershell
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] Session Active - Waiting for connection..."
              Start-Sleep -Seconds 300
          }
