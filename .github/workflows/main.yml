name: ThyoCloud Workspace (NetBird Proxy)

on:
  workflow_dispatch:
    inputs:
      customUsername:
        description: 'RDP Username (Default: Admin)'
        required: false
        default: 'Admin'
      customPassword:
        description: 'RDP Password (Leave empty to auto-generate)'
        required: false
        default: ''

jobs:
  deploy-workspace:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup User & Enable RDP
        shell: powershell
        env:
          RUSER: ${{ github.event.inputs.customUsername || 'Admin' }}
          RPASS_INPUT: ${{ github.event.inputs.customPassword }}
        run: |
          Write-Host "Setting up RDP account..."
          if ([string]::IsNullOrEmpty($env:RPASS_INPUT)) {
              $chars = "abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#$"
              $RPASS = -join (1..12 | ForEach-Object { $chars[(Get-Random -Maximum $chars.Length)] })
          } else { $RPASS = $env:RPASS_INPUT }
          
          $SecurePass = ConvertTo-SecureString $RPASS -AsPlainText -Force
          if (-not (Get-LocalUser -Name $env:RUSER -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name $env:RUSER -Password $SecurePass -FullName "ThyoCloud User" -PasswordNeverExpires
          } else { Set-LocalUser -Name $env:RUSER -Password $SecurePass }
          
          Add-LocalGroupMember -Group "Administrators" -Member $env:RUSER -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $env:RUSER -ErrorAction SilentlyContinue

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue

          "RDP_USER=$env:RUSER" >> $env:GITHUB_ENV
          "RDP_PASS=$RPASS" >> $env:GITHUB_ENV

      - name: Set Wallpaper
        shell: powershell
        run: |
          $LocalWallpaper = Join-Path $env:GITHUB_WORKSPACE "Wallpaper\wallpaper.png"
          if (Test-Path $LocalWallpaper) {
              $DestWallpaper = "C:\Windows\Web\Wallpaper\thyo_bg.png"
              Copy-Item -Path $LocalWallpaper -Destination $DestWallpaper -Force
              $RegPath = "HKCU:\Control Panel\Desktop"
              Set-ItemProperty -Path $RegPath -Name Wallpaper -Value $DestWallpaper
              Set-ItemProperty -Path $RegPath -Name WallpaperStyle -Value "10"
              Set-ItemProperty -Path $RegPath -Name TileWallpaper -Value "0"
              Add-Type -TypeDefinition "using System; using System.Runtime.InteropServices; public class W { [DllImport(\"user32.dll\")] public static extern int SystemParametersInfo(int a, int b, string c, int d); }"
              [W]::SystemParametersInfo(20, 0, $DestWallpaper, 0x01 -bor 0x02)
          }

      # ============================================================
      # BƯỚC QUAN TRỌNG: CÀI ĐẶT NETBIRD
      # ============================================================
      - name: Install and Connect NetBird
        shell: powershell
        env:
          NB_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
        run: |
          Write-Host "Downloading NetBird..."
          Invoke-WebRequest -Uri "https://github.com/netbirdio/netbird/releases/latest/download/netbird_installer.exe" -OutFile "netbird_installer.exe"
          
          Write-Host "Installing NetBird silently..."
          Start-Process -FilePath ".\netbird_installer.exe" -ArgumentList "/S" -Wait
          
          Write-Host "Starting NetBird service and connecting..."
          # Đường dẫn mặc định của NetBird trên Windows
          $nbExe = "C:\Program Files\NetBird\netbird.exe"
          
          # Kết nối vào mạng NetBird bằng Setup Key
          & $nbExe up --setup-key $env:NB_SETUP_KEY --daemon-addr unix:///var/run/netbird.sock
          
          # (Tùy chọn) Nếu lệnh trên báo lỗi, thử dùng lệnh này:
          # & $nbExe up --setup-key $env:NB_SETUP_KEY
          
          Start-Sleep -Seconds 5
          Write-Host "NetBird status:"
          & $nbExe status

      - name: Keep session alive
        shell: powershell
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] Session Active - Waiting for connection via NetBird..."
              Start-Sleep -Seconds 300
          }
