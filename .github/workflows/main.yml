name: RDP via Playit.gg

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure Core RDP Settings
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Restart-Service -Name TermService -Force
          Write-Host "✅ RDP Enabled."

      - name: Create RDP User
        shell: powershell
        run: |
          # Tắt chính sách mật khẩu phức tạp
          $seceditFile = "$env:TEMP\secpol.inf"
          $seceditContent = @("[Unicode]", "Unicode=yes", "[System Access]", "PasswordComplexity = 0", "MinimumPasswordLength = 0")
          Set-Content -Path $seceditFile -Value $seceditContent -Encoding Unicode
          $null = secedit /configure /db "$env:TEMP\secpol.sdb" /cfg $seceditFile /areas SECURITYPOLICY 2>&1
          Remove-Item $seceditFile -Force -ErrorAction SilentlyContinue

          # Tạo mật khẩu ngẫu nhiên
          $password = -join ((48..57) + (65..90) + (97..122) | Get-Random -Count 12 | % {[char]$_})
          
          # Tạo user
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "GPUUser" -Password $securePass -AccountNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "GPUUser" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "GPUUser" -ErrorAction SilentlyContinue
          
          "RDP_PASSWORD=$password" >> $env:GITHUB_ENV
          Write-Host "✅ User GPUUser Created."

      - name: Install Playit.gg Agent
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $playitUrl = "https://github.com/playit-cloud/playit-agent/releases/download/v0.15.26/playit-windows-x86_64-signed.exe"
          $playitPath = "$env:TEMP\playit.exe"
          
          Write-Host "Downloading Playit.gg Agent..."
          Invoke-WebRequest -Uri $playitUrl -OutFile $playitPath -UseBasicParsing
          
          # Tạo thư mục cấu hình cho Playit
          $playitDir = "$env:USERPROFILE\.playit"
          New-Item -ItemType Directory -Path $playitDir -Force | Out-Null
          
          # Lưu secret key vào file cấu hình (nếu cần) hoặc chạy trực tiếp
          # Chúng ta sẽ chạy Playit và truyền secret key qua tham số
          Write-Host "✅ Playit.gg Agent Downloaded."

      - name: Start Playit.gg Tunnel
        shell: powershell
        timeout-minutes: 5
        env:
          PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
        run: |
          $ErrorActionPreference = 'Continue'
          $playitPath = "$env:TEMP\playit.exe"
          
          if ([string]::IsNullOrEmpty($env:PLAYIT_SECRET)) {
              throw "Chưa cấu hình secret PLAYIT_SECRET. Hãy thêm Secret Key từ Playit.gg vào GitHub Secrets."
          }
          
          Write-Host "Starting Playit.gg Agent with Secret Key..."
          
          # Chạy Playit ngầm với secret key
          $playitLog = "$env:TEMP\playit.log"
          Start-Process -FilePath $playitPath -ArgumentList "--secret `"$env:PLAYIT_SECRET`"" -WindowStyle Hidden -RedirectStandardOutput $playitLog
          
          Write-Host "Playit.gg Agent is running."
          Write-Host "Tunnel address is fixed and can be found on your Playit.gg Dashboard."
          
          # Đợi một chút để Agent kết nối
          Start-Sleep -Seconds 15
          
          # Kiểm tra xem Playit có đang chạy không
          $proc = Get-Process -Name "playit" -ErrorAction SilentlyContinue
          if (-not $proc) {
              Write-Host "❌ Playit process died. Log output:"
              if (Test-Path $playitLog) { Get-Content $playitLog }
              throw "Playit.gg Agent failed to start. Check the log above."
          }
          
          Write-Host "✅ Playit.gg Agent is active (PID: $($proc.Id))."

      - name: Publish Connection Details
        shell: powershell
        run: |
          $summary = @(
            '## 🖥️ RDP Connection Details (Playit.gg)',
            "",
            "**Địa chỉ kết nối (Host:Port):**",
            "👉 **Lấy trên Dashboard Playit.gg của bạn** (dạng `tên-ngẫu-nhiên.at.playit.gg:12345`)",
            "",
            "**Username:** `GPUUser`",
            "**Password:** `$env:RDP_PASSWORD`",
            "",
            "**Hướng dẫn:**",
            "1. Mở app RDP (mstsc trên PC, aRDP trên Android).",
            "2. Nhập địa chỉ Playit.gg đã tạo vào ô Host/PC Name.",
            "3. Nhập Username và Password ở trên.",
            "",
            "> ⚠️ **Lưu ý:** Địa chỉ này là **cố định**, không bao giờ thay đổi. Bạn chỉ cần tạo 1 lần trên Playit.gg và dùng mãi mãi."
          )
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Keep session alive
        shell: powershell
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Session Active via Playit.gg..."
              Start-Sleep -Seconds 300
          }
