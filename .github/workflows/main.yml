name: ThyoCloud Workspace (Bore RDP + Wallpaper + Keep-Alive)

on:
  workflow_dispatch:
    inputs:
      customUsername:
        description: 'RDP Username (Default: Admin)'
        required: false
        default: 'Admin'
      customPassword:
        description: 'RDP Password (Leave empty to auto-generate)'
        required: false
        default: ''

jobs:
  deploy-workspace:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================================
      # STEP 1: CREATE USER AND ENABLE RDP
      # ============================================================
      - name: Setup User & Enable RDP
        shell: powershell
        env:
          RUSER: ${{ github.event.inputs.customUsername || 'Admin' }}
          RPASS_INPUT: ${{ github.event.inputs.customPassword }}
        run: |
          Write-Host "Setting up RDP account..."
          if ([string]::IsNullOrEmpty($env:RPASS_INPUT)) {
              $chars = "abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#$"
              $RPASS = -join (1..12 | ForEach-Object { $chars[(Get-Random -Maximum $chars.Length)] })
          } else { $RPASS = $env:RPASS_INPUT }
          
          $SecurePass = ConvertTo-SecureString $RPASS -AsPlainText -Force
          if (-not (Get-LocalUser -Name $env:RUSER -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name $env:RUSER -Password $SecurePass -FullName "ThyoCloud User" -PasswordNeverExpires
          } else { Set-LocalUser -Name $env:RUSER -Password $SecurePass }
          
          Add-LocalGroupMember -Group "Administrators" -Member $env:RUSER -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $env:RUSER -ErrorAction SilentlyContinue

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue

          "RDP_USER=$env:RUSER" >> $env:GITHUB_ENV
          "RDP_PASS=$RPASS" >> $env:GITHUB_ENV
          Write-Host "RDP configuration completed."

      # ============================================================
      # STEP 2: SET WALLPAPER (Applies to Current and Default User)
      # ============================================================
      - name: Set Wallpaper
        shell: powershell
        run: |
          Write-Host "Setting up wallpaper..."
          $LocalWallpaper = Join-Path $env:GITHUB_WORKSPACE "Wallpaper\wallpaper.png"
          if (-not (Test-Path $LocalWallpaper)) { 
              Write-Host "[WARNING] Wallpaper not found. Skipping."; exit 0 
          }
          
          $DestWallpaper = "C:\Windows\Web\Wallpaper\thyo_bg.png"
          Copy-Item -Path $LocalWallpaper -Destination $DestWallpaper -Force
          
          # Set for current user
          $RegPath = "HKCU:\Control Panel\Desktop"
          Set-ItemProperty -Path $RegPath -Name Wallpaper -Value $DestWallpaper
          Set-ItemProperty -Path $RegPath -Name WallpaperStyle -Value "10"
          Set-ItemProperty -Path $RegPath -Name TileWallpaper -Value "0"
          
          # Set for Default user (so new RDP users get it too)
          try {
              reg load "HKU\DefaultUser" "C:\Users\Default\NTUSER.DAT" | Out-Null
              $DefaultRegPath = "Registry::HKEY_USERS\DefaultUser\Control Panel\Desktop"
              Set-ItemProperty -Path $DefaultRegPath -Name Wallpaper -Value $DestWallpaper
              Set-ItemProperty -Path $DefaultRegPath -Name WallpaperStyle -Value "10"
              Set-ItemProperty -Path $DefaultRegPath -Name TileWallpaper -Value "0"
              reg unload "HKU\DefaultUser" | Out-Null
          } catch { Write-Host "[WARNING] Could not update default user wallpaper." }
          
          # Apply immediately
          Add-Type -TypeDefinition @"
          using System;
          using System.Runtime.InteropServices;
          public class Wallpaper {
              [DllImport("user32.dll", CharSet = CharSet.Auto)]
              public static extern int SystemParametersInfo(int uAction, int uParam, string lpvParam, int fuWinIni);
          }
          "@
          [Wallpaper]::SystemParametersInfo(20, 0, $DestWallpaper, 0x01 -bor 0x02)
          Write-Host "[SUCCESS] Wallpaper changed!"

      # ============================================================
      # STEP 3: BACKGROUND TCP PROBE (Keep-Alive Layer 1)
      # ============================================================
      - name: Start TCP Probe Background Job
        shell: powershell
        run: |
          Write-Host "Starting TCP probe (1 byte/sec) to keep tunnel active..."
          $probeJob = Start-Job -ScriptBlock {
              while ($true) {
                  try {
                      $client = New-Object System.Net.Sockets.TcpClient
                      $client.Connect("127.0.0.1", 3389)
                      $stream = $client.GetStream()
                      $stream.Write([byte[]]@(0), 0, 1)
                      $stream.Flush()
                      $client.Close()
                  } catch {}
                  Start-Sleep -Seconds 1
              }
          }
          Write-Host "TCP Probe Job started (ID: $($probeJob.Id))."
          "PROBE_JOB_ID=$($probeJob.Id)" >> $env:GITHUB_ENV

      # ============================================================
      # STEP 4: START BORE TUNNEL + AUTO-RESTART (Keep-Alive Layer 2)
      # ============================================================
      - name: Start Bore Tunnel for RDP
        shell: powershell
        run: |
          Write-Host "Downloading Bore (Windows binary)..."
          $boreZip = "$env:RUNNER_TEMP\bore.zip"
          
          # Updated download URL for v0.6.0
          Invoke-WebRequest -Uri "https://github.com/ekzhang/bore/releases/download/v0.6.0/bore-v0.6.0-x86_64-pc-windows-msvc.zip" -OutFile $boreZip
          Expand-Archive -Path $boreZip -DestinationPath "$env:RUNNER_TEMP\bore" -Force
          
          $borePath = (Get-ChildItem -Path "$env:RUNNER_TEMP\bore" -Filter "bore*.exe" -Recurse | Select-Object -First 1).FullName
          if (-not $borePath) { throw "Bore executable not found after extraction." }
          
          Write-Host "Bore executable found: $borePath"
          
          $logFile = "$env:RUNNER_TEMP\bore.log"
          $boreAddress = $null
          
          # Monitor loop: Restart Bore if it dies
          Write-Host "Starting Bore tunnel monitor..."
          $boreJob = Start-Job -ScriptBlock {
              param($boreExe, $logFile)
              while ($true) {
                  $proc = Start-Process -FilePath $boreExe -ArgumentList "local 3389 --to bore.pub" -RedirectStandardOutput $logFile -RedirectStandardError "$logFile.err" -PassThru -WindowStyle Hidden
                  Write-Host "[Bore Monitor] Started Bore (PID: $($proc.Id))"
                  
                  # Wait for process to exit
                  $proc.WaitForExit()
                  Write-Host "[Bore Monitor] Bore exited. Restarting in 3 seconds..."
                  Start-Sleep -Seconds 3
              }
          } -ArgumentList $borePath, $logFile
          
          Write-Host "Bore monitor job started (ID: $($boreJob.Id))."
          
          Write-Host "Waiting for Bore to assign a public port..."
          $attempts = 0
          while (-not $boreAddress -and $attempts -lt 30) {
              Start-Sleep -Seconds 2
              if (Test-Path $logFile) {
                  $content = Get-Content $logFile -Raw -ErrorAction SilentlyContinue
                  if ($content -match 'bore\.pub:(\d+)') {
                      $borePort = $matches[1]
                      $boreAddress = "bore.pub:$borePort"
                  }
              }
              $attempts++
          }
          
          if ($boreAddress) {
              Write-Host "======================================================="
              Write-Host "BORE PUBLIC ADDRESS: $boreAddress"
              Write-Host "======================================================="
              "BORE_ADDR=$boreAddress" >> $env:GITHUB_ENV
          } else {
              Write-Host "[ERROR] Could not detect Bore address after $attempts attempts."
              throw "Failed to establish Bore tunnel."
          }

      # ============================================================
      # STEP 5: PUBLISH CONNECTION DETAILS (ASCII-SAFE VERSION)
      # ============================================================
      - name: Publish Connection Details
        shell: powershell
        run: |
          $summaryFile = $env:GITHUB_STEP_SUMMARY
          
          Add-Content -Path $summaryFile -Value "## ThyoCloud Workspace (Bore RDP + Keep-Alive)" -Encoding utf8
          Add-Content -Path $summaryFile -Value "" -Encoding utf8
          Add-Content -Path $summaryFile -Value "### Public Address:" -Encoding utf8
          Add-Content -Path $summaryFile -Value "- **``$env:BORE_ADDR``**" -Encoding utf8
          Add-Content -Path $summaryFile -Value "" -Encoding utf8
          Add-Content -Path $summaryFile -Value "### Credentials:" -Encoding utf8
          Add-Content -Path $summaryFile -Value "- **Username:** ``$env:RDP_USER``" -Encoding utf8
          Add-Content -Path $summaryFile -Value "- **Password:** ``$env:RDP_PASS``" -Encoding utf8
          Add-Content -Path $summaryFile -Value "" -Encoding utf8
          Add-Content -Path $summaryFile -Value "### How to connect:" -Encoding utf8
          Add-Content -Path $summaryFile -Value "1. Open **Remote Desktop Connection** (mstsc)." -Encoding utf8
          Add-Content -Path $summaryFile -Value "2. Enter the Public Address above in the 'Computer' field." -Encoding utf8
          Add-Content -Path $summaryFile -Value "3. Enter the Username and Password when prompted." -Encoding utf8
          Add-Content -Path $summaryFile -Value "" -Encoding utf8
          Add-Content -Path $summaryFile -Value "> **Keep-Alive Active:** TCP probe (1 byte/sec) + automatic Bore restart monitor." -Encoding utf8

      # ============================================================
      # STEP 6: KEEP SESSION ALIVE (Main Loop)
      # ============================================================
      - name: Keep session alive
        shell: powershell
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] Session Active - Bore Tunnel & TCP Probe running..."
              Start-Sleep -Seconds 300
          }
