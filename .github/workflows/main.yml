name: Cloud PC (RustDesk - Layer7 & Wallpaper)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: windows-2025
    timeout-minutes: 360

    steps:
      # ============================================================
      # BƯỚC 1: TẠO USER LAYER7 & CẤU HÌNH RDP
      # ============================================================
      - name: Setup RDP & Create User Layer7
        shell: powershell
        run: |
          Write-Host "Setting up RDP with user Layer7..."
          $RPASS = "P@ssw0rd!"
          $SecurePass = ConvertTo-SecureString $RPASS -AsPlainText -Force
          
          # 1. Tạo user Layer7 bằng PowerShell
          $userExists = Get-LocalUser -Name "Layer7" -ErrorAction SilentlyContinue
          if (-not $userExists) {
              New-LocalUser -Name "Layer7" -Password $SecurePass -FullName "Layer7" -Description "Remote User" -PasswordNeverExpires -ErrorAction Stop
              Write-Host "User Layer7 created successfully."
          } else {
              Set-LocalUser -Name "Layer7" -Password $SecurePass -PasswordNeverExpires $true
              Write-Host "User Layer7 password updated."
          }
          
          # 2. Thêm vào nhóm quyền
          Add-LocalGroupMember -Group "Administrators" -Member "Layer7" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "Layer7" -ErrorAction SilentlyContinue
          
          # 3. Cấu hình RDP
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled False
          
          # 4. Thiết lập Auto Login cho Layer7
          $regPath = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon"
          Set-ItemProperty -Path $regPath -Name "AutoAdminLogon" -Value "1" -Type String
          Set-ItemProperty -Path $regPath -Name "DefaultUsername" -Value "Layer7" -Type String
          Set-ItemProperty -Path $regPath -Name "DefaultPassword" -Value $RPASS -Type String
          
          "RDP_USER=Layer7" >> $env:GITHUB_ENV
          "RDP_PASS=$RPASS" >> $env:GITHUB_ENV
      - name: Lock Screen for Security
        shell: powershell
        run: |
          Write-Host "Locking the screen..."
          # Lệnh này sẽ khóa màn hình hiện tại (yêu cầu mật khẩu để mở)
          rundll32.exe user32.dll,LockWorkStation

      # ============================================================
      # BƯỚC 2: ĐỔI HÌNH NỀN (Tự động nhận diện .jpg hoặc .png)
      # ============================================================
      - name: Set Windows Wallpaper
        shell: powershell
        run: |
          $WallpaperJpg = "$env:GITHUB_WORKSPACE\Wallpaper\wallpaper.jpg"
          $WallpaperPng = "$env:GITHUB_WORKSPACE\Wallpaper\wallpaper.png"
          $Wallpaper = $null

          # Tìm file ảnh (ưu tiên .jpg, nếu không có thì tìm .png)
          if (Test-Path $WallpaperJpg) { $Wallpaper = $WallpaperJpg }
          elseif (Test-Path $WallpaperPng) { $Wallpaper = $WallpaperPng }

          if ($Wallpaper) {
              Write-Host "Found wallpaper: $Wallpaper"
              
              # 1. Tắt chính sách chặn hình nền trên RDP
              $tsPolicy = "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"
              if (!(Test-Path $tsPolicy)) { New-Item -Path $tsPolicy -Force | Out-Null }
              Set-ItemProperty -Path $tsPolicy -Name "fNoRemoteDesktopWallpaper" -Value 0 -Type DWord -Force

              # 2. Đổi hình nền cho user hiện tại (runneradmin)
              Set-ItemProperty -Path "HKCU:\Control Panel\Desktop" -Name Wallpaper -Value $Wallpaper
              Set-ItemProperty -Path "HKCU:\Control Panel\Desktop" -Name WallpaperStyle -Value "10"
              Set-ItemProperty -Path "HKCU:\Control Panel\Desktop" -Name TileWallpaper -Value "0"

              # 3. Đổi hình nền cho User Layer7 (Load Default User)
              try {
                  reg load "HKU\DefaultUser" "C:\Users\Default\NTUSER.DAT" | Out-Null
                  $DefaultRegPath = "Registry::HKEY_USERS\DefaultUser\Control Panel\Desktop"
                  Set-ItemProperty -Path $DefaultRegPath -Name Wallpaper -Value $Wallpaper
                  Set-ItemProperty -Path $DefaultRegPath -Name WallpaperStyle -Value "10"
                  Set-ItemProperty -Path $DefaultRegPath -Name TileWallpaper -Value "0"
                  reg unload "HKU\DefaultUser" | Out-Null
                  Write-Host "Default user wallpaper updated."
              } catch {
                  Write-Host "[WARNING] Could not update default user wallpaper."
              }

              # 4. Làm mới
              Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public class WallpaperSetter { [DllImport("user32.dll", CharSet = CharSet.Auto)] public static extern int SystemParametersInfo(int uAction, int uParam, string lpvParam, int fuWinIni); }'
              [WallpaperSetter]::SystemParametersInfo(20, 0, $Wallpaper, 3)

              Write-Host "Wallpaper set successfully!"
          } else {
              Write-Warning "Không tìm thấy file wallpaper.jpg hoặc wallpaper.png trong thư mục Wallpaper. Bỏ qua bước đổi hình nền."
          }

      # ============================================================
      # BƯỚC 3: CÀI ĐẶT RUSTDESK & LẤY ID
      # ============================================================
      - name: Install RustDesk & Get ID
        shell: powershell
        run: |
          Write-Host "Downloading RustDesk..."
          $msiPath = "$env:RUNNER_TEMP\rustdesk.msi"
          curl.exe -L --fail -o $msiPath "https://github.com/rustdesk/rustdesk/releases/download/1.2.6/rustdesk-1.2.6-x86_64.msi"
          
          Write-Host "Installing RustDesk..."
          Start-Process -FilePath "msiexec.exe" -ArgumentList "/i `"$msiPath`" /qn /norestart" -Wait
          Start-Sleep -Seconds 15
          
          $rustdeskExe = "C:\Program Files\RustDesk\rustdesk.exe"
          Write-Host "Applying password..."
          & $rustdeskExe --password $env:RDP_PASS
          
          Write-Host "Retrieving ID..."
          $rustdeskId = $null
          $attempts = 0
          while (-not $rustdeskId -and $attempts -lt 10) {
              $idOutput = & $rustdeskExe --get-id 2>&1 | Out-String
              if ($idOutput -match '(\d{9,10})') {
                  $rustdeskId = $matches[1]
                  break
              }
              Write-Host "Retrying ID..."
              Start-Sleep -Seconds 5
              $attempts++
          }
          
          if ($rustdeskId) {
              "RUSTDESK_ID=$rustdeskId" >> $env:GITHUB_ENV
              Write-Host "RustDesk ID: $rustdeskId"
          } else {
              Write-Host "[WARNING] Could not get RustDesk ID. IP may be blocked."
          }

      # ============================================================
      # BƯỚC 4: ÉP PHIÊN LÀM VIỆC SANG LAYER7
      # ============================================================
      - name: Force Session to Layer7
        shell: powershell
        run: |
          Write-Host "Attempting to switch active session to Layer7..."
          $currentSession = (Get-Process -Id $PID).SessionId
          Write-Host "Current session ID: $currentSession"
          
          # Tạo task chạy tscon sau 10s
          $action = New-ScheduledTaskAction -Execute "cmd.exe" -Argument "/c tscon $currentSession /dest:console"
          $trigger = New-ScheduledTaskTrigger -Once -At (Get-Date).AddSeconds(10)
          Register-ScheduledTask -TaskName "SwitchToLayer7" -Action $action -Trigger $trigger -User "SYSTEM" -RunLevel Highest -Force
          
          Write-Host "Scheduled session switch in 10 seconds."

      # ============================================================
      # BƯỚC 5: XUẤT THÔNG TIN KẾT NỐI
      # ============================================================
      - name: Publish Connection Details
        shell: powershell
        run: |
          $summaryFile = $env:GITHUB_STEP_SUMMARY
          Add-Content -Path $summaryFile -Value "## Cloud PC (Auto Login: Layer7)" -Encoding utf8
          Add-Content -Path $summaryFile -Value "" -Encoding utf8
          Add-Content -Path $summaryFile -Value "### Thông tin kết nối:" -Encoding utf8
          Add-Content -Path $summaryFile -Value "- **Username:** ``Layer7``" -Encoding utf8
          Add-Content -Path $summaryFile -Value "- **Password:** ``$env:RDP_PASS``" -Encoding utf8
          Add-Content -Path $summaryFile -Value "" -Encoding utf8
          
          if ($env:RUSTDESK_ID) {
              Add-Content -Path $summaryFile -Value "### RustDesk ID:" -Encoding utf8
              Add-Content -Path $summaryFile -Value "- ``$env:RUSTDESK_ID``" -Encoding utf8
          }

      # ============================================================
      # BƯỚC 6: GIỮ SESSION SỐNG
      # ============================================================
      - name: Keep Session Alive
        shell: powershell
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] Session Active..."
              Start-Sleep -Seconds 300
          }
