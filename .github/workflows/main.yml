name: Layer7 Store Cloud PC

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: 'Mã đơn hàng (VD: ORD-123)'
        required: true
        type: string
      hours:
        description: 'Số giờ thuê (VD: 3)'
        required: true
        default: '3'
        type: string

permissions:
  actions: write
  contents: read

jobs:
  deploy-instance:
    runs-on: windows-2025
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Initialize workspace
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $work = 'C:\Layer7'
          $temp = Join-Path $work 'temp'
          New-Item -ItemType Directory -Path $work,$temp -Force | Out-Null
          "WORK_DIR=$work" >> $env:GITHUB_ENV
          "TEMP_DIR=$temp" >> $env:GITHUB_ENV

      - name: Generate Windows account password
        id: gen_pass
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $chars = 'abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#'
          $password = -join (1..18 | ForEach-Object { $chars[(Get-Random -Maximum $chars.Length)] })
          "GENERATED_PASSWORD=$password" >> $env:GITHUB_ENV
          "RDP_USERNAME=Layer7Store" >> $env:GITHUB_ENV

      - name: Setup Windows account and RDP fallback
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name UserAuthentication -Value 1
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop' -ErrorAction SilentlyContinue

          $secure = ConvertTo-SecureString $env:GENERATED_PASSWORD -AsPlainText -Force
          $user = Get-LocalUser -Name $env:RDP_USERNAME -ErrorAction SilentlyContinue
          if ($null -eq $user) {
            New-LocalUser -Name $env:RDP_USERNAME -Password $secure -PasswordNeverExpires -AccountNeverExpires -FullName 'Layer7 Store'
          } else {
            Set-LocalUser -Name $env:RDP_USERNAME -Password $secure
          }
          Add-LocalGroupMember -Group 'Remote Desktop Users' -Member $env:RDP_USERNAME -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group 'Administrators' -Member $env:RDP_USERNAME -ErrorAction SilentlyContinue
          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService -ErrorAction SilentlyContinue
          Write-Host 'Windows account and RDP configured.'

      - name: Install and configure RustDesk
        shell: powershell
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/rustdesk/rustdesk/releases/latest' -Headers @{ 'User-Agent' = 'Layer7Store-CloudPC' }
          $asset = $release.assets | Where-Object { $_.name -match '^rustdesk-.*-x86_64\.msi$' } | Select-Object -First 1
          $useMsi = $null -ne $asset
          if (-not $asset) {
            $asset = $release.assets | Where-Object { $_.name -match '^rustdesk-.*-x86_64\.exe$' } | Select-Object -First 1
          }
          if (-not $asset) { throw 'Không tìm thấy gói cài RustDesk x86_64 trong GitHub Releases.' }

          $installer = Join-Path $env:TEMP_DIR $asset.name
          Write-Host "Downloading RustDesk $($release.tag_name)..."
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $installer
          if (-not (Test-Path $installer) -or (Get-Item $installer).Length -lt 1MB) {
            throw 'RustDesk installer tải về không hợp lệ.'
          }

          if ($useMsi) {
            $p = Start-Process -FilePath 'msiexec.exe' -ArgumentList @('/i', "`"$installer`"", '/qn', '/norestart') -Wait -PassThru
          } else {
            $p = Start-Process -FilePath $installer -ArgumentList '--silent-install' -Wait -PassThru -WindowStyle Hidden
          }
          if ($p.ExitCode -notin @(0, 1641, 3010)) {
            throw "RustDesk installer exited with code $($p.ExitCode)."
          }

          $candidates = @(
            "$env:ProgramFiles\RustDesk\rustdesk.exe",
            "${env:ProgramFiles(x86)}\RustDesk\rustdesk.exe",
            "$env:LOCALAPPDATA\Programs\RustDesk\rustdesk.exe"
          )
          $rustdeskExe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $rustdeskExe) {
            $rustdeskExe = Get-ChildItem "$env:ProgramFiles","${env:ProgramFiles(x86)}" -Filter rustdesk.exe -Recurse -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName -First 1
          }
          if (-not $rustdeskExe) { throw 'Cài đặt xong nhưng không tìm thấy rustdesk.exe.' }
          "RUSTDESK_EXE=$rustdeskExe" >> $env:GITHUB_ENV
          Write-Host "RustDesk executable found: $rustdeskExe"

          # Register service; do not assume that the installer created it.
          $svc = Get-Service -Name RustDesk -ErrorAction SilentlyContinue
          if (-not $svc) {
            $serviceOutput = @(& $rustdeskExe --install-service 2>&1)
            Start-Sleep -Seconds 4
            $svc = Get-Service -Name RustDesk -ErrorAction SilentlyContinue
          }
          if (-not $svc) {
            throw 'RustDesk service was not registered. Check runner administrator permissions and installer logs.'
          }
          if ($svc.Status -ne 'Running') {
            Start-Service -Name $svc.Name
            Start-Sleep -Seconds 4
          }
          $svc = Get-Service -Name RustDesk
          if ($svc.Status -ne 'Running') { throw "RustDesk service is not running (status: $($svc.Status))." }

          # Configure permanent password; keep password and raw CLI output out of logs.
          $pwOutput = @(& $rustdeskExe --password $env:GENERATED_PASSWORD 2>&1)
          $pwExit = $LASTEXITCODE
          $pwText = ($pwOutput | Out-String).Trim()
          if ($pwExit -ne 0 -or $pwText -notmatch '(?i)\bDone!\b') {
            Write-Host "RustDesk password command exit code: $pwExit"
            Write-Host "RustDesk service status: $((Get-Service -Name RustDesk).Status)"
            if ($pwText -match 'Installation and administrative privileges required!') {
              throw 'RustDesk requires an installed service and administrative privileges to set its password.'
            } elseif ($pwText -match 'Settings are disabled!|Changing permanent password is disabled!') {
              throw 'RustDesk policy prevents changing the permanent password.'
            } else {
              throw 'RustDesk did not confirm password configuration. Check service permissions and RustDesk policy.'
            }
          }

          # Retrieve ID by scanning all output lines, not only the first line.
          $rustdeskId = $null
          for ($i = 1; $i -le 15 -and -not $rustdeskId; $i++) {
            $idOutput = @(& $rustdeskExe --get-id 2>&1)
            foreach ($line in $idOutput) {
              $candidate = ([string]$line).Trim()
              if ($candidate -match '^\d{6,20}$') { $rustdeskId = $candidate; break }
            }
            if (-not $rustdeskId) { Start-Sleep -Seconds 3 }
          }
          if (-not $rustdeskId) { throw 'RustDesk ID not available after retries.' }
          "RUSTDESK_ID=$rustdeskId" >> $env:GITHUB_ENV

          # Firewall rules for RustDesk networking.
          New-NetFirewallRule -DisplayName 'Layer7 RustDesk TCP' -Direction Inbound -Action Allow -Protocol TCP -LocalPort 21115-21119 -ErrorAction SilentlyContinue | Out-Null
          New-NetFirewallRule -DisplayName 'Layer7 RustDesk UDP' -Direction Inbound -Action Allow -Protocol UDP -LocalPort 21116 -ErrorAction SilentlyContinue | Out-Null
          Write-Host "RustDesk configured. ID: $rustdeskId"

      - name: Download, extract and validate Mesa3D package (REQUIRED)
        shell: powershell
        timeout-minutes: 12
        run: |
          $ErrorActionPreference = 'Stop'
          $mesaDir = Join-Path $env:WORK_DIR 'mesa3d'
          $archive = Join-Path $env:TEMP_DIR 'mesa3d-release-msvc.7z'
          New-Item -ItemType Directory -Path $mesaDir -Force | Out-Null

          # Use the latest official mesa-dist-win MSVC release package.
          $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/pal1000/mesa-dist-win/releases/latest' -Headers @{ 'User-Agent' = 'Layer7Store-CloudPC' }
          $asset = $release.assets | Where-Object { $_.name -match '^mesa3d-.*-release-msvc\.7z$' } | Select-Object -First 1
          if (-not $asset) { throw 'Không tìm thấy gói Mesa3D release-msvc. Bước Mesa3D là bắt buộc.' }

          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $archive
          if (-not (Test-Path $archive) -or (Get-Item $archive).Length -lt 1MB) {
            throw 'Tệp Mesa3D tải về không hợp lệ.'
          }

          $sevenZip = @(
            "$env:ProgramFiles\7-Zip\7z.exe",
            "${env:ProgramFiles(x86)}\7-Zip\7z.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $sevenZip) {
            $winget = Get-Command winget.exe -ErrorAction SilentlyContinue
            if ($winget) {
              & winget install --id 7zip.7zip --exact --silent --accept-package-agreements --accept-source-agreements
            }
            $sevenZip = @("$env:ProgramFiles\7-Zip\7z.exe","${env:ProgramFiles(x86)}\7-Zip\7z.exe") |
              Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $sevenZip) { throw 'Không tìm thấy 7-Zip để giải nén Mesa3D; không thể bỏ qua bước bắt buộc.' }

          & $sevenZip x $archive "-o$mesaDir" -y | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "Giải nén Mesa3D thất bại (7-Zip exit $LASTEXITCODE)." }
          $dlls = Get-ChildItem -Path $mesaDir -Filter 'opengl32.dll' -Recurse -ErrorAction SilentlyContinue
          if (-not $dlls) {
            $dlls = Get-ChildItem -Path $mesaDir -Filter 'libgallium_wgl.dll' -Recurse -ErrorAction SilentlyContinue
          }
          if (-not $dlls) { throw 'Đã giải nén nhưng không tìm thấy DLL Mesa3D cần thiết.' }

          "MESA3D_DIR=$mesaDir" >> $env:GITHUB_ENV
          Write-Host "Mesa3D $($release.tag_name) extracted and validated at $mesaDir"

      - name: Optimize storage and debloat
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $paths = @(
            "$env:TEMP\*",
            'C:\Windows\Temp\*',
            'C:\Users\runneradmin\AppData\Local\Temp\*'
          )
          foreach ($path in $paths) { Remove-Item $path -Recurse -Force -ErrorAction SilentlyContinue }
          Write-Host 'Temporary files cleaned; no game installations are added.'

      - name: Configure dark mode
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $personalize = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize'
          New-Item -Path $personalize -Force | Out-Null
          Set-ItemProperty -Path $personalize -Name AppsUseLightTheme -Value 0 -Type DWord
          Set-ItemProperty -Path $personalize -Name SystemUsesLightTheme -Value 0 -Type DWord
          Write-Host 'Dark mode configured for the runner account.'

      - name: Configure audio and microphone policies
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          Set-Service -Name Audiosrv -StartupType Automatic -ErrorAction SilentlyContinue
          Start-Service -Name Audiosrv -ErrorAction SilentlyContinue
          Set-Service -Name AudioEndpointBuilder -StartupType Automatic -ErrorAction SilentlyContinue
          Start-Service -Name AudioEndpointBuilder -ErrorAction SilentlyContinue
          Write-Host 'Audio services enabled where supported by the runner image.'

      - name: Install optional utilities
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $winget = Get-Command winget.exe -ErrorAction SilentlyContinue
          if ($winget) {
            & winget install --id 7zip.7zip --exact --silent --accept-package-agreements --accept-source-agreements
          } else {
            Write-Host 'winget unavailable; skipping optional utility installation.'
          }

      - name: Apply wallpaper from assets if present
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $wallpaper = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Include *.jpg,*.jpeg,*.png -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '[\\/]assets[\\/].*wallpaper|[\\/]wallpaper\.' } |
            Select-Object -First 1
          if ($wallpaper) {
            Write-Host "Wallpaper asset found: $($wallpaper.Name). It can be applied after interactive user logon."
          } else {
            Write-Host 'No wallpaper asset found; leaving default wallpaper unchanged.'
          }

      - name: Publish RustDesk connection information
        shell: powershell
        env:
          PHONE_SERVER_URL: ${{ secrets.PHONE_SERVER_URL }}
        run: |
          $ErrorActionPreference = 'Continue'
          $nodeId = [string]'${{ github.event.inputs.instance_number }}'
          $summary = @(
            '## Layer7 Store Cloud PC',
            '',
            "- Order / instance: $nodeId",
            "- Windows username: $env:RDP_USERNAME",
            "- RustDesk ID: $env:RUSTDESK_ID",
            '',
            'Windows and RustDesk passwords are not printed to the workflow log.'
          )
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8

          if ([string]::IsNullOrWhiteSpace($env:PHONE_SERVER_URL)) {
            Write-Host 'PHONE_SERVER_URL secret is not set; skipping phone-server notification.'
            exit 0
          }
          $url = "$($env:PHONE_SERVER_URL.TrimEnd('/'))/api/provision/$nodeId"
          $body = @{
            rustdesk_id = $env:RUSTDESK_ID
            rustdesk_password = $env:GENERATED_PASSWORD
            windows_username = $env:RDP_USERNAME
            windows_password = $env:GENERATED_PASSWORD
          } | ConvertTo-Json
          try {
            Invoke-RestMethod -Uri $url -Method Post -Body $body -ContentType 'application/json' -TimeoutSec 30 | Out-Null
            Write-Host 'Phone server notified successfully.'
          } catch {
            Write-Host "Phone server notification failed: $($_.Exception.Message)"
          }

      - name: Keep session alive
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $hours = 3
          try { $hours = [int]'${{ github.event.inputs.hours }}' } catch {}
          if ($hours -lt 1) { $hours = 1 }
          if ($hours -gt 5) { $hours = 5 }
          $end = (Get-Date).AddHours($hours)
          Write-Host "Session ends at $end"
          while ((Get-Date) -lt $end) {
            $svc = Get-Service -Name RustDesk -ErrorAction SilentlyContinue
            if ($svc -and $svc.Status -ne 'Running') {
              Start-Service -Name RustDesk -ErrorAction SilentlyContinue
            }
            Start-Sleep -Seconds 60
          }
          Write-Host 'Rental session time elapsed.'

      - name: Persist user files
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $persist = Join-Path $env:WORK_DIR 'persist'
          New-Item -ItemType Directory -Path $persist -Force | Out-Null
          @"
          Instance=${{ github.event.inputs.instance_number }}
          Username=$env:RDP_USERNAME
          RustDeskID=$env:RUSTDESK_ID
          "@ | Out-File -FilePath (Join-Path $persist 'connection-state.txt') -Encoding utf8
          Write-Host "State saved to $persist"

      - name: Upload state artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layer7-state-${{ github.run_id }}
          path: C:\Layer7\persist\
          if-no-files-found: ignore
          retention-days: 3

      - name: Finalize and cleanup temporary files
        if: always()
        shell: powershell
        run: |
          Remove-Item -Path "$env:TEMP_DIR\*" -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host 'Temporary installer files cleaned.'
