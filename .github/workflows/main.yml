name: RDP via Custom FRP Tunnel

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Setup RDP & Firewall
        shell: powershell
        run: |
          Write-Host "Setting up RDP..."
          $RPASS = "P@ssw0rd!"
          net user Admin $RPASS /add
          net localgroup "Administrators" Admin /add 2>$null
          net localgroup "Remote Desktop Users" Admin /add 2>$null
          
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled False
          
          "RDP_USER=Admin" >> $env:GITHUB_ENV
          "RDP_PASS=$RPASS" >> $env:GITHUB_ENV

      - name: Setup FRP Client & Connect
        shell: powershell
        env:
          FRP_SERVER_IP: ${{ secrets.FRP_SERVER_IP }}
          FRP_AUTH_TOKEN: ${{ secrets.FRP_AUTH_TOKEN }}
        run: |
          $serverAddress = $env:FRP_SERVER_IP
          $authToken = $env:FRP_AUTH_TOKEN
          
          if ([string]::IsNullOrEmpty($serverAddress)) {
              Write-Host "ERROR: FRP_SERVER_IP Secret is empty. Please check your GitHub Secrets."
              exit 1
          }
          
          Write-Host "Downloading FRP Client..."
          $frpUrl = "https://github.com/fatedier/frp/releases/download/v0.61.0/frp_0.61.0_windows_amd64.zip"
          $zipPath = "$env:RUNNER_TEMP\frp.zip"
          curl.exe -L --fail -o $zipPath $frpUrl
          
          Write-Host "Extracting FRP..."
          $extractPath = "$env:RUNNER_TEMP\frp_extract"
          Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force
          
          # Tìm file frpc.exe thực tế (nó nằm trong thư mục con)
          $frpcExe = (Get-ChildItem -Path $extractPath -Filter "frpc.exe" -Recurse | Select-Object -First 1).FullName
          
          if (-not $frpcExe) {
              Write-Host "ERROR: Cannot find frpc.exe after extraction."
              exit 1
          }

          Write-Host "Creating config file..."
          $configPath = "$env:RUNNER_TEMP\frpc.toml"
          
          $configLines = @(
              "serverAddr = `"$serverAddress`"",
              "serverPort = 7000",
              "auth.method = `"token`"",
              "auth.token = `"$authToken`"",
              "",
              "[[proxies]]",
              "name = `"github-rdp`"",
              "type = `"tcp`"",
              "localIP = `"127.0.0.1`"",
              "localPort = 3389",
              "remotePort = 13389"
          )
          
          $configLines | Out-File -FilePath $configPath -Encoding utf8
          
          Write-Host "Connecting to $serverAddress..."
          Start-Process -FilePath $frpcExe -ArgumentList "-c `"$configPath`"" -WindowStyle Hidden
          
          Start-Sleep -Seconds 5
          Write-Host "[SUCCESS] Connected to your server!"

      - name: Publish Connection Details
        shell: powershell
        env:
          FRP_SERVER_IP: ${{ secrets.FRP_SERVER_IP }}
        run: |
          $summaryFile = $env:GITHUB_STEP_SUMMARY
          Add-Content -Path $summaryFile -Value "## Kết nối RDP" -Encoding utf8
          Add-Content -Path $summaryFile -Value "- **Địa chỉ:** ``$env:FRP_SERVER_IP:13389``" -Encoding utf8
          Add-Content -Path $summaryFile -Value "- **User:** ``Admin``" -Encoding utf8
          Add-Content -Path $summaryFile -Value "- **Pass:** ``P@ssw0rd!``" -Encoding utf8

      - name: Keep Session Alive
        shell: powershell
        run: |
          while ($true) { 
              Write-Host "[$(Get-Date)] Session Active..."
              Start-Sleep -Seconds 300 
          }
