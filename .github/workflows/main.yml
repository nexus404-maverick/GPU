name: ThyoCloud Personal Workspace (Self-Hosted RDP)

on:
  workflow_dispatch:
    inputs:
      customUsername:
        description: 'RDP Username (Default: Admin)'
        required: false
        default: 'Admin'
      customPassword:
        description: 'RDP Password (Leave empty to auto-generate)'
        required: false
        default: ''

jobs:
  deploy-workspace:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================================
      # STEP 1: CREATE USER AND ENABLE RDP
      # ============================================================
      - name: Setup User & Enable RDP
        shell: powershell
        env:
          RUSER: ${{ github.event.inputs.customUsername || 'Admin' }}
          RPASS_INPUT: ${{ github.event.inputs.customPassword }}
        run: |
          Write-Host "Setting up RDP account..."
          
          # 1. Generate or use provided password
          if ([string]::IsNullOrEmpty($env:RPASS_INPUT)) {
              $chars = "abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#$"
              $RPASS = -join (1..12 | ForEach-Object { $chars[(Get-Random -Maximum $chars.Length)] })
          } else {
              $RPASS = $env:RPASS_INPUT
          }
          
          # 2. Create User and add to Administrators & Remote Desktop Users
          $SecurePass = ConvertTo-SecureString $RPASS -AsPlainText -Force
          
          $userExists = Get-LocalUser -Name $env:RUSER -ErrorAction SilentlyContinue
          if (-not $userExists) {
              New-LocalUser -Name $env:RUSER -Password $SecurePass -FullName "ThyoCloud User" -Description "RDP Account" -PasswordNeverExpires
              Write-Host "Created new user: $env:RUSER"
          } else {
              Set-LocalUser -Name $env:RUSER -Password $SecurePass
              Write-Host "Updated password for user: $env:RUSER"
          }
          
          Add-LocalGroupMember -Group "Administrators" -Member $env:RUSER -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $env:RUSER -ErrorAction SilentlyContinue

          # 3. Enable RDP and disable NLA (Network Level Authentication)
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          
          # 4. Open Firewall for RDP
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue

          # 5. Save to GITHUB_ENV
          "RDP_USER=$env:RUSER" >> $env:GITHUB_ENV
          "RDP_PASS=$RPASS" >> $env:GITHUB_ENV
          
          Write-Host "RDP configuration completed."

      # ============================================================
      # STEP 2: GET PUBLIC IP
      # ============================================================
      - name: Get Public IP
        id: get_ip
        shell: powershell
        run: |
          Write-Host "Fetching public IP..."
          $ip = (Invoke-RestMethod -Uri "https://api.ipify.org?format=json").ip
          Write-Host "Machine Public IP: $ip"
          "RDP_IP=$ip" >> $env:GITHUB_ENV

      # ============================================================
      # STEP 3: SET WALLPAPER
      # ============================================================
      - name: Set Wallpaper
        shell: powershell
        run: |
          Write-Host "Setting up wallpaper..."
          
          $LocalWallpaper = Join-Path $env:GITHUB_WORKSPACE "Wallpaper\wallpaper.png"
          
          if (-not (Test-Path $LocalWallpaper)) {
              Write-Host "[WARNING] Wallpaper file not found at Wallpaper/wallpaper.png. Skipping."
              exit 0
          }

          $DestWallpaper = "C:\Windows\Web\Wallpaper\thyo_bg.png"
          Copy-Item -Path $LocalWallpaper -Destination $DestWallpaper -Force
          
          $RegPath = "HKCU:\Control Panel\Desktop"
          Set-ItemProperty -Path $RegPath -Name Wallpaper -Value $DestWallpaper
          Set-ItemProperty -Path $RegPath -Name WallpaperStyle -Value "10"
          Set-ItemProperty -Path $RegPath -Name TileWallpaper -Value "0"
          
          Add-Type -TypeDefinition @"
          using System;
          using System.Runtime.InteropServices;
          public class Wallpaper {
              [DllImport("user32.dll", CharSet = CharSet.Auto)]
              public static extern int SystemParametersInfo(int uAction, int uParam, string lpvParam, int fuWinIni);
          }
          "@
          [Wallpaper]::SystemParametersInfo(20, 0, $DestWallpaper, 0x01 -bor 0x02)
          
          Write-Host "[SUCCESS] Wallpaper changed successfully!"

      # ============================================================
      # STEP 4: PUBLISH CONNECTION DETAILS (ENGLISH ONLY)
      # ============================================================
      - name: Publish Connection Details
        shell: powershell
        run: |
          $summary = @()
          $summary += "## ThyoCloud Workspace (Self-Hosted RDP)"
          $summary += ""
          $summary += "### Connection Details:"
          $summary += "- **IP Address:** ``$env:RDP_IP``"
          $summary += "- **Username:** ``$env:RDP_USER``"
          $summary += "- **Password:** ``$env:RDP_PASS``"
          $summary += ""
          $summary += "### How to connect:"
          $summary += "1. Open **Remote Desktop Connection** (mstsc) on your PC."
          $summary += "2. Enter the IP Address in the 'Computer' field."
          $summary += "3. Enter the Username and Password when prompted."
          $summary += ""
          $summary += "> **Note:** If connection is refused, wait 1-2 minutes for the RDP service to fully start."
          
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      # ============================================================
      # STEP 5: KEEP SESSION ALIVE
      # ============================================================
      - name: Keep session alive
        shell: powershell
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] Session Active - Waiting for RDP connection..."
              Start-Sleep -Seconds 300
          }
