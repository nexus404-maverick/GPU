name: ThyoCloud Workspace (Cloudflare RDP)

on:
  workflow_dispatch:
    inputs:
      customUsername:
        description: 'RDP Username (Default: Admin)'
        required: false
        default: 'Admin'
      customPassword:
        description: 'RDP Password (Leave empty to auto-generate)'
        required: false
        default: ''

jobs:
  deploy-workspace:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================================
      # STEP 1: CREATE USER AND ENABLE RDP
      # ============================================================
      - name: Setup User & Enable RDP
        shell: powershell
        env:
          RUSER: ${{ github.event.inputs.customUsername || 'Admin' }}
          RPASS_INPUT: ${{ github.event.inputs.customPassword }}
        run: |
          Write-Host "Setting up RDP account..."
          if ([string]::IsNullOrEmpty($env:RPASS_INPUT)) {
              $chars = "abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#$"
              $RPASS = -join (1..12 | ForEach-Object { $chars[(Get-Random -Maximum $chars.Length)] })
          } else { $RPASS = $env:RPASS_INPUT }
          
          $SecurePass = ConvertTo-SecureString $RPASS -AsPlainText -Force
          if (-not (Get-LocalUser -Name $env:RUSER -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name $env:RUSER -Password $SecurePass -FullName "ThyoCloud User" -PasswordNeverExpires
          } else { Set-LocalUser -Name $env:RUSER -Password $SecurePass }
          
          Add-LocalGroupMember -Group "Administrators" -Member $env:RUSER -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $env:RUSER -ErrorAction SilentlyContinue

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue

          "RDP_USER=$env:RUSER" >> $env:GITHUB_ENV
          "RDP_PASS=$RPASS" >> $env:GITHUB_ENV
          Write-Host "RDP configuration completed."

      # ============================================================
      # STEP 2: SET WALLPAPER
      # ============================================================
      - name: Set Wallpaper
        shell: powershell
        run: |
          Write-Host "Setting up wallpaper..."
          $LocalWallpaper = Join-Path $env:GITHUB_WORKSPACE "Wallpaper\wallpaper.png"
          if (-not (Test-Path $LocalWallpaper)) { 
              Write-Host "[WARNING] Wallpaper not found. Skipping."; exit 0 
          }
          
          $DestWallpaper = "C:\Windows\Web\Wallpaper\thyo_bg.png"
          Copy-Item -Path $LocalWallpaper -Destination $DestWallpaper -Force
          
          $RegPath = "HKCU:\Control Panel\Desktop"
          Set-ItemProperty -Path $RegPath -Name Wallpaper -Value $DestWallpaper
          Set-ItemProperty -Path $RegPath -Name WallpaperStyle -Value "10"
          Set-ItemProperty -Path $RegPath -Name TileWallpaper -Value "0"
          
          try {
              reg load "HKU\DefaultUser" "C:\Users\Default\NTUSER.DAT" | Out-Null
              $DefaultRegPath = "Registry::HKEY_USERS\DefaultUser\Control Panel\Desktop"
              Set-ItemProperty -Path $DefaultRegPath -Name Wallpaper -Value $DestWallpaper
              Set-ItemProperty -Path $DefaultRegPath -Name WallpaperStyle -Value "10"
              Set-ItemProperty -Path $DefaultRegPath -Name TileWallpaper -Value "0"
              reg unload "HKU\DefaultUser" | Out-Null
          } catch { Write-Host "[WARNING] Could not update default user wallpaper." }
          
          Add-Type -TypeDefinition @"
          using System;
          using System.Runtime.InteropServices;
          public class Wallpaper {
              [DllImport("user32.dll", CharSet = CharSet.Auto)]
              public static extern int SystemParametersInfo(int uAction, int uParam, string lpvParam, int fuWinIni);
          }
          "@
          [Wallpaper]::SystemParametersInfo(20, 0, $DestWallpaper, 0x01 -bor 0x02)
          Write-Host "[SUCCESS] Wallpaper changed!"

      # ============================================================
      # STEP 3: BACKGROUND TCP PROBE (Giữ kết nối không bị ngắt)
      # ============================================================
      - name: Start TCP Probe Background Job
        shell: powershell
        run: |
          Write-Host "Starting TCP probe (1 byte/sec)..."
          $probeJob = Start-Job -ScriptBlock {
              while ($true) {
                  try {
                      $client = New-Object System.Net.Sockets.TcpClient
                      $client.Connect("127.0.0.1", 3389)
                      $stream = $client.GetStream()
                      $stream.Write([byte[]]@(0), 0, 1)
                      $stream.Flush()
                      $client.Close()
                  } catch {}
                  Start-Sleep -Seconds 1
              }
          }
          Write-Host "TCP Probe Job started (ID: $($probeJob.Id))."
          "PROBE_JOB_ID=$($probeJob.Id)" >> $env:GITHUB_ENV

      # ============================================================
      # STEP 4: START CLOUDFLARE TUNNEL
      # ============================================================
      - name: Start Cloudflare Tunnel
        shell: powershell
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          Write-Host "Downloading cloudflared..."
          $cfExe = "$env:RUNNER_TEMP\cloudflared.exe"
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile $cfExe
          
          Write-Host "Starting Cloudflare Tunnel..."
          $cfProcess = Start-Process -FilePath $cfExe -ArgumentList "tunnel --no-autoupdate run --token $env:CF_TOKEN" -PassThru -WindowStyle Hidden -RedirectStandardOutput "$env:RUNNER_TEMP\cf.log" -RedirectStandardError "$env:RUNNER_TEMP\cf.err"
          
          Write-Host "Cloudflare Tunnel started (PID: $($cfProcess.Id)). Waiting 10 seconds..."
          Start-Sleep -Seconds 10
          Write-Host "Tunnel is running in the background."

      # ============================================================
      # STEP 5: PUBLISH CONNECTION DETAILS (ASCII-SAFE)
      # ============================================================
      - name: Publish Connection Details
        shell: powershell
        run: |
          $summaryFile = $env:GITHUB_STEP_SUMMARY
          
          Add-Content -Path $summaryFile -Value "## ThyoCloud Workspace (Cloudflare RDP)" -Encoding utf8
          Add-Content -Path $summaryFile -Value "" -Encoding utf8
          Add-Content -Path $summaryFile -Value "### Public Domain:" -Encoding utf8
          Add-Content -Path $summaryFile -Value "- **Domain:** ``hiepdz.de5.net`` (Make sure this matches your Cloudflare Public Hostname)" -Encoding utf8
          Add-Content -Path $summaryFile -Value "" -Encoding utf8
          Add-Content -Path $summaryFile -Value "### Credentials:" -Encoding utf8
          Add-Content -Path $summaryFile -Value "- **Username:** ``$env:RDP_USER``" -Encoding utf8
          Add-Content -Path $summaryFile -Value "- **Password:** ``$env:RDP_PASS``" -Encoding utf8
          Add-Content -Path $summaryFile -Value "" -Encoding utf8
          Add-Content -Path $summaryFile -Value "### How to connect:" -Encoding utf8
          Add-Content -Path $summaryFile -Value "1. Open CMD/PowerShell and run this command (keep it open):" -Encoding utf8
          Add-Content -Path $summaryFile -Value "   ``cloudflared access rdp --hostname hiepdz.de5.net --url rdp://localhost:13389``" -Encoding utf8
          Add-Content -Path $summaryFile -Value "2. Open Remote Desktop Connection (mstsc)." -Encoding utf8
          Add-Content -Path $summaryFile -Value "3. In the Computer field, enter: ``localhost:13389``" -Encoding utf8
          Add-Content -Path $summaryFile -Value "4. Enter the Username and Password above." -Encoding utf8

      # ============================================================
      # STEP 6: KEEP SESSION ALIVE (Main Loop)
      # ============================================================
      - name: Keep session alive
        shell: powershell
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] Session Active - Cloudflare Tunnel & TCP Probe running..."
              Start-Sleep -Seconds 300
          }
