name: ThyoCloud Workspace (Anywherelan P2P RDP - Debug)

on:
  workflow_dispatch:

jobs:
  deploy-workspace:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================================
      # STEP 1: SETUP RDP ACCOUNT
      # ============================================================
      - name: Setup RDP Account
        shell: powershell
        run: |
          $RPASS = "P@ssw0rd!"
          net user Admin $RPASS /add
          net localgroup "Administrators" Admin /add 2>$null
          net localgroup "Remote Desktop Users" Admin /add 2>$null
          Set-LocalUser -Name Admin -PasswordNeverExpires $true
          "RDP_USER=Admin" >> $env:GITHUB_ENV
          "RDP_PASS=$RPASS" >> $env:GITHUB_ENV

      # ============================================================
      # STEP 2: APPLY XYDESK OPTIMIZATIONS & DISABLE FIREWALL
      # ============================================================
      - name: Apply XyDesk Optimizations & Disable Firewall
        shell: powershell
        run: |
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fSingleSessionPerUser" -Value 0
          Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled False
          netsh advfirewall firewall add rule name="RDP All Profiles" dir=in action=allow protocol=TCP localport=3389 profile=any | Out-Null
          Start-Service TermService

      # ============================================================
      # STEP 3: DOWNLOAD AND RUN ANYWARELAN
      # ============================================================
      - name: Download and Start Anywherelan (awl)
        shell: powershell
        run: |
          $awlUrl = "https://github.com/anywherelan/awl/releases/download/v0.20.0/awl-windows-amd64-v0.20.0.zip"
          $awlZip = "$env:RUNNER_TEMP\awl.zip"
          curl.exe -L --fail -o $awlZip $awlUrl
          Expand-Archive -Path $awlZip -DestinationPath "$env:RUNNER_TEMP\awl" -Force
          $awlExe = "$env:RUNNER_TEMP\awl\awl.exe"
          Start-Process -FilePath $awlExe -WindowStyle Hidden
          Write-Host "Waiting for Anywherelan to initialize (30s)..."
          Start-Sleep -Seconds 30

      # ============================================================
      # STEP 4: GET PEER ID (DEBUG MODE)
      # ============================================================
      - name: Get Peer Info & Start Auto-Accept Job
        shell: powershell
        run: |
          $awlExe = "$env:RUNNER_TEMP\awl\awl.exe"
          
          Write-Host "=== IN TOÀN BỘ OUTPUT CỦA 'awl status' ĐỂ TÌM ID ==="
          $statusOutput = (& $awlExe status 2>&1) | Out-String
          Write-Host $statusOutput
          
          Write-Host "=== IN TOÀN BỘ OUTPUT CỦA 'awl cli me' ==="
          $cliOutput = (& $awlExe cli me 2>&1) | Out-String
          Write-Host $cliOutput

          # Cố gắng tự động trích xuất ID bằng Regex mạnh hơn
          $peerId = $null
          if ($statusOutput -match '(12D3KooW[a-zA-Z0-9]+)') {
              $peerId = $matches[1]
          } elseif ($cliOutput -match '(12D3KooW[a-zA-Z0-9]+)') {
              $peerId = $matches[1]
          }

          Write-Host "======================================================="
          Write-Host "TỰ ĐỘNG TRÍCH XUẤT ĐƯỢC PEER ID: $peerId"
          Write-Host "======================================================="

          "AWL_PEER_ID=$peerId" >> $env:GITHUB_ENV

          # Lấy IP VPN
          $vpnIp = "10.66.0.2"
          if ($statusOutput -match 'IP:\s*([0-9\.]+)') { $vpnIp = $matches[1] }
          "AWL_IP=$vpnIp" >> $env:GITHUB_ENV

          # Chạy Auto-Accept Job
          Start-Job -ScriptBlock {
              param($exe)
              while ($true) {
                  try {
                      $peersOutput = & $exe cli peers 2>&1 | Out-String
                      $matches = [regex]::Matches($peersOutput, '(12D3KooW[a-zA-Z0-9]+)')
                      foreach ($match in $matches) {
                          & $exe cli peers accept $match.Groups[1].Value 2>&1 | Out-Null
                      }
                  } catch {}
                  Start-Sleep -Seconds 5
              }
          } -ArgumentList $awlExe

      # ============================================================
      # STEP 5: PUBLISH CONNECTION DETAILS
      # ============================================================
      - name: Publish Connection Details
        shell: powershell
        run: |
          $summaryFile = $env:GITHUB_STEP_SUMMARY
          Add-Content -Path $summaryFile -Value "## ThyoCloud Workspace (Anywherelan)" -Encoding utf8
          
          if ([string]::IsNullOrEmpty($env:AWL_PEER_ID)) {
              Add-Content -Path $summaryFile -Value "**CẢNH BÁO:** Không tự động lấy được Peer ID. Bạn phải mở log của bước 'Get Peer Info & Start Auto-Accept Job', tìm chuỗi bắt đầu bằng ``12D3KooW...`` và copy thủ công." -Encoding utf8
          } else {
              Add-Content -Path $summaryFile -Value ("- **Peer ID:** ``" + $env:AWL_PEER_ID + "``") -Encoding utf8
          }
          
          Add-Content -Path $summaryFile -Value ("- **IP để kết nối RDP:** ``" + $env:AWL_IP + ":3389" + "``") -Encoding utf8
          Add-Content -Path $summaryFile -Value ("- **Username:** ``" + $env:RDP_USER + "``") -Encoding utf8
          Add-Content -Path $summaryFile -Value ("- **Password:** ``" + $env:RDP_PASS + "``") -Encoding utf8

      # ============================================================
      # STEP 6: KEEP SESSION ALIVE
      # ============================================================
      - name: Keep session alive
        shell: powershell
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] Session Active - Waiting for connection..."
              Start-Sleep -Seconds 300
          }
