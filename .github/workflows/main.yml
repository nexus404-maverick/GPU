name: ThyoCloud Workspace (FRP VPS Tunnel)

on:
  workflow_dispatch:
    inputs:
      customUsername:
        description: 'RDP Username (Default: Admin)'
        required: false
        default: 'Admin'
      customPassword:
        description: 'RDP Password (Leave empty to auto-generate)'
        required: false
        default: ''

jobs:
  deploy-workspace:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================================
      # STEP 1: CREATE USER AND ENABLE RDP
      # ============================================================
      - name: Setup User & Enable RDP
        shell: powershell
        env:
          RUSER: ${{ github.event.inputs.customUsername || 'Admin' }}
          RPASS_INPUT: ${{ github.event.inputs.customPassword }}
        run: |
          Write-Host "Setting up RDP account..."
          if ([string]::IsNullOrEmpty($env:RPASS_INPUT)) {
              $upper = "ABCDEFGHJKLMNPQRSTUVWXYZ"
              $lower = "abcdefghijkmnopqrstuvwxyz"
              $digits = "23456789"
              $special = "!@#$%^&*"
              $pass = -join (1..4 | ForEach-Object { $special[(Get-Random -Maximum $special.Length)] })
              $pass += -join (1..4 | ForEach-Object { $upper[(Get-Random -Maximum $upper.Length)] })
              $pass += -join (1..2 | ForEach-Object { $digits[(Get-Random -Maximum $digits.Length)] })
              $pass += -join (1..2 | ForEach-Object { $lower[(Get-Random -Maximum $lower.Length)] })
              $RPASS = -join ($pass.ToCharArray() | Get-Random -Count $pass.Length)
          } else { $RPASS = $env:RPASS_INPUT }
          
          net user $env:RUSER $RPASS /add
          net localgroup "Administrators" $env:RUSER /add
          net localgroup "Remote Desktop Users" $env:RUSER /add
          Set-LocalUser -Name $env:RUSER -PasswordNeverExpires $true

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue

          "RDP_USER=$env:RUSER" >> $env:GITHUB_ENV
          "RDP_PASS=$RPASS" >> $env:GITHUB_ENV

      # ============================================================
      # STEP 2: SET WALLPAPER (FIXED FOR RDP)
      # ============================================================
      - name: Set Wallpaper
        shell: powershell
        run: |
          Write-Host "Setting up wallpaper..."
          $LocalWallpaper = Join-Path $env:GITHUB_WORKSPACE "Wallpaper\wallpaper.png"
          if (-not (Test-Path $LocalWallpaper)) { 
              Write-Host "[WARNING] Wallpaper not found. Skipping."; exit 0 
          }
          
          $DestWallpaper = "C:\Windows\Web\Wallpaper\thyo_bg.png"
          Copy-Item -Path $LocalWallpaper -Destination $DestWallpaper -Force
          
          # Tắt chính sách chặn wallpaper trên RDP
          $tsPolicyPath = "HKCU:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"
          New-Item -Path $tsPolicyPath -Force | Out-Null
          Set-ItemProperty -Path $tsPolicyPath -Name "fNoRemoteDesktopWallpaper" -Value 0 -Type DWord -Force
          
          # Set cho user hiện tại
          $RegPath = "HKCU:\Control Panel\Desktop"
          Set-ItemProperty -Path $RegPath -Name Wallpaper -Value $DestWallpaper
          Set-ItemProperty -Path $RegPath -Name WallpaperStyle -Value "10"
          Set-ItemProperty -Path $RegPath -Name TileWallpaper -Value "0"
          
          # Set cho Default User
          try {
              reg load "HKU\DefaultUser" "C:\Users\Default\NTUSER.DAT" | Out-Null
              $DefaultRegPath = "Registry::HKEY_USERS\DefaultUser\Control Panel\Desktop"
              Set-ItemProperty -Path $DefaultRegPath -Name Wallpaper -Value $DestWallpaper
              Set-ItemProperty -Path $DefaultRegPath -Name WallpaperStyle -Value "10"
              Set-ItemProperty -Path $DefaultRegPath -Name TileWallpaper -Value "0"
              reg unload "HKU\DefaultUser" | Out-Null
          } catch { Write-Host "[WARNING] Could not update default user wallpaper." }
          
          Add-Type -TypeDefinition @"
          using System;
          using System.Runtime.InteropServices;
          public class Wallpaper {
              [DllImport("user32.dll", CharSet = CharSet.Auto)]
              public static extern int SystemParametersInfo(int uAction, int uParam, string lpvParam, int fuWinIni);
          }
          "@
          [Wallpaper]::SystemParametersInfo(20, 0, $DestWallpaper, 0x01 -bor 0x02)
          Write-Host "[SUCCESS] Wallpaper changed!"

      # ============================================================
      # STEP 3: DOWNLOAD AND RUN FRP CLIENT
      # ============================================================
      - name: Setup FRP Client Tunnel
        shell: powershell
        env:
          FRP_SERVER_IP: ${{ secrets.FRP_SERVER_IP }}
          FRP_AUTH_TOKEN: ${{ secrets.FRP_AUTH_TOKEN }}
          FRP_REMOTE_PORT: ${{ secrets.FRP_REMOTE_PORT }}
        run: |
          Write-Host "Downloading FRP Client..."
          $frpZip = "$env:RUNNER_TEMP\frp.zip"
          
          # Tải FRP v0.61.0 (Bản ổn định)
          curl.exe -L --fail --retry 5 --retry-all-errors --retry-delay 2 -o $frpZip "https://github.com/fatedier/frp/releases/download/v0.61.0/frp_0.61.0_windows_amd64.zip"
          
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $frpZip)) {
              throw "Failed to download FRP Client."
          }
          
          Expand-Archive -Path $frpZip -DestinationPath "$env:RUNNER_TEMP\frp" -Force
          $frpcExe = (Get-ChildItem -Path "$env:RUNNER_TEMP\frp" -Filter "frpc.exe" -Recurse | Select-Object -First 1).FullName
          if (-not $frpcExe) { throw "FRP Client executable not found." }
          
          Write-Host "Creating FRP configuration..."
          $configContent = @"
          serverAddr = "$env:FRP_SERVER_IP"
          serverPort = 7000
          auth.method = "token"
          auth.token = "$env:FRP_AUTH_TOKEN"
          loginFailExit = true

          [[proxies]]
          name = "github-rdp"
          type = "tcp"
          localIP = "127.0.0.1"
          localPort = 3389
          remotePort = $env:FRP_REMOTE_PORT
          "@
          $configContent | Out-File -FilePath "$env:RUNNER_TEMP\frp\frpc.toml" -Encoding utf8
          
          Write-Host "Starting FRP Client tunnel..."
          $logFile = "$env:RUNNER_TEMP\frpc.log"
          Start-Process -FilePath $frpcExe -ArgumentList "-c `"$env:RUNNER_TEMP\frp\frpc.toml`"" -RedirectStandardOutput $logFile -RedirectStandardError "$env:RUNNER_TEMP\frpc.err" -WindowStyle Hidden
          
          Write-Host "Waiting for FRP to connect to your VPS..."
          Start-Sleep -Seconds 10
          
          $frpAddress = "$env:FRP_SERVER_IP`:$env:FRP_REMOTE_PORT"
          Write-Host "======================================================="
          Write-Host "FRP PUBLIC ADDRESS: $frpAddress"
          Write-Host "======================================================="
          "FRP_ADDR=$frpAddress" >> $env:GITHUB_ENV

      # ============================================================
      # STEP 4: KEEP-ALIVE PROBE (TCP 1 byte/sec)
      # ============================================================
      - name: Start TCP Probe Background Job
        shell: powershell
        run: |
          Write-Host "Starting TCP probe (1 byte/sec) to keep RDP session alive..."
          $probeJob = Start-Job -ScriptBlock {
              while ($true) {
                  try {
                      $client = New-Object System.Net.Sockets.TcpClient
                      $client.Connect("127.0.0.1", 3389)
                      $stream = $client.GetStream()
                      $stream.Write([byte[]]@(0), 0, 1)
                      $stream.Flush()
                      $client.Close()
                  } catch {}
                  Start-Sleep -Seconds 1
              }
          }
          "PROBE_JOB_ID=$($probeJob.Id)" >> $env:GITHUB_ENV

      # ============================================================
      # STEP 5: PUBLISH CONNECTION DETAILS
      # ============================================================
      - name: Publish Connection Details
        shell: powershell
        run: |
          $summaryFile = $env:GITHUB_STEP_SUMMARY
          
          Add-Content -Path $summaryFile -Value "## ThyoCloud Workspace (FRP VPS RDP)" -Encoding utf8
          Add-Content -Path $summaryFile -Value "" -Encoding utf8
          Add-Content -Path $summaryFile -Value "### Connection Details:" -Encoding utf8
          Add-Content -Path $summaryFile -Value "- **Public Address (IP:Port):** ``$env:FRP_ADDR``" -Encoding utf8
          Add-Content -Path $summaryFile -Value "- **Username:** ``$env:RDP_USER``" -Encoding utf8
          Add-Content -Path $summaryFile -Value "- **Password:** ``$env:RDP_PASS``" -Encoding utf8
          Add-Content -Path $summaryFile -Value "" -Encoding utf8
          Add-Content -Path $summaryFile -Value "### How to connect:" -Encoding utf8
          Add-Content -Path $summaryFile -Value "1. Open **Remote Desktop Connection** (mstsc)." -Encoding utf8
          Add-Content -Path $summaryFile -Value "2. In the 'Computer' field, enter the **Public Address** above." -Encoding utf8
          Add-Content -Path $summaryFile -Value "3. Enter the Username and Password above when prompted." -Encoding utf8
          Add-Content -Path $summaryFile -Value "" -Encoding utf8
          Add-Content -Path $summaryFile -Value "> **Note:** Requires your VPS (FRP Server) to be running and Ports 7000, $env:FRP_REMOTE_PORT to be open." -Encoding utf8

      # ============================================================
      # STEP 6: KEEP SESSION ALIVE
      # ============================================================
      - name: Keep session alive
        shell: powershell
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] Session Active - Waiting for connection via FRP..."
              Start-Sleep -Seconds 300
          }
