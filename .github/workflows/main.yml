
name: Layer7 Cloud PC

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: layer7-cloud-pc
  cancel-in-progress: false

jobs:
  cloud-pc:
    name: Build Layer7 Cloud PC
    runs-on: windows-2025
    timeout-minutes: 360

    steps:
      # 1. Lấy mã nguồn
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Kiểm tra môi trường Windows
      - name: Build Windows Environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "       LAYER7 CLOUD PC BUILD"
          Write-Host "========================================"

          Write-Host "Computer: $env:COMPUTERNAME"
          Write-Host "User: $env:USERNAME"

          Get-ComputerInfo |
            Select-Object WindowsProductName, WindowsVersion, OsArchitecture |
            Format-List

          if (-not (Test-Path "$env:GITHUB_WORKSPACE\scripts")) {
              throw "Không tìm thấy thư mục scripts."
          }

      # 3. Tạo tài khoản Layer7
      - name: Create Layer7 User
        shell: pwsh
        env:
          LAYER7_PASSWORD: ${{ secrets.LAYER7_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:LAYER7_PASSWORD)) {
              throw "Thiếu GitHub Secret LAYER7_PASSWORD."
          }

          $Password = ConvertTo-SecureString `
            $env:LAYER7_PASSWORD -AsPlainText -Force

          $User = Get-LocalUser -Name "Layer7" -ErrorAction SilentlyContinue

          if (-not $User) {
              New-LocalUser `
                -Name "Layer7" `
                -Password $Password `
                -Description "Layer7 Cloud PC User" `
                -PasswordNeverExpires | Out-Null
          }
          else {
              Set-LocalUser -Name "Layer7" -Password $Password
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "Layer7" `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "Layer7" `
            -ErrorAction SilentlyContinue

          Write-Host "Layer7 account ready."

      # 4. Khởi tạo profile Windows cho Layer7
      - name: Initialize Layer7 Profile
        shell: pwsh
        env:
          LAYER7_PASSWORD: ${{ secrets.LAYER7_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          $Account = New-Object System.Security.Principal.NTAccount(
              "$env:COMPUTERNAME\Layer7"
          )

          $Sid = $Account.Translate(
              [System.Security.Principal.SecurityIdentifier]
          ).Value

          $Profile = Get-CimInstance Win32_UserProfile |
              Where-Object { $_.SID -eq $Sid }

          if (-not $Profile) {
              $Password = ConvertTo-SecureString `
                $env:LAYER7_PASSWORD -AsPlainText -Force

              $Credential = New-Object System.Management.Automation.PSCredential(
                  "$env:COMPUTERNAME\Layer7",
                  $Password
              )

              $Process = Start-Process `
                -FilePath "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" `
                -Credential $Credential `
                -LoadUserProfile `
                -ArgumentList "-NoProfile -Command `"Write-Output 'Layer7 profile initialized'`"" `
                -Wait `
                -PassThru

              if ($Process.ExitCode -ne 0) {
                  throw "Không thể khởi tạo profile Layer7."
              }
          }

          $Profile = Get-CimInstance Win32_UserProfile |
              Where-Object { $_.SID -eq $Sid }

          if (-not $Profile -or -not (Test-Path "$($Profile.LocalPath)\NTUSER.DAT")) {
              throw "Windows chưa tạo thành công profile Layer7."
          }

          Write-Host "Layer7 SID: $Sid"
          Write-Host "Profile: $($Profile.LocalPath)"
      - name: Verify
        shell: powershell
        run: |
          whoami
          $env:USERNAME

      # 5. Bật Remote Desktop
      - name: Configure Remote Desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          Write-Host "Remote Desktop configured."

      # 6. Cài đặt RustDesk
      
      - name: Install RustDesk & Get ID
        shell: powershell
        env:
          RDP_PASS: ${{ secrets.RUSTDESK_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "       LAYER7 RUSTDESK INSTALL"
          Write-Host "========================================"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASS)) {
              throw "Missing GitHub Secret RUSTDESK_PASSWORD."
          }

          # Download MSI
          Write-Host "Downloading RustDesk..."

          $msiPath = "$env:RUNNER_TEMP\rustdesk.msi"

          curl.exe -L --fail `
            -o $msiPath `
            "https://github.com/rustdesk/rustdesk/releases/download/1.2.6/rustdesk-1.2.6-x86_64.msi"

          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $msiPath)) {
              throw "RustDesk MSI download failed."
          }

          # Install MSI
          Write-Host "Installing RustDesk..."

          $install = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList "/i `"$msiPath`" /qn /norestart" `
            -Wait `
            -PassThru

          if ($install.ExitCode -notin @(0, 3010)) {
              throw "RustDesk installation failed. Exit code: $($install.ExitCode)"
          }

          Start-Sleep -Seconds 15

          # Locate executable
          $rustdeskExe = "C:\Program Files\RustDesk\rustdesk.exe"

          if (-not (Test-Path $rustdeskExe)) {
              $rustdeskExe = "${env:ProgramFiles(x86)}\RustDesk\rustdesk.exe"
          }

          if (-not (Test-Path $rustdeskExe)) {
              throw "Cannot find RustDesk executable."
          }

          # Install service
          Write-Host "Installing RustDesk service..."

          & $rustdeskExe --install-service

          Start-Sleep -Seconds 10

          $service = Get-Service -Name "RustDesk" -ErrorAction SilentlyContinue

          if ($service) {
              if ($service.Status -ne "Running") {
                  Start-Service -Name "RustDesk"
              }
          }
          else {
              Write-Warning "RustDesk service was not detected."
          }

          # Apply password
          Write-Host "Applying RustDesk password..."

          & $rustdeskExe --password $env:RDP_PASS

          if ($LASTEXITCODE -ne 0) {
              throw "Could not apply RustDesk password."
          }

          Start-Sleep -Seconds 5

          # Retrieve ID
          Write-Host "Retrieving RustDesk ID..."

          $rustdeskId = $null
          $attempts = 0

          while (-not $rustdeskId -and $attempts -lt 10) {
              $idOutput = & $rustdeskExe --get-id 2>&1 | Out-String

              if ($idOutput -match '(\d{9,10})') {
                  $rustdeskId = $matches[1]
                  break
              }

              Write-Host "Retrying ID..."
              Start-Sleep -Seconds 5
              $attempts++
          }

          if ($rustdeskId) {
              "RUSTDESK_ID=$rustdeskId" | Out-File `
                -FilePath $env:GITHUB_ENV `
                -Append `
                -Encoding utf8

              Write-Host "RustDesk ID: $rustdeskId"
          }
          else {
              Write-Warning "Could not get RustDesk ID. Check network connectivity."
          }

          Write-Host "RustDesk installation step completed."


      # 7. Đặt wallpaper cho profile Layer7
      - name: Setup Layer7 Wallpaper
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $WallpaperScript = Join-Path `
            $env:GITHUB_WORKSPACE "scripts\set-wallpaper.ps1"

          if (-not (Test-Path $WallpaperScript)) {
              throw "Không tìm thấy scripts/set-wallpaper.ps1."
          }

          & $WallpaperScript

      # 8. Kiểm tra RustDesk và xuất thông tin kết nối
      - name: Verify Connection
        shell: pwsh
        env:
          RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          $Service = Get-Service -Name "RustDesk" -ErrorAction Stop

          if ($Service.Status -ne "Running") {
              Start-Service -Name "RustDesk"
          }

          if ([string]::IsNullOrWhiteSpace($env:RUSTDESK_ID)) {
              throw "RustDesk ID không tồn tại."
          }

          Write-Host "========================================"
          Write-Host "       LAYER7 CONNECTION INFORMATION"
          Write-Host "========================================"
          Write-Host "RustDesk ID: $env:RUSTDESK_ID"
          Write-Host "Password: Stored in GitHub Secret RUSTDESK_PASSWORD"
          Write-Host "Service: Running"

          @"
          ## Layer7 Cloud PC

          - Windows: Windows Server 2025 runner
          - RustDesk ID: $env:RUSTDESK_ID
          - RustDesk Service: Running
          - Password: GitHub Secret `RUSTDESK_PASSWORD`
          - Keep-alive target: 6 hours
          "@ | Out-File `
            -FilePath $env:GITHUB_STEP_SUMMARY `
            -Append -Encoding utf8

      # 9. Duy trì máy trong thời gian còn lại
      - name: Keep Layer7 Cloud PC Alive
        shell: pwsh
        timeout-minutes: 350
        run: |
          $ErrorActionPreference = "Continue"

          $RustDeskPath = "$env:ProgramFiles\RustDesk\rustdesk.exe"

          if (-not (Test-Path $RustDeskPath)) {
              $RustDeskPath = "${env:ProgramFiles(x86)}\RustDesk\rustdesk.exe"
          }

          $EndTime = (Get-Date).AddMinutes(350)

          Write-Host "========================================"
          Write-Host "       LAYER7 KEEP ALIVE"
          Write-Host "       Target: 350 minutes"
          Write-Host "========================================"

          while ((Get-Date) -lt $EndTime) {
              try {
                  $Service = Get-Service `
                    -Name "RustDesk" `
                    -ErrorAction SilentlyContinue

                  if ($Service) {
                      $Service.Refresh()

                      if ($Service.Status -ne "Running") {
                          Write-Warning "RustDesk stopped. Restarting..."
                          Start-Service -Name "RustDesk"
                      }
                  }
                  else {
                      Write-Warning "RustDesk service not found."
                  }

                  $Remaining = [math]::Max(
                      0,
                      [int](($EndTime - (Get-Date)).TotalMinutes)
                  )

                  Write-Host "========================================"
                  Write-Host "Time: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"
                  Write-Host "RustDesk ID: $env:RUSTDESK_ID"
                  Write-Host "Remaining: $Remaining minutes"
                  Write-Host "========================================"
              }
              catch {
                  Write-Warning $_.Exception.Message
              }

              Start-Sleep -Seconds 30
          }

          Write-Host "Layer7 keep-alive period completed."

      # 10. Hoàn tất
      - name: Workflow Completed
        if: always()
        shell: pwsh
        run: |
          Write-Host "Layer7 Cloud PC workflow finished."
          Write-Host "Job status: ${{ job.status }}"
