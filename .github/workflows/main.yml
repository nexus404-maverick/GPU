name: RdpFree — RDP + Mesa3D GPU Ảo
run-name: Phiên RDP — ${{ inputs.runner }}

on:
  workflow_dispatch:
    inputs:
      durasi_menit:
        description: 'Thời gian phiên (phút, 10–360)'
        required: false
        default: '360'
        type: string
      hostname:
        description: 'Tên máy'
        required: false
        default: 'rdpfree'
        type: string
      rdp_user:
        description: 'Tên tài khoản RDP (3–20 ký tự)'
        required: false
        default: 'xyadmin'
        type: string
      rdp_port:
        description: 'Cổng RDP (mặc định 3389)'
        required: false
        default: '3389'
        type: string
      runner:
        description: 'Hệ điều hành'
        required: false
        default: 'windows-2022'
        type: choice
        options:
          - windows-2022
          - windows-2025
          - windows-latest
      perpanjang_otomatis:
        description: 'Tự động gia hạn phiên'
        required: false
        default: 'ya'
        type: choice
        options:
          - ya
          - tidak

permissions:
  contents: write
  actions: write

concurrency:
  group: rdpfree-active
  cancel-in-progress: false

jobs:
  rdp:
    name: SERVER RDP ĐANG KHỞI ĐỘNG...
    runs-on: ${{ inputs.runner || 'windows-2022' }}
    timeout-minutes: ${{ inputs.durasi_menit || '360' }}
    env:
      DUR: ${{ inputs.durasi_menit || '360' }}
      HOSTNAME: ${{ inputs.hostname || 'rdpfree' }}
      RDP_USER: ${{ inputs.rdp_user || 'xyadmin' }}
      RDP_PORT: ${{ inputs.rdp_port || '3389' }}
      RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # ==================================================
      # Bước 1: Bật RDP + Tạo tài khoản
      # ==================================================
      - name: 🔧 Bật Dịch vụ RDP & Tạo tài khoản
        shell: pwsh
        run: |
          # Bật RDP
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 1 -Force
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'

          # Đổi cổng nếu cần
          $port = [int]$env:RDP_PORT
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'PortNumber' -Value $port -Force

          # Tạo tài khoản
          $user = $env:RDP_USER
          $pass = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          New-LocalUser -Name $user -Password $pass -FullName $user -AccountNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group 'Administrators' -Member $user -ErrorAction SilentlyContinue

          Write-Host "✅ RDP đã sẵn sàng | Cổng: $port | Tài khoản: $user"

      # ==================================================
      # Bước 2: Cài Mesa3D — GPU Ảo cho Game 3D / Minecraft
      # ==================================================
      - name: 🎮 Cài Mesa3D GPU Ảo (OpenGL 4.6 / D3D12)
        shell: pwsh
        run: |
          Write-Host "Đang tải & cài Mesa3D GPU ảo..."
          $mesaDir = 'C:\Mesa3D'
          New-Item -ItemType Directory -Path $mesaDir -Force | Out-Null

          # Tải 7-Zip Portable để giải nén
          Write-Host "→ Tải công cụ giải nén..."
          Invoke-WebRequest -Uri 'https://www.7-zip.org/a/7z2408-extra.7z' -OutFile "$mesaDir\7z.7z" -UseBasicParsing
          Invoke-WebRequest -Uri 'https://www.7-zip.org/a/7z2408-x64.msi' -OutFile "$mesaDir\7z.msi" -UseBasicParsing
          Start-Process msiexec -ArgumentList "/i $mesaDir\7z.msi /qn /norestart" -Wait
          $7z = 'C:\Program Files\7-Zip\7z.exe'

          # Tải Mesa3D phiên bản mới nhất
          Write-Host "→ Tải Mesa3D..."
          Invoke-WebRequest -Uri 'https://github.com/pal1000/mesa-dist-win/releases/download/24.3.0/mesa3d-24.3.0-release-msvc.7z' -OutFile "$mesaDir\mesa3d.7z" -UseBasicParsing

          # Giải nén
          Write-Host "→ Giải nén..."
          & $7z x "$mesaDir\mesa3d.7z" -o"$mesaDir\" -y | Out-Null

          # Thiết lập biến môi trường — kích hoạt GPU ảo
          Write-Host "→ Cấu hình biến môi trường..."
          [Environment]::SetEnvironmentVariable('OPENGL_DRIVERS_PATH', "$mesaDir\x64", 'Machine')
          [Environment]::SetEnvironmentVariable('LIBGL_ALWAYS_SOFTWARE', '1', 'Machine')
          [Environment]::SetEnvironmentVariable('GALLIUM_DRIVERS_DIR', "$mesaDir\x64", 'Machine')
          [Environment]::SetEnvironmentVariable('MESA_LOADER_DRIVER_OVERRIDE', 'zink', 'Machine')

          Write-Host "✅ Mesa3D đã cài đặt thành công!"
          Write-Host "   ✔ OpenGL 4.6 | ✔ Hỗ trợ Minecraft & Game 3D"

      # ==================================================
      # Bước 3: Cài ứng dụng cơ bản
      # ==================================================
      - name: 📦 Cài ứng dụng cơ bản (Chrome, 7-Zip)
        shell: pwsh
        run: |
          Write-Host "Đang cài ứng dụng cơ bản..."
          winget install --id Google.Chrome --silent --accept-package-agreements --accept-source-agreements --disable-interactivity --force
          winget install --id 7zip.7zip --silent --accept-package-agreements --accept-source-agreements --disable-interactivity --force
          Write-Host "✅ Đã cài xong ứng dụng"

      # ==================================================
      # Bước 4: Thông tin đăng nhập — Hiển thị ở Log
      # ==================================================
      - name: 🟢 THÔNG TIN ĐĂNG NHẬP RDP
        shell: pwsh
        run: |
          $ip = [System.Net.Dns]::GetHostEntry([string]$env:COMPUTERNAME).AddressList | Where-Object { $_.AddressFamily -eq 'InterNetwork' } | Select-Object -First 1 -ExpandProperty IPAddressToString
          $hostName = $env:COMPUTERNAME
          $port = $env:RDP_PORT
          $user = $env:RDP_USER
          $pass = $env:RDP_PASSWORD

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "          ✅ SERVER RDP ĐÃ SẴN SÀNG!"
          Write-Host "============================================================"
          Write-Host " 🏠 Tên máy/IP   : $hostName ($ip)"
          Write-Host " 🌐 Cổng         : $port"
          Write-Host " 👤 Tài khoản    : $user"
          Write-Host " 🔑 Mật khẩu     : $pass"
          Write-Host "============================================================"
          Write-Host " 🖥️ Mở Remote Desktop Connection → nhập: $hostName`:$port"
          Write-Host "============================================================"
          Write-Host " 🎮 GPU Ảo: Mesa3D OpenGL 4.6 ĐÃ KÍCH HOẠT"
          Write-Host " ✅ Sẵn sàng chạy Minecraft & các tựa game 3D"
          Write-Host "============================================================"
          Write-Host ""

      # ==================================================
      # Bước 5: Giữ phiên hoạt động
      # ==================================================
      - name: ⏳ Đang hoạt động — Nhấn 'Cancel' để tắt máy
        shell: pwsh
        run: |
          Write-Host "🔄 Phiên đang hoạt động... Đóng workflow sẽ tắt máy."
          $durationMinutes = [int]$env:DUR
          $endTime = (Get-Date).AddMinutes($durationMinutes)
          while ((Get-Date) -lt $endTime) {
            Write-Host "💓 Hoạt động — $(Get-Date -Format 'HH:mm:ss') — Còn $([math]::Round(($endTime - (Get-Date)).TotalMinutes, 1)) phút"
            Start-Sleep -Seconds 60
          }
          Write-Host "⏰ Đã hết thời gian phiên!"

      # ==================================================
      # Bước 6: Tự động gia hạn
      # ==================================================
      - name: 🔄 Tự động tạo phiên tiếp theo
        if: ${{ success() && (inputs.perpanjang_otomatis || 'ya') == 'ya' }}
        shell: pwsh
        continue-on-error: true
        run: |
          $hdr = @{
            Authorization          = "Bearer $($env:GITHUB_TOKEN)"
            Accept                 = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $body = @{
            ref    = 'main'
            inputs = @{
              durasi_menit        = "$($env:DUR)"
              hostname            = "$($env:HOSTNAME)"
              rdp_user            = "$($env:RDP_USER)"
              rdp_port            = "$($env:RDP_PORT)"
              runner              = "${{ inputs.runner || 'windows-2022' }}"
              perpanjang_otomatis = 'ya'
            }
          } | ConvertTo-Json -Depth 5
          try {
            Start-Sleep -Seconds (Get-Random -Minimum 15 -Maximum 26)
            Invoke-RestMethod -Uri "https://api.github.com/repos/$($env:GITHUB_REPOSITORY)/actions/workflows/main.yml/dispatches" `
              -Headers $hdr -Method Post -ContentType 'application/json' -Body $body -TimeoutSec 20 | Out-Null
            Write-Host '✅ Phiên tiếp theo đã được lên lịch tự động'
          } catch {
            Write-Host "⚠️ Tự động gia hạn bị bỏ qua: $($_.Exception.Message)"
          }
          
