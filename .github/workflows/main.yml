name: RustDesk - khong can dang ky

on:
  workflow_dispatch:

jobs:
  rustdesk:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Cai RustDesk va lay ID/pass
        shell: pwsh
        run: |
          $v = "C:\Program Files\RustDesk\rustdesk.exe"
          if (-not (Test-Path $v)) {
            $f = "$env:TEMP\rustdesk-1.3.9-x86_64.exe"
            Invoke-WebRequest "https://github.com/rustdesk/rustdesk/releases/download/1.3.9/rustdesk-1.3.9-x86_64.exe" -OutFile $f -UseBasicParsing
            Start-Process $f -ArgumentList "--silent-install" -Wait
            Start-Sleep 10
          }
          if (-not (Test-Path $v)) { throw "Cai dat that bai" }

          $pass = "Test1234"
          & $v --password $pass | Out-Null
          Start-Sleep 3

          $id = $null
          for ($i = 0; $i -lt 10 -and -not $id; $i++) {
            $out = & $v --get-id 2>$null
            if ($out -match '(\d{9,10})') { $id = $matches[1]; break }
            Start-Sleep 5
          }
          if (-not $id) { throw "Khong lay duoc ID" }

          "RDPASS=$pass" >> $env:GITHUB_ENV
          "RDID=$id"     >> $env:GITHUB_ENV
          Start-Process $v

      - name: Hien thi thong tin
        shell: pwsh
        run: |
          Add-Content $env:GITHUB_STEP_SUMMARY "## RustDesk"
          Add-Content $env:GITHUB_STEP_SUMMARY "- ID: ``$env:RDID``"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Password: ``$env:RDPASS``"

      - name: Giu job song
        shell: pwsh
        run: while ($true) { Start-Sleep 120 }
