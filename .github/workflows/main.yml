name: GPU Cloud PC (RDP + Ngrok Secrets)

on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Số giờ thuê (1-5)'
        required: true
        default: '3'
        type: string

permissions:
  actions: write
  contents: read

jobs:
  deploy-instance:
    runs-on: windows-2025
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Generate Password
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $chars = 'abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'
          $password = -join (1..12 | ForEach-Object { $chars[(Get-Random -Maximum $chars.Length)] })
          "GENERATED_PASSWORD=$password" >> $env:GITHUB_ENV
          Write-Host "✅ Generated password for RDP user."

      - name: Setup Windows Account & Enable RDP
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          
          # Tắt chính sách yêu cầu mật khẩu phức tạp của Windows Server
          $seceditFile = "$env:TEMP\secpol.inf"
          $seceditContent = @(
              "[Unicode]", "Unicode=yes", "[System Access]",
              "PasswordComplexity = 0", "MinimumPasswordLength = 0"
          )
          Set-Content -Path $seceditFile -Value $seceditContent -Encoding Unicode
          $null = secedit /configure /db "$env:TEMP\secpol.sdb" /cfg $seceditFile /areas SECURITYPOLICY 2>&1
          Remove-Item $seceditFile -Force -ErrorAction SilentlyContinue

          # Tạo tài khoản Windows (GPUUser)
          $secure = ConvertTo-SecureString "$env:GENERATED_PASSWORD" -AsPlainText -Force
          $user = Get-LocalUser -Name "GPUUser" -ErrorAction SilentlyContinue
          if ($null -eq $user) {
              New-LocalUser -Name "GPUUser" -Password $secure -PasswordNeverExpires -AccountNeverExpires -FullName 'GPU User'
          } else {
              Set-LocalUser -Name "GPUUser" -Password $secure
          }
          Add-LocalGroupMember -Group 'Administrators' -Member "GPUUser"
          Add-LocalGroupMember -Group 'Remote Desktop Users' -Member "GPUUser"

          # Bật tính năng Remote Desktop (RDP)
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          
          Write-Host "✅ RDP Enabled and Account Configured."

      - name: Install Mesa3D (Software GPU)
        shell: powershell
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Downloading Mesa3D..."
          $mesaDir = "C:\Mesa3D"
          $archive = "$env:TEMP\mesa.7z"
          New-Item -ItemType Directory -Path $mesaDir -Force | Out-Null
          
          Invoke-WebRequest -Uri 'https://github.com/pal1000/mesa-dist-win/releases/download/24.3.4/mesa3d-24.3.4-release-msvc.7z' -OutFile $archive -UseBasicParsing -TimeoutSec 300
          
          $sevenZip = "$env:TEMP\7zr.exe"
          if (-not (Test-Path $sevenZip)) {
              Invoke-WebRequest -Uri 'https://www.7-zip.org/a/7zr.exe' -OutFile $sevenZip -UseBasicParsing
          }
          
          Write-Host "Extracting Mesa3D..."
          $process = Start-Process -FilePath $sevenZip -ArgumentList "x `"$archive`" `"-o$mesaDir`" -y" -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) { throw "Failed to extract Mesa3D." }
          
          [System.Environment]::SetEnvironmentVariable("GALLIUM_DRIVER", "llvmpipe", "Machine")
          [System.Environment]::SetEnvironmentVariable("LIBGL_ALWAYS_SOFTWARE", "1", "Machine")
          [System.Environment]::SetEnvironmentVariable("MESA_GL_VERSION_OVERRIDE", "4.6", "Machine")
          [System.Environment]::SetEnvironmentVariable("MESA_GLSL_VERSION_OVERRIDE", "460", "Machine")
          Write-Host "✅ Mesa3D installed."

      - name: Setup Ngrok & Expose RDP Port (3389)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Downloading Ngrok..."
          $ngrokZip = "$env:TEMP\ngrok.zip"
          Invoke-WebRequest -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile $ngrokZip -UseBasicParsing
          Expand-Archive -Path $ngrokZip -DestinationPath "C:\Ngrok" -Force
          
          $ngrokExe = "C:\Ngrok\ngrok.exe"
          # Lấy token trực tiếp từ GitHub Secrets đã lưu
          & $ngrokExe config add-authtoken "${{ secrets.NGROK_AUTHTOKEN }}"
          
          # Chạy ngrok ngầm forward cổng TCP 3389
          Start-Process -FilePath $ngrokExe -ArgumentList "tcp 3389" -WindowStyle Hidden
          Start-Sleep -Seconds 5

          # Lấy địa chỉ Host và Port từ API của ngrok
          try {
              $response = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels" -TimeoutSec 10
              $tunnel = $response.tunnels | Where-Object { $_.proto -eq 'tcp' } | Select-Object -First 1
              if ($tunnel) {
                  $publicUrl = $tunnel.public_url -replace "tcp://", ""
                  "RDP_HOST_PORT=$publicUrl" >> $env:GITHUB_ENV
                  Write-Host "✅ Ngrok Tunnel Established: $publicUrl"
              } else {
                  throw "Could not find active TCP tunnel in Ngrok API response."
              }
          } catch {
              throw "Failed to retrieve Ngrok address: $_"
          }

      - name: Publish Connection Information
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $summary = @(
            '## GPU Cloud PC (Microsoft RDP + Ngrok)',
            "- **Address (IP:Port):** `$env:RDP_HOST_PORT",
            "- **Username:** `GPUUser`",
            "- **Password:** `$env:GENERATED_PASSWORD`",
            "",
            "**Hướng dẫn kết nối:**",
            "1. Nhấn tổ hợp phím `Windows + R`, gõ `mstsc` rồi nhấn Enter.",
            "2. Nhập địa chỉ: **`$env:RDP_HOST_PORT`** vào ô Computer.",
            "3. Nhấn Connect, điền tài khoản `GPUUser` và mật khẩu ở trên."
          )
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Keep session alive
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $hours = 3
          try { $hours = [int]'${{ github.event.inputs.hours }}' } catch {}
          if ($hours -lt 1) { $hours = 1 }
          if ($hours -gt 5) { $hours = 5 }
          
          $end = (Get-Date).AddHours($hours)
          Write-Host "Session ends at: $end"
          
          while ((Get-Date) -lt $end) {
              $remain = $end - (Get-Date)
              Write-Host "Remaining: $($remain.ToString('hh\:mm\:ss'))"
              Start-Sleep -Seconds 60
          }

      - name: Cleanup
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          Remove-Item -Path "$env:TEMP\*" -Recurse -Force -ErrorAction SilentlyContinue
