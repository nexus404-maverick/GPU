name: ThyoCloud Personal Workspace (Fast)

on:
  workflow_dispatch:
    inputs:
      customUsername:
        description: 'Username Akses (Opsional - Default: Admin)'
        required: false
        default: 'Admin'

jobs:
  deploy-workspace:
    # ÉP BUỘC CHẠY TRÊN WINDOWS 2022 THEO YÊU CẦU
    runs-on: windows-2022 
    timeout-minutes: 360

    steps:
      - name: Checkout Repository (Lấy file cấu trúc/hình nền)
        uses: actions/checkout@v4

      - name: Menghubungkan ke ThyoCloud Service
        id: thyo_api
        env:
          USER: ${{ github.event.inputs.customUsername || 'Admin' }}
          REPO: ${{ github.event.repository.name }}
          # Cố định OS type để API biết cấp máy 2022
          OS_TYPE: 'windows-2022' 
          TIMEOUT_MIN: '360'
        shell: powershell
        run: |
          Write-Host "Environment Terpilih: $env:OS_TYPE (Batas Timer: $env:TIMEOUT_MIN Menit)"
          Write-Host "Verifikasi Akses Fast Mode ke ThyoCloud..."
          
          $webUrl = "https://thyo.cloud/api/get-core"
          
          $body = @{
            username       = $env:USER
            repo           = $env:REPO
            os             = $env:OS_TYPE
            timeoutMinutes = [int]$env:TIMEOUT_MIN
          } | ConvertTo-Json
          
          $req = $null
          try {
            $req = Invoke-RestMethod -Uri $webUrl -Method Post -Body $body -ContentType "application/json"
          } catch {
            Write-Host "[ERROR JARINGAN] Gagal menghubungi API: $($_.Exception.Message)"
            exit 1
          }
          
          if ($req.success -eq $true) {
            Write-Host "[OK] Akses Diterima! Menyiapkan Workspace..."
            
            # --- BÓC TÁCH THÔNG TIN TỪ API ---
            # LƯU Ý: Sửa lại tên key ($req.ip, $req.username...) nếu API thực tế trả về tên khác
            $targetIp = $req.ip
            $targetUser = $req.username
            $targetPass = $req.password
            
            if (-not $targetIp -or -not $targetUser -or -not $targetPass) {
                Write-Host "[ERROR] API không trả về đủ thông tin (IP, User, Pass)."
                exit 1
            }

            Write-Host "Target IP: $targetIp"
            Write-Host "Target User: $targetUser"
            
            # Lưu vào GITHUB_ENV để các bước sau sử dụng
            "TARGET_IP=$targetIp" >> $env:GITHUB_ENV
            "TARGET_USER=$targetUser" >> $env:GITHUB_ENV
            "TARGET_PASS=$targetPass" >> $env:GITHUB_ENV
            
            # Thực thi script core nếu API có trả về
            if ($req.script) {
                Invoke-Expression $req.script
            }
            
          } else {
            Write-Host "[GAGAL] $($req.message)"
            exit 1
          }

      # ============================================================
      # BƯỚC 2: ĐĂNG NHẬP TỰ ĐỘNG VÀ ĐỔI HÌNH NỀN
      # ============================================================
      - name: Login to Remote & Change Wallpaper
        shell: powershell
        env:
          IP: ${{ env.TARGET_IP }}
          RUSER: ${{ env.TARGET_USER }}
          RPASS: ${{ env.TARGET_PASS }}
        run: |
          Write-Host "Đang kết nối tới $env:IP để đổi hình nền..."
          
          # 1. Tạo SecureString cho mật khẩu
          $SecurePassword = ConvertTo-SecureString $env:RPASS -AsPlainText -Force
          $Credential = New-Object System.Management.Automation.PSCredential ($env:RUSER, $SecurePassword)
          
          # 2. ĐƯỜNG DẪN FILE HÌNH NỀN (Trỏ đúng vào thư mục Wallpaper trong repo)
          $LocalWallpaper = Join-Path $env:GITHUB_WORKSPACE "Wallpaper\wallpaper.png"
          
          if (-not (Test-Path $LocalWallpaper)) {
              Write-Host "[WARNING] Không tìm thấy file Wallpaper/wallpaper.png trong repo. Bỏ qua bước đổi hình nền."
              exit 0
          }

          # 3. Kết nối Remote PowerShell tới máy ảo đích
          try {
              Write-Host "Đang thiết lập kết nối Remote PowerShell..."
              # Bỏ qua xác thực chứng chỉ (dành cho máy ảo dùng cert tự ký)
              $session = New-PSSession -ComputerName $env:IP -Credential $Credential -Authentication Basic -UseSSL -SessionOption (New-PSSessionOption -SkipCACheck -SkipCNCheck -SkipRevocationCheck) -ErrorAction Stop
              
              # 4. Tạo thư mục và copy file hình nền sang máy ảo
              Write-Host "Đang copy hình nền sang máy ảo..."
              $RemoteWallpaper = "C:\Windows\Web\Wallpaper\thyo_bg.png"
              
              # Đảm bảo thư mục đích tồn tại trên máy ảo
              Invoke-Command -Session $session -ScriptBlock { 
                  New-Item -ItemType Directory -Path "C:\Windows\Web\Wallpaper" -Force | Out-Null 
              }
              
              Copy-Item -Path $LocalWallpaper -Destination $RemoteWallpaper -ToSession $session -Force
              
              # 5. Thay đổi Registry trên máy ảo để set wallpaper
              Write-Host "Đang thay đổi hình nền..."
              Invoke-Command -Session $session -ScriptBlock {
                  $WallpaperPath = "C:\Windows\Web\Wallpaper\thyo_bg.png"
                  $RegPath = "HKCU:\Control Panel\Desktop"
                  
                  # Thiết lập registry cho hình nền
                  Set-ItemProperty -Path $RegPath -Name Wallpaper -Value $WallpaperPath
                  Set-ItemProperty -Path $RegPath -Name WallpaperStyle -Value "10" # 10 = Fill (Lấp đầy màn hình)
                  Set-ItemProperty -Path $RegPath -Name TileWallpaper -Value "0"
                  
                  # Sử dụng API Windows để refresh hình nền ngay lập tức
                  Add-Type -TypeDefinition @"
                  using System;
                  using System.Runtime.InteropServices;
                  public class Wallpaper {
                      [DllImport("user32.dll", CharSet = CharSet.Auto)]
                      public static extern int SystemParametersInfo(int uAction, int uParam, string lpvParam, int fuWinIni);
                  }
                  "@
                  [Wallpaper]::SystemParametersInfo(20, 0, $WallpaperPath, 0x01 -bor 0x02)
              }
              
              Write-Host "[SUCCESS] Đã đổi hình nền thành công!"
              
              # Đóng session
              Remove-PSSession -Session $session
              
          } catch {
              Write-Host "[ERROR] Không thể kết nối hoặc đổi hình nền: $($_.Exception.Message)"
              # Không exit 1 để workflow vẫn chạy tiếp (giữ session)
          }

      # ============================================================
      # BƯỚC 3: GIỮ SESSION
      # ============================================================
      - name: Keep session alive
        shell: powershell
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] Session Active..."
              Start-Sleep -Seconds 300
          }
