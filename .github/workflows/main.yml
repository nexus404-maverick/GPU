name: RustDesk Auto Install & Connect

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================================
      # BƯỚC 1: CÀI ĐẶT RUSTDESK
      # ============================================================
      - name: Install RustDesk
        shell: powershell
        run: |
          $VERSION = "1.3.9"
          $INSTALLER = "rustdesk-$VERSION-x86_64.exe"
          $URL = "https://github.com/rustdesk/rustdesk/releases/download/$VERSION/$INSTALLER"
          $INSTALL_DIR = "C:\Program Files\RustDesk"
          $RUSTDESK_EXE = "$INSTALL_DIR\rustdesk.exe"

          if (-not (Test-Path $RUSTDESK_EXE)) {
              Write-Host "Downloading RustDesk..."
              $tempFile = "$env:TEMP\$INSTALLER"
              Invoke-WebRequest -Uri $URL -OutFile $tempFile -UseBasicParsing

              Write-Host "Installing RustDesk..."
              Start-Process -FilePath $tempFile -ArgumentList "--silent-install" -Wait
              Start-Sleep -Seconds 10
          } else {
              Write-Host "RustDesk already installed."
          }

          if (-not (Test-Path $RUSTDESK_EXE)) { throw "Installation failed." }
          
          Write-Host "Starting RustDesk..."
          Start-Service -Name "RustDesk" -ErrorAction SilentlyContinue
          Start-Process -FilePath $RUSTDESK_EXE -WindowStyle Hidden

      # ============================================================
      # BƯỚC 2: TẠO MẬT KHẨU VÀ LẤY ID
      # ============================================================
      - name: Configure & Get ID
        shell: powershell
        run: |
          $RUSTDESK_EXE = "C:\Program Files\RustDesk\rustdesk.exe"
          
          # Tạo mật khẩu ngẫu nhiên
          $chars = "abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789"
          $RDPASS = -join (1..12 | ForEach-Object { $chars[(Get-Random -Maximum $chars.Length)] })

          Write-Host "Applying password..."
          & $RUSTDESK_EXE --password $RDPASS
          Start-Sleep -Seconds 3

          # Lấy ID
          Write-Host "Retrieving ID..."
          $RDID = $null
          $attempts = 0
          while (-not $RDID -and $attempts -lt 10) {
              $idOutput = & $RUSTDESK_EXE --get-id 2>$null
              if ($idOutput -match '(\d{9,10})') {
                  $RDID = $matches[1]
                  break
              }
              Write-Host "Retrying in 5s..."
              Start-Sleep -Seconds 5
              $attempts++
          }

          if (-not $RDID) { throw "Could not get ID." }

          # Lưu vào biến môi trường
          "RDPASS=$RDPASS" >> $env:GITHUB_ENV
          "RDID=$RDID" >> $env:GITHUB_ENV
          
          # Ghi thông tin ra file (Dùng Add-Content thay vì Here-String)
          $infoFile = "$env:USERPROFILE\Desktop\RustDesk_Info.txt"
          Add-Content -Path $infoFile -Value "RustDesk - Connection Info" -Encoding utf8
          Add-Content -Path $infoFile -Value "==========================" -Encoding utf8
          Add-Content -Path $infoFile -Value ("Time    : " + (Get-Date)) -Encoding utf8
          Add-Content -Path $infoFile -Value ("ID      : " + $RDID) -Encoding utf8
          Add-Content -Path $infoFile -Value ("Password: " + $RDPASS) -Encoding utf8

      # ============================================================
      # BƯỚC 3: IN THÔNG TIN KẾT NỐI
      # ============================================================
      - name: Publish Connection Details
        shell: powershell
        run: |
          $summaryFile = $env:GITHUB_STEP_SUMMARY
          Add-Content -Path $summaryFile -Value "## RustDesk Connection Info" -Encoding utf8
          Add-Content -Path $summaryFile -Value "" -Encoding utf8
          Add-Content -Path $summaryFile -Value ("- **ID:** ``" + $env:RDID + "``") -Encoding utf8
          Add-Content -Path $summaryFile -Value ("- **Password:** ``" + $env:RDPASS + "``") -Encoding utf8

      # ============================================================
      # BƯỚC 4: GIỮ SESSION SỐNG
      # ============================================================
      - name: Keep Session Alive
        shell: powershell
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] Session Active..."
              Start-Sleep -Seconds 300
          }
