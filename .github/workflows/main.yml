
name: Layer7 Cloud PC - Windows Server 2025

on:
  workflow_dispatch:
    inputs:
      auto_switch:
        description: "Đưa phiên hiện tại về màn hình đăng nhập"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: windows-2025
    timeout-minutes: 360

    steps:
      # 1. Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Layer7 User
      - name: Setup Layer7 User
        shell: powershell
        env:
          LAYER7_PASSWORD: ${{ secrets.LAYER7_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:LAYER7_PASSWORD)) {
              throw "Missing LAYER7_PASSWORD secret"
          }

          $Password = ConvertTo-SecureString $env:LAYER7_PASSWORD -AsPlainText -Force

          $User = Get-LocalUser -Name "Layer7" -ErrorAction SilentlyContinue

          if (!$User) {
              New-LocalUser -Name "Layer7" `
                -Password $Password `
                -FullName "Layer7" `
                -Description "Layer7 Cloud PC" `
                -PasswordNeverExpires
          }
          else {
              Set-LocalUser -Name "Layer7" -Password $Password
              Enable-LocalUser -Name "Layer7"
          }

          Add-LocalGroupMember -Group "Administrators" -Member "Layer7" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "Layer7" -ErrorAction SilentlyContinue

          Write-Host "Layer7 user configured."

      # 3. Setup RDP
      - name: Configure RDP
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" -Value 0

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" -Value 1

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Write-Host "RDP configured."

      # 4. Configure Login Screen
      - name: Configure Layer7 Login
        shell: powershell
        run: |
          $Path = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Authentication\LogonUI"

          if (!(Test-Path $Path)) {
              New-Item -Path $Path -Force | Out-Null
          }

          Set-ItemProperty -Path $Path `
            -Name "LastLoggedOnUser" -Value ".\Layer7"

          Set-ItemProperty -Path $Path `
            -Name "LastLoggedOnSAMUser" `
            -Value "$env:COMPUTERNAME\Layer7"
      
      - name: Initialize Layer7 User Profile
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $User = "$env:COMPUTERNAME\Layer7"
          $Account = New-Object System.Security.Principal.NTAccount($User)
          $Sid = $Account.Translate([System.Security.Principal.SecurityIdentifier]).Value

          $ProfileList = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList\$Sid"

          $Profile = Get-CimInstance Win32_UserProfile |
              Where-Object { $_.SID -eq $Sid }

          if (-not $Profile) {
              $null = New-Item -Path $ProfileList -Force

              $ProfilePath = "C:\Users\Layer7"

              New-ItemProperty -Path $ProfileList `
                  -Name ProfileImagePath `
                  -Value $ProfilePath `
                  -PropertyType ExpandString `
                  -Force | Out-Null

              $Password = ConvertTo-SecureString "${{ secrets.LAYER7_PASSWORD }}" -AsPlainText -Force
              $Credential = New-Object System.Management.Automation.PSCredential($User, $Password)

              $Process = Start-Process -FilePath "powershell.exe" `
                  -Credential $Credential `
                  -ArgumentList "-NoProfile -Command `"Write-Output 'Layer7 profile initialized'`"" `
                  -Wait -PassThru

              if ($Process.ExitCode -ne 0) {
                  throw "Không thể khởi tạo profile Layer7."
              }
          }

          $ProfilePath = (Get-ItemProperty -Path $ProfileList -Name ProfileImagePath).ProfileImagePath
          $ProfilePath = [Environment]::ExpandEnvironmentVariables($ProfilePath)

          if (-not (Test-Path "$ProfilePath\NTUSER.DAT")) {
              throw "Profile Layer7 chưa được tạo: $ProfilePath"
          }

          Write-Host "Layer7 profile: $ProfilePath"

      # 5. Set Wallpaper
      - name: Setup Layer7 Wallpaper
        shell: pwsh
        run: ./scripts/set-wallpaper.ps1

      # 6. Install RustDesk
      - name: Install RustDesk
        shell: powershell
        env:
          RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          $Msi = "$env:RUNNER_TEMP\rustdesk.msi"

          Invoke-WebRequest `
            -Uri "https://github.com/rustdesk/rustdesk/releases/download/1.2.6/rustdesk-1.2.6-x86_64.msi" `
            -OutFile $Msi

          Start-Process msiexec.exe `
            -ArgumentList "/i `"$Msi`" /qn /norestart" `
            -Wait

          Start-Sleep -Seconds 15

          $Exe = "C:\Program Files\RustDesk\rustdesk.exe"

          if (!(Test-Path $Exe)) {
              throw "RustDesk installation failed."
          }

          if ([string]::IsNullOrWhiteSpace($env:RUSTDESK_PASSWORD)) {
              throw "Missing RUSTDESK_PASSWORD secret."
          }

          & $Exe --password $env:RUSTDESK_PASSWORD

          $ID = $null

          for ($i = 0; $i -lt 15; $i++) {
              $Output = & $Exe --get-id 2>&1 | Out-String

              if ($Output -match '(\d{9,10})') {
                  $ID = $matches[1]
                  break
              }

              Start-Sleep -Seconds 5
          }

          if ($ID) {
              "RUSTDESK_ID=$ID" >> $env:GITHUB_ENV
              Write-Host "RustDesk ID: $ID"
          }
          else {
              Write-Warning "RustDesk ID unavailable."
          }

      # 7. Optional login screen switch
      - name: Switch to Console
        if: ${{ inputs.auto_switch == true }}
        shell: powershell
        run: |
          $Session = (Get-Process -Id $PID).SessionId

          $Action = New-ScheduledTaskAction `
            -Execute "cmd.exe" `
            -Argument "/c tscon $Session /dest:console"

          $Trigger = New-ScheduledTaskTrigger `
            -Once -At (Get-Date).AddSeconds(20)

          $Principal = New-ScheduledTaskPrincipal `
            -UserId "SYSTEM" `
            -LogonType ServiceAccount `
            -RunLevel Highest

          Register-ScheduledTask `
            -TaskName "Layer7ConsoleSwitch" `
            -Action $Action `
            -Trigger $Trigger `
            -Principal $Principal `
            -Force

          Write-Host "Console switch scheduled."

      # 8. Publish information
      - name: Publish Connection Details
        shell: powershell
        run: |
          $Summary = $env:GITHUB_STEP_SUMMARY

          Add-Content $Summary "## Layer7 Cloud PC"
          Add-Content $Summary ""
          Add-Content $Summary "- OS: Windows Server 2025"
          Add-Content $Summary "- User: Layer7"
          Add-Content $Summary "- RDP: Enabled"

          if ($env:RUSTDESK_ID) {
              Add-Content $Summary ""
              Add-Content $Summary "### RustDesk"
              Add-Content $Summary "- ID: $env:RUSTDESK_ID"
          }

      # 9. Keep alive
      - name: Keep Session Alive
        shell: powershell
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] Layer7 Cloud PC running..."
              Start-Sleep -Seconds 300
          }
