name: ThyoCloud Workspace (RustDesk Headless)

on:
  workflow_dispatch:
    inputs:
      customPassword:
        description: 'RustDesk Permanent Password (Leave empty to auto-generate)'
        required: false
        default: ''

jobs:
  deploy-workspace:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================================
      # STEP 1: TẠO MẬT KHẨU VÀ CÀI ĐẶT HÌNH NỀN
      # ============================================================
      - name: Setup RustDesk Password & Wallpaper
        shell: powershell
        env:
          RPASS_INPUT: ${{ github.event.inputs.customPassword }}
        run: |
          Write-Host "Đang tạo mật khẩu RustDesk..."
          if ([string]::IsNullOrEmpty($env:RPASS_INPUT)) {
              $upper = "ABCDEFGHJKLMNPQRSTUVWXYZ"
              $lower = "abcdefghijkmnopqrstuvwxyz"
              $digits = "23456789"
              $special = "!@#$%^&*"
              $pass = -join (1..4 | ForEach-Object { $special[(Get-Random -Maximum $special.Length)] })
              $pass += -join (1..4 | ForEach-Object { $upper[(Get-Random -Maximum $upper.Length)] })
              $pass += -join (1..2 | ForEach-Object { $digits[(Get-Random -Maximum $digits.Length)] })
              $pass += -join (1..2 | ForEach-Object { $lower[(Get-Random -Maximum $lower.Length)] })
              $RPASS = -join ($pass.ToCharArray() | Get-Random -Count $pass.Length)
          } else { $RPASS = $env:RPASS_INPUT }
          
          "RUSTDESK_PASS=$RPASS" >> $env:GITHUB_ENV
          Write-Host "Mật khẩu đã được tạo."

          # Set Wallpaper
          Write-Host "Đang cài đặt hình nền..."
          $LocalWallpaper = Join-Path $env:GITHUB_WORKSPACE "Wallpaper\wallpaper.png"
          if (Test-Path $LocalWallpaper) {
              $DestWallpaper = "C:\Windows\Web\Wallpaper\thyo_bg.png"
              Copy-Item -Path $LocalWallpaper -Destination $DestWallpaper -Force
              
              # Tắt chính sách chặn wallpaper trên RDP
              $tsPolicyPath = "HKCU:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"
              New-Item -Path $tsPolicyPath -Force | Out-Null
              Set-ItemProperty -Path $tsPolicyPath -Name "fNoRemoteDesktopWallpaper" -Value 0 -Type DWord -Force
              
              $RegPath = "HKCU:\Control Panel\Desktop"
              Set-ItemProperty -Path $RegPath -Name Wallpaper -Value $DestWallpaper
              Set-ItemProperty -Path $RegPath -Name WallpaperStyle -Value "10"
              Set-ItemProperty -Path $RegPath -Name TileWallpaper -Value "0"
              
              try {
                  reg load "HKU\DefaultUser" "C:\Users\Default\NTUSER.DAT" | Out-Null
                  $DefaultRegPath = "Registry::HKEY_USERS\DefaultUser\Control Panel\Desktop"
                  Set-ItemProperty -Path $DefaultRegPath -Name Wallpaper -Value $DestWallpaper
                  Set-ItemProperty -Path $DefaultRegPath -Name WallpaperStyle -Value "10"
                  Set-ItemProperty -Path $DefaultRegPath -Name TileWallpaper -Value "0"
                  reg unload "HKU\DefaultUser" | Out-Null
              } catch {}
              
              # FIX LỖI C#: Sử dụng Here-String chuẩn, không thụt lề bên trong
              $csharpCode = @'
using System;
using System.Runtime.InteropServices;
public class Wallpaper {
    [DllImport("user32.dll", CharSet = CharSet.Auto)]
    public static extern int SystemParametersInfo(int uAction, int uParam, string lpvParam, int fuWinIni);
}
'@
              Add-Type -TypeDefinition $csharpCode
              [Wallpaper]::SystemParametersInfo(20, 0, $DestWallpaper, 0x01 -bor 0x02)
              Write-Host "[SUCCESS] Đã đổi hình nền!"
          } else {
              Write-Host "[WARNING] Không tìm thấy file hình nền. Bỏ qua."
          }

      # ============================================================
      # STEP 2: TẢI VÀ CÀI ĐẶT RUSTDESK
      # ============================================================
      - name: Install RustDesk
        shell: powershell
        run: |
          Write-Host "Đang tải RustDesk 1.2.6..."
          $installer = "$env:RUNNER_TEMP\rustdesk.exe"
          $url = "https://github.com/rustdesk/rustdesk/releases/download/1.2.6/rustdesk-1.2.6-x86_64.exe"
          
          curl.exe -L --fail --retry 5 --retry-all-errors --retry-delay 2 -o $installer $url
          
          if (-not (Test-Path $installer)) { throw "Tải RustDesk thất bại." }
          
          Write-Host "Đang cài đặt ngầm..."
          Start-Process -FilePath $installer -ArgumentList "--silent-install" -Wait -NoNewWindow
          
          # Đợi service khởi tạo
          Start-Sleep -Seconds 20

      # ============================================================
      # STEP 3: LẤY ID VÀ ÁP DỤNG MẬT KHẨU
      # ============================================================
      - name: Configure RustDesk Headless
        shell: powershell
        run: |
          $rustdeskExe = "C:\Program Files\RustDesk\rustdesk.exe"
          if (-not (Test-Path $rustdeskExe)) {
              $rustdeskExe = "C:\Program Files (x86)\RustDesk\rustdesk.exe"
          }
          if (-not (Test-Path $rustdeskExe)) { throw "Không tìm thấy file thực thi RustDesk." }
          
          Write-Host "Đang áp dụng mật khẩu vĩnh viễn..."
          & $rustdeskExe --password $env:RUSTDESK_PASS
          
          Write-Host "Đang lấy ID RustDesk..."
          $rustdeskId = $null
          $attempts = 0
          while (-not $rustdeskId -and $attempts -lt 15) {
              $idOutput = & $rustdeskExe --get-id 2>&1
              foreach ($line in $idOutput) {
                  if (([string]$line).Trim() -match '^\d{9,10}$') {
                      $rustdeskId = $matches[0]
                      break
                  }
              }
              if (-not $rustdeskId) { 
                  Write-Host "Chưa lấy được ID (Lần $($attempts+1)/15). Thử lại..."
                  Start-Sleep -Seconds 3 
              }
              $attempts++
          }
          
          if (-not $rustdeskId) { throw "Không thể lấy ID RustDesk." }
          
          Write-Host "======================================================="
          Write-Host "RUSTDESK ID: $rustdeskId"
          Write-Host "RUSTDESK PASSWORD: $env:RUSTDESK_PASS"
          Write-Host "======================================================="
          
          "RUSTDESK_ID=$rustdeskId" >> $env:GITHUB_ENV
          
          # Tắt giao diện (GUI) để tiết kiệm RAM, chỉ giữ lại Service chạy ngầm
          Write-Host "Đang tắt giao diện RustDesk để tiết kiệm RAM..."
          Get-Process -Name "rustdesk" -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowTitle -ne "" } | Stop-Process -Force

      # ============================================================
      # STEP 4: XUẤT THÔNG TIN KẾT NỐI
      # ============================================================
      - name: Publish Connection Details
        shell: powershell
        run: |
          $summaryFile = $env:GITHUB_STEP_SUMMARY
          
          Add-Content -Path $summaryFile -Value "## ThyoCloud Workspace (RustDesk Headless)" -Encoding utf8
          Add-Content -Path $summaryFile -Value "" -Encoding utf8
          Add-Content -Path $summaryFile -Value "### 🔑 Thông tin kết nối:" -Encoding utf8
          Add-Content -Path $summaryFile -Value "- **RustDesk ID:** ``$env:RUSTDESK_ID``" -Encoding utf8
          Add-Content -Path $summaryFile -Value "- **Mật khẩu:** ``$env:RUSTDESK_PASS``" -Encoding utf8
          Add-Content -Path $summaryFile -Value "" -Encoding utf8
          Add-Content -Path $summaryFile -Value "### 📖 Hướng dẫn cho bạn bè:" -Encoding utf8
          Add-Content -Path $summaryFile -Value "1. Mở ứng dụng **RustDesk** (tải trên điện thoại hoặc máy tính)." -Encoding utf8
          Add-Content -Path $summaryFile -Value "2. Nhập **RustDesk ID** ở trên vào ô 'Remote ID'." -Encoding utf8
          Add-Content -Path $summaryFile -Value "3. Bấm **Connect**." -Encoding utf8
          Add-Content -Path $summaryFile -Value "4. Nhập **Mật khẩu** khi được hỏi." -Encoding utf8
          Add-Content -Path $summaryFile -Value "" -Encoding utf8
          Add-Content -Path $summaryFile -Value "> **Lưu ý:** Không cần cài đặt VPN hay phần mềm phức tạp. Máy ảo đang chạy ẩn (Headless) để tối ưu hiệu suất." -Encoding utf8

      # ============================================================
      # STEP 5: GIỮ SESSION SỐNG
      # ============================================================
      - name: Keep session alive
        shell: powershell
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] Session Active - Đang chờ kết nối qua RustDesk..."
              Start-Sleep -Seconds 300
          }
