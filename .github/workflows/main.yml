name: GPU Cloud PC (Cloudflare RDP)

on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Số giờ thuê (1-5)'
        required: true
        default: '3'
        type: string

permissions:
  actions: write
  contents: read

jobs:
  deploy-instance:
    runs-on: windows-2025
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Generate Password
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $chars = 'abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'
          $password = -join (1..12 | ForEach-Object { $chars[(Get-Random -Maximum $chars.Length)] })
          "GENERATED_PASSWORD=$password" >> $env:GITHUB_ENV
          Write-Host "✅ Generated password for RDP user."

      - name: Setup Windows Account & Enable RDP
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          
          # Tạo tài khoản Windows (GPUUser)
          $secure = ConvertTo-SecureString "$env:GENERATED_PASSWORD" -AsPlainText -Force
          $user = Get-LocalUser -Name "GPUUser" -ErrorAction SilentlyContinue
          if ($null -eq $user) {
              New-LocalUser -Name "GPUUser" -Password $secure -PasswordNeverExpires -AccountNeverExpires -FullName 'GPU User'
          } else {
              Set-LocalUser -Name "GPUUser" -Password $secure
          }
          Add-LocalGroupMember -Group 'Administrators' -Member "GPUUser"
          Add-LocalGroupMember -Group 'Remote Desktop Users' -Member "GPUUser"

          # Bật tính năng Remote Desktop (RDP)
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          
          Write-Host "✅ RDP Enabled and Account Configured."

      - name: Install Mesa3D (Software GPU)
        shell: powershell
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Downloading Mesa3D..."
          $mesaDir = "C:\Mesa3D"
          $archive = "$env:TEMP\mesa.7z"
          New-Item -ItemType Directory -Path $mesaDir -Force | Out-Null
          
          Invoke-WebRequest -Uri 'https://github.com/pal1000/mesa-dist-win/releases/download/24.3.4/mesa3d-24.3.4-release-msvc.7z' -OutFile $archive -UseBasicParsing -TimeoutSec 300
          
          $sevenZip = "$env:TEMP\7zr.exe"
          if (-not (Test-Path $sevenZip)) {
              Invoke-WebRequest -Uri 'https://www.7-zip.org/a/7zr.exe' -OutFile $sevenZip -UseBasicParsing
          }
          
          Write-Host "Extracting Mesa3D..."
          $process = Start-Process -FilePath $sevenZip -ArgumentList "x `"$archive`" `"-o$mesaDir`" -y" -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) { throw "Failed to extract Mesa3D." }
          
          [System.Environment]::SetEnvironmentVariable("GALLIUM_DRIVER", "llvmpipe", "Machine")
          [System.Environment]::SetEnvironmentVariable("LIBGL_ALWAYS_SOFTWARE", "1", "Machine")
          [System.Environment]::SetEnvironmentVariable("MESA_GL_VERSION_OVERRIDE", "4.6", "Machine")
          [System.Environment]::SetEnvironmentVariable("MESA_GLSL_VERSION_OVERRIDE", "460", "Machine")
          Write-Host "✅ Mesa3D installed."

      - name: Setup Cloudflare Tunnel & Expose RDP
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Downloading Cloudflare Tunnel (cloudflared)..."
          $cloudflaredDir = "C:\Cloudflared"
          New-Item -ItemType Directory -Path $cloudflaredDir -Force | Out-Null
          $cloudflaredExe = "$cloudflaredDir\cloudflared.exe"
          
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile $cloudflaredExe -UseBasicParsing
          
          Write-Host "Starting Cloudflare Quick Tunnel for RDP (Port 3389)..."
          $logFile = "$env:TEMP\cloudflared.log"
          Start-Process -FilePath $cloudflaredExe -ArgumentList "tunnel --url rdp://127.0.0.1:3389" -RedirectStandardError $logFile -WindowStyle Hidden
          
          $maxRetries = 15
          $tunnelUrl = $null
          
          for ($i = 1; $i -le $maxRetries; $i++) {
              Start-Sleep -Seconds 3
              if (Test-Path $logFile) {
                  $content = Get-Content $logFile -Raw
                  # Quét tìm địa chỉ dạng https://xxxx.trycloudflare.com
                  if ($content -match '(https://[a-zA-Z0-9-]+\.trycloudflare\.com)') {
                      $rawUrl = $Matches[1]
                      # Bỏ tiền tố https:// để lấy domain (ví dụ: respect-bracelets-consciousness-heard.trycloudflare.com)
                      $domain = $rawUrl -replace 'https://', ''
                      # Cloudflare TCP tunnel qua trycloudflare ánh xạ port 3389 vào port công cộng tương ứng (thường cloudflare hiển thị url web nhưng bên dưới là TCP, ta dùng tcp port forward)
                      $tunnelUrl = "$domain:3389"
                      break
                  }
              }
              Write-Host "Waiting for Cloudflare Tunnel URL... ($i/$maxRetries)"
          }
          
          if (-not $tunnelUrl) {
              $content = Get-Content $logFile -ErrorAction SilentlyContinue
              Write-Host "Cloudflare Log Output:"
              $content | ForEach-Object { Write-Host $_ }
              throw "Could not retrieve Cloudflare Tunnel URL."
          }
          
          Write-Host "✅ Cloudflare Tunnel Address: $tunnelUrl"
          "RDP_TUNNEL_URL=$tunnelUrl" >> $env:GITHUB_ENV

      - name: Publish Connection Information
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $summary = @(
            '## GPU Cloud PC (Cloudflare RDP)',
            "- **Tunnel Address:** `$env:RDP_TUNNEL_URL",
            "- **Username:** `GPUUser`",
            "- **Password:** `$env:GENERATED_PASSWORD`",
            "",
            "**Hướng dẫn kết nối:**",
            "1. Nhấn tổ hợp phím `Windows + R`, gõ `mstsc` rồi nhấn Enter.",
            "2. Nhập địa chỉ tunnel vào ô Computer.",
            "3. Nhấn Connect, điền tài khoản `GPUUser` và mật khẩu ở trên."
          )
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Keep session alive
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $hours = 3
          try { $hours = [int]'${{ github.event.inputs.hours }}' } catch {}
          if ($hours -lt 1) { $hours = 1 }
          if ($hours -gt 5) { $hours = 5 }
          
          $end = (Get-Date).AddHours($hours)
          Write-Host "Session ends at: $end"
          
          while ((Get-Date) -lt $end) {
              $remain = $end - (Get-Date)
              Write-Host "Remaining: $($remain.ToString('hh\:mm\:ss'))"
              Start-Sleep -Seconds 60
          }

      - name: Cleanup
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          Remove-Item -Path "$env:TEMP\*" -Recurse -Force -ErrorAction SilentlyContinue
