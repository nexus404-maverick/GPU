name: ThyoCloud Serveo RDP + RustDesk Setup

on:
  workflow_dispatch:

jobs:
  deploy-workspace:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================================
      # STEP 1: START TEMPORARY HTTP SERVER (Showing "Preparing...")
      # ============================================================
      - name: Start Temporary HTTP Server
        shell: powershell
        run: |
          $port = 8080
          $html = @"
          <!DOCTYPE html>
          <html>
          <head><title>ThyoCloud Workspace</title><meta charset='utf-8'></head>
          <body style='font-family: Arial; text-align: center; margin-top: 100px;'>
              <h1 style='color: #0078D4;'>⏳ Preparing your workspace...</h1>
              <p>RustDesk is being installed and configured. Please wait.</p>
              <p>This page will automatically update soon.</p>
          </body>
          </html>
          "@
          
          # Lưu nội dung HTML ra file tạm để server đọc lại sau này
          $html | Out-File -FilePath "$env:RUNNER_TEMP\index.html" -Encoding utf8
          
          # Tạo một background job chạy HTTP server đơn giản
          $job = Start-Job -ScriptBlock {
              param($p, $file)
              $listener = [System.Net.HttpListener]::new()
              $listener.Prefixes.Add("http://localhost:$p/")
              $listener.Start()
              Write-Host "HTTP Server listening on port $p"
              while ($listener.IsListening) {
                  $context = $listener.GetContext()
                  $content = Get-Content $file -Raw -ErrorAction SilentlyContinue
                  if (-not $content) { $content = "<h1>Preparing...</h1>" }
                  $buffer = [System.Text.Encoding]::UTF8.GetBytes($content)
                  $context.Response.ContentLength64 = $buffer.Length
                  $context.Response.OutputStream.Write($buffer, 0, $buffer.Length)
                  $context.Response.OutputStream.Close()
              }
          } -ArgumentList $port, "$env:RUNNER_TEMP\index.html"
          
          Start-Sleep -Seconds 2
          Write-Host "Temporary HTTP server started (Job ID: $($job.Id))."

      # ============================================================
      # STEP 2: START SERVEO TUNNELS (HTTP + TCP 3389)
      # ============================================================
      - name: Start Serveo Tunnels
        shell: powershell
        run: |
          # 2.1. HTTP tunnel for the notification page (port 80 -> local 8080)
          Write-Host "Starting Serveo HTTP tunnel for notification page..."
          $httpLog = "$env:RUNNER_TEMP\serveo_http.log"
          Start-Process -FilePath "ssh" -ArgumentList "-o StrictHostKeyChecking=no -o UserKnownHostsFile=NUL -R 80:localhost:8080 serveo.net" -RedirectStandardOutput $httpLog -RedirectStandardError "$env:RUNNER_TEMP\serveo_http.err" -WindowStyle Hidden
          
          # 2.2. TCP tunnel for RDP (port 3389 -> local 3389)
          Write-Host "Starting Serveo TCP tunnel for RDP (port 3389)..."
          $tcpLog = "$env:RUNNER_TEMP\serveo_tcp.log"
          Start-Process -FilePath "ssh" -ArgumentList "-o StrictHostKeyChecking=no -o UserKnownHostsFile=NUL -R 3389:localhost:3389 serveo.net" -RedirectStandardOutput $tcpLog -RedirectStandardError "$env:RUNNER_TEMP\serveo_tcp.err" -WindowStyle Hidden
          
          Start-Sleep -Seconds 10
          
          # 2.3. Extract public URLs from Serveo logs
          $httpUrl = $null
          $tcpAddress = $null
          
          if (Test-Path $httpLog) {
              $httpContent = Get-Content $httpLog -Raw
              if ($httpContent -match 'https://([a-zA-Z0-9]+\.serveo\.net)') {
                  $httpUrl = $matches[1]
                  Write-Host "Serveo HTTP URL: $httpUrl"
              }
          }
          
          if (Test-Path $tcpLog) {
              $tcpContent = Get-Content $tcpLog -Raw
              # Serveo prints something like "Forwarding TCP connections from serveo.net:12345"
              if ($tcpContent -match 'serveo\.net:(\d+)') {
                  $tcpPort = $matches[1]
                  $tcpAddress = "serveo.net:$tcpPort"
                  Write-Host "Serveo TCP Address for RDP: $tcpAddress"
              }
          }
          
          if (-not $httpUrl) { Write-Host "[WARNING] Could not detect HTTP URL from Serveo log. Check $httpLog" }
          if (-not $tcpAddress) { Write-Host "[WARNING] Could not detect TCP address from Serveo log. Check $tcpLog" }
          
          "HTTP_URL=$httpUrl" >> $env:GITHUB_ENV
          "TCP_RDP_ADDR=$tcpAddress" >> $env:GITHUB_ENV

      # ============================================================
      # STEP 3: INSTALL RUSTDESK AND GET ID/PASSWORD
      # ============================================================
      - name: Install RustDesk & Retrieve Credentials
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = "$env:RUNNER_TEMP\rustdesk.exe"
          $url = "https://github.com/rustdesk/rustdesk/releases/download/1.2.6/rustdesk-1.2.6-x86_64.exe"
          
          Write-Host "Downloading RustDesk 1.2.6..."
          Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing
          
          Write-Host "Installing RustDesk silently..."
          $proc = Start-Process -FilePath $installer -ArgumentList "--silent-install" -PassThru -Verb RunAs -WindowStyle Hidden
          if (-not $proc.WaitForExit(120000)) {
              $proc.Kill()
              throw "RustDesk installation timed out."
          }
          
          Start-Sleep -Seconds 10
          $rustdeskExe = "C:\Program Files\RustDesk\rustdesk.exe"
          if (-not (Test-Path $rustdeskExe)) { throw "RustDesk executable not found." }
          
          # Generate random password
          $chars = "abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789"
          $rustdeskPw = -join (1..10 | ForEach-Object { $chars[(Get-Random -Maximum $chars.Length)] })
          Write-Host "Applying RustDesk password..."
          Start-Process -FilePath $rustdeskExe -ArgumentList "--password `"$rustdeskPw`"" -Wait -WindowStyle Hidden
          
          # Retrieve ID
          Write-Host "Retrieving RustDesk ID..."
          $rustdeskId = $null
          for ($i=1; $i -le 10 -and -not $rustdeskId; $i++) {
              $output = & $rustdeskExe --get-id 2>&1
              foreach ($line in $output) {
                  if (([string]$line).Trim() -match '^\d{9,10}$') { $rustdeskId = $matches[0]; break }
              }
              if (-not $rustdeskId) { Start-Sleep -Seconds 3 }
          }
          if (-not $rustdeskId) { throw "Failed to get RustDesk ID." }
          
          Write-Host "RustDesk ID: $rustdeskId | Password: $rustdeskPw"
          "RUSTDESK_ID=$rustdeskId" >> $env:GITHUB_ENV
          "RUSTDESK_PASS=$rustdeskPw" >> $env:GITHUB_ENV
          
          # Kill RustDesk GUI to save RAM (headless mode)
          Stop-Process -Name "rustdesk" -Force -ErrorAction SilentlyContinue

      # ============================================================
      # STEP 4: UPDATE HTTP PAGE WITH FINAL INSTRUCTIONS
      # ============================================================
      - name: Update Notification Page
        shell: powershell
        run: |
          # Prepare the final HTML with connection details
          $httpUrl = $env:HTTP_URL
          $tcpAddr = $env:TCP_RDP_ADDR
          $rId = $env:RUSTDESK_ID
          $rPw = $env:RUSTDESK_PASS
          $user = "Admin" # Default RDP user, or adjust if you created a custom one
          
          $finalHtml = @"
          <!DOCTYPE html>
          <html>
          <head><title>ThyoCloud Workspace - Ready</title><meta charset='utf-8'></head>
          <body style='font-family: Arial; text-align: center; margin-top: 80px;'>
              <h1 style='color: #28a745;'>✅ Workspace is Ready!</h1>
              <h2 style='color: #dc3545; font-size: 2.5em;'>⚠️ PLEASE REVISIT THE WEBSITE TO GET NEW INFORMATION</h2>
              <p>Your remote connection details have been generated.</p>
              <hr style='width: 50%;'>
              <h3>🖥️ RDP via Serveo</h3>
              <p><strong>Address:</strong> <code>$tcpAddr</code></p>
              <p><strong>Username:</strong> <code>$user</code></p>
              <p><strong>Password:</strong> <code>(Check your GitHub Actions summary for RDP password)</code></p>
              <h3>📱 RustDesk</h3>
              <p><strong>ID:</strong> <code>$rId</code></p>
              <p><strong>Password:</strong> <code>$rPw</code></p>
              <hr style='width: 50%;'>
              <p>Refresh this page if you don't see the details above.</p>
              <p><small>Powered by ThyoCloud & Serveo</small></p>
          </body>
          </html>
          "@
          
          # Overwrite the temporary index.html with the final content
          $finalHtml | Out-File -FilePath "$env:RUNNER_TEMP\index.html" -Encoding utf8
          Write-Host "Final notification page updated."

      # ============================================================
      # STEP 5: PUBLISH GITHUB SUMMARY
      # ============================================================
      - name: Publish Connection Details to Summary
        shell: powershell
        run: |
          $summary = @()
          $summary += "## ThyoCloud Workspace (Serveo RDP + RustDesk)"
          $summary += ""
          $summary += "### 🌐 Notification Page (Visit this first):"
          $summary += "- **URL:** ``https://$env:HTTP_URL``"
          $summary += ""
          $summary += "### 🖥️ RDP via Serveo (After page updates):"
          $summary += "- **Address:** ``$env:TCP_RDP_ADDR``"
          $summary += "- **Username:** ``Admin``"
          $summary += "- **Password:** ``(See below)``"
          $summary += ""
          $summary += "### 📱 RustDesk:"
          $summary += "- **ID:** ``$env:RUSTDESK_ID``"
          $summary += "- **Password:** ``$env:RUSTDESK_PASS``"
          $summary += ""
          $summary += "> **Note:** The notification page will change automatically. Revisit it after ~2 minutes to see the final details."
          
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      # ============================================================
      # STEP 6: KEEP SESSION ALIVE
      # ============================================================
      - name: Keep Session Alive
        shell: powershell
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] Session Active - Serveo tunnels & HTTP server running..."
              Start-Sleep -Seconds 300
          }
