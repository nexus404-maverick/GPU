name: Layer7 RDP Windows Server 2025

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: 'Mã đơn hàng (VD: ORD-123) - Dùng để gửi Webhook'
        required: false
        default: 'ORD-001'
        type: string
      durasi_menit:
        description: 'Thời lượng phiên (phút), 10-360'
        required: false
        default: '360'
        type: string
      hostname:
        description: 'Hostname (chỉ chữ, số, dấu gạch nối)'
        required: false
        default: 'rdpfree'
        type: string
      rdp_user:
        description: 'Tên tài khoản RDP (3-20 ký tự)'
        required: false
        default: 'xyadmin'
        type: string
      storage_boost:
        required: false
        default: 'ya'
        type: choice
        options: [ya, tidak]
      debloat:
        required: false
        default: 'ringan'
        type: choice
        options: [ringan, full, tidak]
      win10:
        required: false
        default: 'ya'
        type: choice
        options: [ya, tidak]
      ekstra:
        required: false
        default: 'ya'
        type: choice
        options: [ya, tidak]
      grafis:
        required: false
        default: 'software'
        type: choice
        options: [software, tidak]
      microphone:
        required: false
        default: 'ya'
        type: choice
        options: [ya, tidak]
      discord:
        required: false
        default: 'tidak'
        type: choice
        options: [ya, tidak]

permissions:
  contents: read
  actions: read

concurrency:
  group: layer7-windows-2025-rdp
  cancel-in-progress: false

env:
  DUR: ${{ inputs.durasi_menit || '360' }}
  HOSTNAME: ${{ inputs.hostname || 'rdpfree' }}
  RDP_USER: ${{ inputs.rdp_user || 'xyadmin' }}
  STORAGE_BOOST: ${{ inputs.storage_boost || 'ya' }}
  DEBLOAT: ${{ inputs.debloat || 'ringan' }}
  WIN10: ${{ inputs.win10 || 'ya' }}
  EKSTRA: ${{ inputs.ekstra || 'ya' }}
  GRAFIS: ${{ inputs.grafis || 'software' }}
  MICROPHONE: ${{ inputs.microphone || 'ya' }}
  DISCORD: ${{ inputs.discord || 'tidak' }}
  WORK_DIR: 'C:\Layer7'
  PERSIST_DIR: 'C:\Layer7\persist'
  TEMP_DIR: 'C:\Layer7\temp'

jobs:
  rdp:
    name: Layer7 Windows Server 2025
    runs-on: windows-2025
    timeout-minutes: 360

    steps:
      # ------------------------------------------------------------------
      # 1. XÁC THỰC INPUT VÀ SECRET (TẠO PASS NGẪU NHIÊN NẾU CẦN)
      # ------------------------------------------------------------------
      - name: Validate inputs and secrets
        shell: pwsh
        env:
          SECRET_RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          
          # Nếu secret bị trống, tự động tạo mật khẩu ngẫu nhiên
          if ([string]::IsNullOrWhiteSpace($env:SECRET_RDP_PASSWORD)) {
              Write-Host "Secret RDP_PASSWORD is empty. Generating random password..."
              $chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$"
              $password = -join (1..16 | ForEach-Object { $chars[(Get-Random -Maximum $chars.Length)] })
              echo "RDP_PASSWORD=$password" >> $env:GITHUB_ENV
              $env:SECRET_RDP_PASSWORD = $password
          } else {
              Write-Host "Using RDP_PASSWORD from secrets."
          }

          Write-Host "::add-mask::$env:SECRET_RDP_PASSWORD"

          if ($env:DUR -notmatch '^\d+$') { throw "durasi_menit must be numeric." }
          $durInt = [int]$env:DUR
          if ($durInt -lt 10 -or $durInt -gt 360) { throw "durasi_menit must be 10-360." }

          if ($env:HOSTNAME -notmatch '^[a-zA-Z0-9]([a-zA-Z0-9\-]{0,13}[a-zA-Z0-9])?$') {
              throw "hostname contains invalid characters."
          }
          if ($env:RDP_USER.Length -lt 3 -or $env:RDP_USER.Length -gt 20) {
              throw "rdp_user must be 3-20 characters."
          }

          Write-Host "Input validation passed."

      # ------------------------------------------------------------------
      # 2. KHỞI TẠO VÀ THIẾT LẬP RDP (CẤP QUYỀN ADMIN)
      # ------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            assets
          sparse-checkout-cone-mode: false

      - name: Init directories and Setup RDP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          
          # Khởi tạo thư mục
          foreach ($d in @($env:WORK_DIR, $env:PERSIST_DIR, $env:TEMP_DIR)) {
              if (-not (Test-Path $d)) { New-Item -ItemType Directory -Path $d -Force | Out-Null }
          }

          $user = $env:RDP_USER
          $pass = $env:SECRET_RDP_PASSWORD

          $existing = Get-LocalUser -Name $user -ErrorAction SilentlyContinue
          if (-not $existing) {
              $securePass = ConvertTo-SecureString $pass -AsPlainText -Force
              New-LocalUser -Name $user -Password $securePass -PasswordNeverExpires -AccountNeverExpires -FullName "Layer7 User" | Out-Null
          } else {
              $securePass = ConvertTo-SecureString $pass -AsPlainText -Force
              Set-LocalUser -Name $user -Password $securePass
          }

          # Cấp quyền
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $user -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member $user -ErrorAction SilentlyContinue

          # Bật RDP
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0 -Type DWord -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 1 -Type DWord -Force
          New-NetFirewallRule -DisplayName "Layer7-RDP-Fallback" -Direction Inbound -Protocol TCP -LocalPort 3389 -Action Allow -Profile Any -ErrorAction SilentlyContinue | Out-Null
          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService -ErrorAction SilentlyContinue
          Write-Host "Init and RDP fallback ready."

      # ------------------------------------------------------------------
      # 3. CÀI ĐẶT VÀ CẤU HÌNH RUSTDESK (LẤY ID 3 LỚP)
      # ------------------------------------------------------------------
      - name: Install and configure RustDesk
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          
          Write-Host "--- Fetching latest RustDesk release ---"
          $releaseApi = 'https://api.github.com/repos/rustdesk/rustdesk/releases/latest'
          $release = Invoke-RestMethod -Uri $releaseApi -Headers @{ 'User-Agent' = 'Layer7-Workflow' } -TimeoutSec 60
          
          $asset = $release.assets | Where-Object { $_.name -match '^rustdesk-[\d\.]+-x86_64\.msi$' } | Select-Object -First 1
          if (-not $asset) {
              $asset = $release.assets | Where-Object { $_.name -match '^rustdesk-[\d\.]+-x86_64\.exe$' } | Select-Object -First 1
          }
          if (-not $asset) { throw "Could not find RustDesk Windows x86_64 asset." }

          $downloadUrl = $asset.browser_download_url
          $installerPath = Join-Path $env:TEMP_DIR $asset.name
          Write-Host "Downloading $($asset.name)..."
          Invoke-WebRequest -Uri $downloadUrl -OutFile $installerPath -UseBasicParsing -TimeoutSec 300
          if ((Get-Item $installerPath).Length -lt 1MB) { throw "RustDesk installer appears too small." }

          Write-Host "Installing RustDesk..."
          if ($installerPath -match '\.msi$') {
              $proc = Start-Process msiexec.exe -ArgumentList @('/i', "`"$installerPath`"", '/quiet', '/norestart') -Wait -PassThru -NoNewWindow
              if ($proc.ExitCode -ne 0) { throw "RustDesk MSI failed: $($proc.ExitCode)" }
          } else {
              $proc = Start-Process -FilePath $installerPath -ArgumentList '--silent-install' -Wait -PassThru -NoNewWindow
              if ($proc.ExitCode -ne 0) { throw "RustDesk EXE failed: $($proc.ExitCode)" }
          }
          Write-Host "RustDesk installed."

          $rustdeskExe = Join-Path $env:ProgramFiles 'RustDesk\rustdesk.exe'
          if (-not (Test-Path $rustdeskExe)) {
              $found = Get-ChildItem -Path $env:ProgramFiles, ${env:ProgramFiles(x86)} -Filter 'rustdesk.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found) { $rustdeskExe = $found.FullName }
          }
          if (-not (Test-Path $rustdeskExe)) { throw "rustdesk.exe not found." }

          # Đặt mật khẩu qua CLI trước (cách nhanh nhất)
          Write-Host "Setting RustDesk password..."
          & $rustdeskExe --password "$env:SECRET_RDP_PASSWORD" 2>&1 | Out-Null
          Start-Sleep -Seconds 5

          # Đảm bảo Service đang chạy
          & $rustdeskExe --install-service 2>&1 | Out-Null
          Start-Sleep -Seconds 3
          Start-Service -Name 'RustDesk' -ErrorAction SilentlyContinue
          
          # Khởi chạy ẩn để ép tạo ID
          Start-Process -FilePath $rustdeskExe -WindowStyle Hidden -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 10

          Write-Host "Retrieving RustDesk ID (3-layer method)..."
          $rustdeskId = $null

          # Lớp 1: CLI
          for ($i = 1; $i -le 5; $i++) {
              try {
                  $output = & $rustdeskExe --get-id 2>&1 | Out-String
                  if ($output -match "(\d{9,10})") { $rustdeskId = $matches[1]; break }
              } catch {}
              Start-Sleep -Seconds 3
          }

          # Lớp 2: Đọc file TOML
          if (-not $rustdeskId) {
              Write-Host "CLI failed, checking TOML config..."
              $configPaths = @(
                  "C:\Windows\ServiceProfiles\LocalService\AppData\Roaming\RustDesk\config\RustDesk.toml",
                  "C:\Windows\System32\config\systemprofile\AppData\Roaming\RustDesk\config\RustDesk.toml"
              )
              foreach ($path in $configPaths) {
                  if (Test-Path $path) {
                      $content = Get-Content $path -Raw -ErrorAction SilentlyContinue
                      if ($content -match 'id\s*=\s*''(\d+)''') { $rustdeskId = $matches[1]; break }
                      if ($content -match 'id\s*=\s*"(\d+)"') { $rustdeskId = $matches[1]; break }
                  }
              }
          }

          # Lớp 3: Đọc từ Registry
          if (-not $rustdeskId) {
              Write-Host "TOML failed, checking Registry..."
              $regPaths = @("HKLM:\SOFTWARE\RustDesk", "HKCU:\SOFTWARE\RustDesk")
              foreach ($reg in $regPaths) {
                  if (Test-Path $reg) {
                      $id = (Get-ItemProperty -Path $reg -Name "ID" -ErrorAction SilentlyContinue).ID
                      if ($id) { $rustdeskId = $id; break }
                  }
              }
          }

          if (-not $rustdeskId) { throw "Could not retrieve RustDesk ID after trying all methods." }
          
          $rustdeskId | Out-File -FilePath (Join-Path $env:WORK_DIR 'rustdesk_id.txt') -Encoding ASCII -NoNewline
          echo "RUSTDESK_ID=$rustdeskId" >> $env:GITHUB_ENV
          Write-Host "RustDesk ID obtained: $rustdeskId"

      # ------------------------------------------------------------------
      # 4. DỌN DẸP DESKTOP VÀ TỐI ƯU HỆ THỐNG
      # ------------------------------------------------------------------
      - name: Clean Desktop Icons
        shell: pwsh
        run: |
          Write-Host "Cleaning desktop icons..."
          $user = $env:RDP_USER
          
          Remove-Item -Path "C:\Users\Public\Desktop\*" -Include *.lnk, *.url -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\Users\$user\Desktop\*" -Include *.lnk, *.url -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\Users\runneradmin\Desktop\*" -Include *.lnk, *.url -Force -ErrorAction SilentlyContinue

          $RegPath = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\HideDesktopIcons\NewStartPanel"
          if (-not (Test-Path $RegPath)) { New-Item -Path $RegPath -Force | Out-Null }

          $HideIcons = @(
              "{645FF040-5081-101B-9F08-00AA002F954E}", # Recycle Bin
              "{20D04FE0-3AEA-1069-A2D8-08002B30309D}", # This PC
              "{F02C1A0D-BE21-4350-88B0-7367FC96EF3C}", # Network
              "{59031a47-3f72-44a7-89c5-5595fe6b30ee}", # User Files
              "{5399E694-6CE5-4D6C-8FCE-1D8870FDCBA0}"  # Control Panel
          )
          foreach ($GUID in $HideIcons) {
              Set-ItemProperty -Path $RegPath -Name $GUID -Value 1 -Type DWord -Force
          }
          Stop-Process -Name explorer -Force -ErrorAction SilentlyContinue
          Write-Host "Desktop cleaned."

      - name: Optimize storage and debloat
        if: env.STORAGE_BOOST == 'ya' || env.DEBLOAT != 'tidak'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          if ($env:STORAGE_BOOST -eq 'ya') {
              $safePaths = @("$env:LOCALAPPDATA\Temp\*", "$env:TEMP\*", "C:\Windows\Temp\*")
              foreach ($p in $safePaths) {
                  if (Test-Path $p) { try { Remove-Item -Path $p -Recurse -Force -ErrorAction SilentlyContinue } catch {} }
              }
              Write-Host "Storage boost done."
          }
          if ($env:DEBLOAT -eq 'ringan') {
              Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection' -Name 'AllowTelemetry' -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue
          } elseif ($env:DEBLOAT -eq 'full') {
              $bloatApps = @('Microsoft.BingWeather','Microsoft.BingNews','Microsoft.GetHelp','Microsoft.Getstarted','Microsoft.MicrosoftSolitaireCollection','Microsoft.People','Microsoft.WindowsFeedbackHub','Microsoft.XboxApp')
              foreach ($app in $bloatApps) {
                  $pkg = Get-AppxPackage -Name $app -ErrorAction SilentlyContinue
                  if ($pkg) { try { Remove-AppxPackage -Package $pkg.PackageFullName -ErrorAction Stop } catch {} }
              }
          }

      - name: Configure UI and Audio
        if: env.WIN10 == 'ya' || env.MICROPHONE == 'ya'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $user = $env:RDP_USER
          
          if ($env:WIN10 -eq 'ya') {
              $userSid = (Get-LocalUser -Name $user -ErrorAction SilentlyContinue).SID.Value
              if ($userSid) {
                  $regPath = "Registry::HKEY_USERS\$userSid\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"
                  if (-not (Test-Path $regPath)) { New-Item -Path $regPath -Force | Out-Null }
                  Set-ItemProperty -Path $regPath -Name 'AppsUseLightTheme' -Value 0 -Type DWord -Force
                  Set-ItemProperty -Path $regPath -Name 'SystemUsesLightTheme' -Value 0 -Type DWord -Force
              }
          }

          if ($env:MICROPHONE -eq 'ya') {
              $tsPolicy = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
              if (-not (Test-Path $tsPolicy)) { New-Item -Path $tsPolicy -Force | Out-Null }
              Set-ItemProperty -Path $tsPolicy -Name 'fDisableAudioCapture' -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue
              Set-ItemProperty -Path $tsPolicy -Name 'fDisableCam' -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue
          }

      # ------------------------------------------------------------------
      # 5. MESA3D (BẮT BUỘC)
      # ------------------------------------------------------------------
      - name: Setup Mesa3D (if enabled)
        if: env.GRAFIS == 'software'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host "--- Mesa3D Setup ---"
          $mesaUrl = 'https://github.com/pal1000/mesa-dist-win/releases/download/25.3.1/mesa3d-25.3.1-release-msvc.7z'
          $mesaArchive = Join-Path $env:TEMP_DIR 'mesa3d.7z'
          $mesaDir = Join-Path $env:WORK_DIR 'mesa3d'
          
          try {
              Invoke-WebRequest -Uri $mesaUrl -OutFile $mesaArchive -UseBasicParsing -TimeoutSec 300
              if ((Get-Item $mesaArchive).Length -lt 1MB) { throw "Mesa3D archive too small." }
              
              $sevenZip = Get-Command '7z.exe' -ErrorAction SilentlyContinue
              if (-not $sevenZip) {
                  $installed7z = Get-ChildItem -Path "C:\Program Files\7-Zip\7z.exe" -ErrorAction SilentlyContinue
                  if ($installed7z) { $sevenZip = $installed7z.FullName }
                  else {
                      winget install --id 7zip.7zip --silent --accept-package-agreements --accept-source-agreements | Out-Null
                      $sevenZip = (Get-Command '7z.exe' -ErrorAction SilentlyContinue).Source
                  }
              }
              if ($sevenZip) {
                  $sevenZipCmd = if ($sevenZip -is [System.Management.Automation.ApplicationInfo]) { $sevenZip.Source } else { $sevenZip }
                  & $sevenZipCmd x $mesaArchive "-o$mesaDir" -y | Out-Null
                  Write-Host "Mesa3D successfully extracted to $mesaDir."
              } else { throw "Cannot find or install 7z.exe." }
          } catch { Write-Warning "Mesa3D setup failed: $_" }

      # ------------------------------------------------------------------
      # 6. CÀI ĐẶT ỨNG DỤNG VÀ WALLPAPER
      # ------------------------------------------------------------------
      - name: Install selected apps
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          if ($env:DISCORD -eq 'ya') { winget install --id Discord.Discord --silent --accept-package-agreements --accept-source-agreements | Out-Null }
          if ($env:EKSTRA -eq 'ya') {
              winget install --id 7zip.7zip --silent --accept-package-agreements --accept-source-agreements | Out-Null
              winget install --id Google.Chrome --silent --accept-package-agreements --accept-source-agreements | Out-Null
              winget install --id Skillbrains.Lightshot --silent --accept-package-agreements --accept-source-agreements | Out-Null
          }

      - name: Apply wallpaper from assets (if exists)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $wpSource = Join-Path $env:GITHUB_WORKSPACE 'assets\wallpaper.jpg'
          if (-not (Test-Path $wpSource)) { Write-Warning "assets/wallpaper.jpg not found. Skipping."; return }
          $wpDest = Join-Path $env:WORK_DIR 'wallpaper.jpg'
          Copy-Item -Path $wpSource -Destination $wpDest -Force
          $user = $env:RDP_USER
          $userSid = (Get-LocalUser -Name $user).SID.Value
          $desktopPath = "Registry::HKEY_USERS\$userSid\Control Panel\Desktop"
          if (-not (Test-Path $desktopPath)) { New-Item -Path $desktopPath -Force | Out-Null }
          Set-ItemProperty -Path $desktopPath -Name 'WallPaper' -Value $wpDest -Type String -Force
          Set-ItemProperty -Path $desktopPath -Name 'WallpaperStyle' -Value '10' -Type String -Force
          Write-Host "Wallpaper set."

      # ------------------------------------------------------------------
      # 7. GỬI THÔNG TIN VỀ TERMUX (NẾU CÓ)
      # ------------------------------------------------------------------
      - name: Send Credentials to Phone Server
        shell: pwsh
        env:
          PHONE_SERVER_URL: ${{ secrets.PHONE_SERVER_URL }}
          INSTANCE_NUMBER: ${{ inputs.instance_number }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PHONE_SERVER_URL)) {
              Write-Host "PHONE_SERVER_URL secret is not set. Skipping webhook."
              return
          }
          
          $baseUrl = $env:PHONE_SERVER_URL.TrimEnd('/')
          $url = "$baseUrl/api/provision/$($env:INSTANCE_NUMBER)"
          
          $body = @{
              rustdesk_id       = "$env:RUSTDESK_ID"
              rustdesk_password = "$env:SECRET_RDP_PASSWORD"
          } | ConvertTo-Json
          
          try {
              $res = Invoke-RestMethod -Uri $url -Method Post -Body $body -ContentType "application/json" -TimeoutSec 30
              Write-Host "Sent to Termux successfully!"
          } catch {
              Write-Host "Failed to send to Termux: $_"
          }

      # ------------------------------------------------------------------
      # 8. CÔNG BỐ THÔNG TIN ĐĂNG NHẬP RUSTDESK
      # ------------------------------------------------------------------
      - name: Publish RustDesk login information
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rustdeskId = $env:RUSTDESK_ID
          
          $summary = @()
          $summary += "## Layer7 RustDesk Session Ready"
          $summary += ""
          $summary += "| Thông tin | Giá trị |"
          $summary += "|-----------|---------|"
          $summary += "| **Mã đơn hàng** | ``${{ inputs.instance_number }}`` |"
          $summary += "| **RustDesk ID** | ``$rustdeskId`` |"
          $summary += "| **Mật khẩu** | ``$env:SECRET_RDP_PASSWORD`` |"
          $summary += "| **Hostname** | ``$env:HOSTNAME`` |"
          $summary += ""
          $summary += "### Hướng dẫn kết nối"
          $summary += "1. Mở ứng dụng **RustDesk** trên máy của bạn."
          $summary += "2. Nhập **ID** ở trên vào ô ``Remote ID``."
          $summary += "3. Nhấn **Connect**."
          $summary += "4. Nhập **mật khẩu** khi được yêu cầu."
          $summary += ""
          $summary += "*Phiên sẽ tự động kết thúc sau khoảng $env:DUR phút.*"

          $summary -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding UTF8
          Write-Host "RustDesk login information published."

      # ------------------------------------------------------------------
      # 9. KEEPALIVE
      # ------------------------------------------------------------------
      - name: Keep session alive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $durationMin = [int]$env:DUR
          $loopMin = [math]::Max(5, $durationMin - 5)
          $endTime = (Get-Date).AddMinutes($loopMin)
          Write-Host "Keepalive started until approximately $($endTime.ToString('u'))."
          while ((Get-Date) -lt $endTime) {
              $svc = Get-Service -Name 'RustDesk' -ErrorAction SilentlyContinue
              if ($svc -and $svc.Status -ne 'Running') { Start-Service -Name 'RustDesk' -ErrorAction SilentlyContinue }
              Write-Host "[$(Get-Date -Format 'u')] RustDesk Service is $($svc.Status)"
              Start-Sleep -Seconds 60
          }
          Write-Host "Keepalive period ended."

      # ------------------------------------------------------------------
      # 10. PERSIST STATE VÀ UPLOAD ARTIFACT
      # ------------------------------------------------------------------
      - name: Persist allowed state
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $zipPath = Join-Path $env:PERSIST_DIR 'layer7-state.zip'
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force -ErrorAction SilentlyContinue }
          
          $user = $env:RDP_USER
          $allowedPaths = @("C:\Users\$user\Desktop", "C:\Users\$user\Documents", "C:\Users\$user\Downloads")
          $staging = Join-Path $env:TEMP_DIR 'persist-staging'
          if (Test-Path $staging) { Remove-Item $staging -Recurse -Force -ErrorAction SilentlyContinue }
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          
          foreach ($p in $allowedPaths) {
              if (Test-Path $p) { Copy-Item -Path $p -Destination (Join-Path $staging (Split-Path $p -Leaf)) -Recurse -Force -ErrorAction SilentlyContinue }
          }
          
          try {
              Compress-Archive -Path (Join-Path $staging '*') -DestinationPath $zipPath -Force -ErrorAction Stop
              Write-Host "State archive created: $zipPath"
          } catch { Write-Warning "Failed to create archive: $_" }

      - name: Upload state artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layer7-state
          path: C:\Layer7\persist\layer7-state.zip
          retention-days: 30
          if-no-files-found: warn

      # ------------------------------------------------------------------
      # 11. CLEANUP
      # ------------------------------------------------------------------
      - name: Finalize and cleanup
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host "--- Cleanup ---"
          Remove-Item (Join-Path $env:TEMP_DIR '*') -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "Cleanup done."
