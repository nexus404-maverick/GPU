name: ThyoCloud Workspace (Anywherelan P2P RDP)

on:
  workflow_dispatch:

jobs:
  deploy-workspace:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================================
      # STEP 1: SETUP RDP ACCOUNT
      # ============================================================
      - name: Setup RDP Account
        shell: powershell
        run: |
          Write-Host "Setting up RDP account..."
          $RPASS = -join ((1..12) | ForEach-Object { "abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#$"[(Get-Random -Maximum 68)] })
          
          net user Admin $RPASS /add
          net localgroup "Administrators" Admin /add
          net localgroup "Remote Desktop Users" Admin /add
          Set-LocalUser -Name Admin -PasswordNeverExpires $true

          "RDP_USER=Admin" >> $env:GITHUB_ENV
          "RDP_PASS=$RPASS" >> $env:GITHUB_ENV

      # ============================================================
      # STEP 2: APPLY XYDESK-HOST OPTIMIZATIONS
      # ============================================================
      - name: Apply XyDesk Host Optimizations
        shell: powershell
        run: |
          Write-Host "Applying XyDesk Host settings (120Hz, AVC444, Audio/Mic)..."

          $ErrorActionPreference = "SilentlyContinue"
          
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fSingleSessionPerUser" -Value 0
          
          $tsPolicy = "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"
          if (!(Test-Path $tsPolicy)) { New-Item -Path $tsPolicy -Force | Out-Null }
          
          New-ItemProperty -Path $tsPolicy -Name "fDenyTSConnections" -PropertyType DWord -Value 0 -Force | Out-Null
          New-ItemProperty -Path $tsPolicy -Name "fSingleSessionPerUser" -PropertyType DWord -Value 0 -Force | Out-Null
          New-ItemProperty -Path $tsPolicy -Name "bEnumerateHWBeforeSW" -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path $tsPolicy -Name "AVC444ModePreferred" -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path $tsPolicy -Name "AVCHardwareEncodePreferred" -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path $tsPolicy -Name "VGAdapter" -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path $tsPolicy -Name "fAllowFontAntiAlias" -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path $tsPolicy -Name "fAllowDesktopComposition" -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path $tsPolicy -Name "SelectTransport" -PropertyType DWord -Value 0 -Force | Out-Null
          New-ItemProperty -Path $tsPolicy -Name "fDisableAudio" -PropertyType DWord -Value 0 -Force | Out-Null
          New-ItemProperty -Path $tsPolicy -Name "fDisableAudioCapture" -PropertyType DWord -Value 0 -Force | Out-Null
          New-ItemProperty -Path $tsPolicy -Name "fDisableCam" -PropertyType DWord -Value 0 -Force | Out-Null
          New-ItemProperty -Path $tsPolicy -Name "DWMFRAMEINTERVAL" -PropertyType DWord -Value 16 -Force | Out-Null
          
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" -Name "fDisableAudio" -PropertyType DWord -Value 0 -Force | Out-Null
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" -Name "fDisableAudioCapture" -PropertyType DWord -Value 0 -Force | Out-Null
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "fDisableAudio" -PropertyType DWord -Value 0 -Force | Out-Null
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "fDisableAudioCapture" -PropertyType DWord -Value 0 -Force | Out-Null
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations" -Name "DWMFRAMEINTERVAL" -PropertyType DWord -Value 16 -Force | Out-Null
          
          foreach ($c in @(
              "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone",
              "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone\NonPackaged",
              "HKCU:\Software\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone",
              "HKCU:\Software\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone\NonPackaged"
          )) {
              if (-not (Test-Path $c)) { New-Item -Path $c -Force | Out-Null }
              Set-ItemProperty -Path $c -Name "Value" -Value "Allow" -Force | Out-Null
          }
          
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          netsh advfirewall firewall add rule name="XyDesk Remote RDP TCP" dir=in action=allow protocol=TCP localport=3389 | Out-Null
          netsh advfirewall firewall add rule name="XyDesk Remote RDP UDP" dir=in action=allow protocol=UDP localport=3389 | Out-Null
          netsh advfirewall firewall add rule name="XyDesk Remote QUIC UDP" dir=in action=allow protocol=UDP localport=4433 | Out-Null
          
          Set-Service -Name "AudioEndpointBuilder" -StartupType Automatic
          Start-Service -Name "AudioEndpointBuilder"
          Set-Service -Name "Audiosrv" -StartupType Automatic
          Start-Service -Name "Audiosrv"
          Start-Service TermService
          
          Write-Host "[SUCCESS] XyDesk Host Optimized!"

      # ============================================================
      # STEP 3: DOWNLOAD AND RUN ANYWARELAN (HEADLESS)
      # ============================================================
      - name: Download and Start Anywherelan (awl)
        shell: powershell
        run: |
          Write-Host "Downloading Anywherelan (headless)..."
          # Sử dụng phiên bản mới nhất của awl
          $awlUrl = "https://github.com/anywherelan/awl/releases/download/v0.20.0/awl-windows-amd64-v0.20.0.zip"
          $awlZip = "$env:RUNNER_TEMP\awl.zip"
          curl.exe -L --fail -o $awlZip $awlUrl
          
          if (-not (Test-Path $awlZip)) { throw "Failed to download Anywherelan." }
          
          Write-Host "Extracting Anywherelan..."
          Expand-Archive -Path $awlZip -DestinationPath "$env:RUNNER_TEMP\awl" -Force
          $awlExe = "$env:RUNNER_TEMP\awl\awl.exe"
          
          if (-not (Test-Path $awlExe)) { throw "awl.exe not found after extraction." }
          
          Write-Host "Starting Anywherelan in the background..."
          # Chạy awl headless (không GUI)
          Start-Process -FilePath $awlExe -WindowStyle Hidden
          
          Write-Host "Waiting for Anywherelan to initialize..."
          Start-Sleep -Seconds 20

      # ============================================================
      # STEP 4: GET ANYWARELAN PEER ID AND VPN IP
      # ============================================================
      - name: Get Anywherelan Peer ID and IP
        shell: powershell
        run: |
          $awlExe = "$env:RUNNER_TEMP\awl\awl.exe"
          
          Write-Host "Getting Peer ID..."
          # Lệnh lấy Peer ID theo tài liệu chính thức
          $peerId = (& $awlExe cli me id 2>&1) | Out-String
          $peerId = $peerId.Trim()
          
          if (-not $peerId) {
              Write-Host "[WARNING] Could not retrieve Peer ID. Retrying..."
              Start-Sleep -Seconds 10
              $peerId = (& $awlExe cli me id 2>&1) | Out-String
              $peerId = $peerId.Trim()
          }
          
          Write-Host "Peer ID: $peerId"
          "AWL_PEER_ID=$peerId" >> $env:GITHUB_ENV
          
          Write-Host "Getting VPN IP Address..."
          # Dải mạng mặc định của Anywherelan là 10.66.0.1/24
          $vpnIp = $null
          $attempts = 0
          while (-not $vpnIp -and $attempts -lt 10) {
              $vpnIp = (Get-NetIPAddress -AddressFamily IPv4 | Where-Object { $_.IPAddress -like "10.66.*" }).IPAddress
              if (-not $vpnIp) {
                  Start-Sleep -Seconds 3
                  $attempts++
              }
          }
          
          if ($vpnIp) {
              Write-Host "VPN IP: $vpnIp"
              "AWL_IP=$vpnIp" >> $env:GITHUB_ENV
          } else {
              Write-Host "[WARNING] Could not determine VPN IP automatically."
              "AWL_IP=Unknown (check logs)" >> $env:GITHUB_ENV
          }

      # ============================================================
      # STEP 5: SET WALLPAPER
      # ============================================================
      - name: Set Wallpaper
        shell: powershell
        run: |
          Write-Host "Setting up wallpaper..."
          $LocalWallpaper = Join-Path $env:GITHUB_WORKSPACE "Wallpaper\wallpaper.png"
          if (Test-Path $LocalWallpaper) {
              $DestWallpaper = "C:\Windows\Web\Wallpaper\thyo_bg.png"
              Copy-Item -Path $LocalWallpaper -Destination $DestWallpaper -Force
              
              $tsPolicyPath = "HKCU:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"
              New-Item -Path $tsPolicyPath -Force | Out-Null
              Set-ItemProperty -Path $tsPolicyPath -Name "fNoRemoteDesktopWallpaper" -Value 0 -Type DWord -Force
              
              $RegPath = "HKCU:\Control Panel\Desktop"
              Set-ItemProperty -Path $RegPath -Name Wallpaper -Value $DestWallpaper
              Set-ItemProperty -Path $RegPath -Name WallpaperStyle -Value "10"
              Set-ItemProperty -Path $RegPath -Name TileWallpaper -Value "0"
              
              $csharpCode = 'using System; using System.Runtime.InteropServices; public class Wallpaper { [DllImport("user32.dll", CharSet = CharSet.Auto)] public static extern int SystemParametersInfo(int uAction, int uParam, string lpvParam, int fuWinIni); }'
              Add-Type -TypeDefinition $csharpCode
              [Wallpaper]::SystemParametersInfo(20, 0, $DestWallpaper, 0x01 -bor 0x02)
          }

      # ============================================================
      # STEP 6: PUBLISH CONNECTION DETAILS
      # ============================================================
      - name: Publish Connection Details
        shell: powershell
        run: |
          $summaryFile = $env:GITHUB_STEP_SUMMARY
          
          Add-Content -Path $summaryFile -Value "## ThyoCloud Workspace (Anywherelan P2P)" -Encoding utf8
          Add-Content -Path $summaryFile -Value "" -Encoding utf8
          Add-Content -Path $summaryFile -Value "### Connection Details:" -Encoding utf8
          Add-Content -Path $summaryFile -Value ("- **VPN IP (Dùng IP này để kết nối):** " + $env:AWL_IP) -Encoding utf8
          Add-Content -Path $summaryFile -Value ("- **Username:** " + $env:RDP_USER) -Encoding utf8
          Add-Content -Path $summaryFile -Value ("- **Password:** " + $env:RDP_PASS) -Encoding utf8
          Add-Content -Path $summaryFile -Value "" -Encoding utf8
          Add-Content -Path $summaryFile -Value "### Peer ID của máy ảo:" -Encoding utf8
          Add-Content -Path $summaryFile -Value ("- **Peer ID:** " + $env:AWL_PEER_ID) -Encoding utf8
          Add-Content -Path $summaryFile -Value "" -Encoding utf8
          Add-Content -Path $summaryFile -Value "### How to connect:" -Encoding utf8
          Add-Content -Path $summaryFile -Value "1. Mở Anywherelan (awl-tray) trên máy tính của bạn." -Encoding utf8
          Add-Content -Path $summaryFile -Value "2. Mở Web UI (http://admin.awl)." -Encoding utf8
          Add-Content -Path $summaryFile -Value ("3. Thêm Peer ID của máy ảo: " + $env:AWL_PEER_ID) -Encoding utf8
          Add-Content -Path $summaryFile -Value "4. Mở Remote Desktop Connection (mstsc)." -Encoding utf8
          Add-Content -Path $summaryFile -Value ("5. Nhập IP: " + $env:AWL_IP + " vào ô Computer.") -Encoding utf8
          Add-Content -Path $summaryFile -Value "6. Nhập Username và Password ở trên." -Encoding utf8

      # ============================================================
      # STEP 7: KEEP SESSION ALIVE
      # ============================================================
      - name: Keep session alive
        shell: powershell
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] Session Active - Waiting for connection via Anywherelan..."
              Start-Sleep -Seconds 300
          }
